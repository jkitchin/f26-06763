# Jupyter Book 1.x configuration.
# Build with:  jupyter-book build .
# Docs: https://jupyterbook.org/en/stable/customize/config.html

title: Systems and Toolchains for AI Engineers
author: John Kitchin and Victor Alves
copyright: "2026"

# SECURITY-RELEVANT. The Pages site is public while this repo is private.
# By default Sphinx builds every source file it finds, whether or not it appears
# in _toc.yml, which would publish course/modules/ (instructor teaching notes) as
# reachable URLs even though they are absent from the navigation.
# This setting restricts the build to files listed in _toc.yml. Do not turn it off.
only_build_toc_files: true

exclude_patterns:
  - _build
  - _templates          # skeletons, not course content
  - course/modules      # instructor-facing planning notes, never published
  - "lectures/*/slides.md"  # MARP source, rendered separately by CI
  - "**.ipynb_checkpoints"
  - node_modules
  - .pytest_cache       # running the quiz tests must not break the book build
  - game                # Vite app, built separately by CI into _build/html/game
  - tools
  - README.md
  - readme.org
  - CLAUDE.md

# Demo notebooks are run by hand in class, not at build time. They may depend on
# data that is not in the repo, so executing them in CI would fail the build.
execute:
  execute_notebooks: 'off'


repository:
  url: https://github.com/jkitchin/f26-06763
  branch: main

# "Open in Colab" on every notebook page. Jupyter Book builds the link from the
# repository: block above, as
#   {colab_url}/github/{owner}/{repo}/blob/{branch}/{path to the .ipynb}
# so it resolves only while the repo is public and the notebook is on `main` at
# that path. A notebook renamed on a branch gets a button that 404s at Colab,
# which the book build cannot see.
# The button is added to notebook pages only, which is what we want: the notes
# are .md and there is nothing to launch.
launch_buttons:
  colab_url: https://colab.research.google.com
  notebook_interface: jupyterlab

html:
  use_repository_button: true
  use_issues_button: true
  home_page_in_navbar: false

parse:
  myst_enable_extensions:
    - colon_fence      # ::: admonition blocks
    - dollarmath       # $...$ and $$...$$
    - linkify
    - substitution

sphinx:
  config:
    html_show_copyright: false
    # Warn on a broken cross-reference rather than shipping a dead link.
    nitpicky: false
    # The general index at /genindex.html, built from the {index} entries in the
    # notes. Both keys are Sphinx defaults that Jupyter Book never sets, and both
    # are written down here because they are load-bearing. Turn html_use_index
    # off and the page disappears while every {ref}`genindex` link in the book
    # silently becomes dead. Turn html_split_index on and the index fans out into
    # genindex-A.html, genindex-B.html and so on, which the CI check does not
    # expect. Note that only_build_toc_files does not affect either: genindex is
    # written by the HTML builder rather than read from a source file, which is
    # also why it cannot be listed in _toc.yml.
    html_use_index: true
    html_split_index: false
    # Do NOT add html_theme_options here. Jupyter Book merges sphinx.config into
    # its own defaults without recursing, so setting it would replace the theme
    # options built from the html: block above and drop use_repository_button
    # and its neighbours.
