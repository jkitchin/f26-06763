<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>06-763 vote</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #14171a;
    --muted: #5b6570;
    --border: #d7dde3;
    --btn: #f4f6f8;
    --accent: #1a7f37;
    --accent-ink: #ffffff;
    --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --ink: #eef2f5; --muted: #9aa6b2; --border: #2c333a;
      --btn: #1e242a; --accent: #2da44e; --accent-ink: #08130c; --warn: #d9a441;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
  }
  header { text-align: center; margin-bottom: 10px; }
  h1 { font-size: 1.05rem; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
  .sub { color: var(--muted); font-size: 0.82rem; margin-top: 3px; }

  .grid { flex: 1; display: grid; grid-template-rows: repeat(4, 1fr); gap: 12px; margin: 12px 0; }
  button.opt {
    width: 100%; height: 100%; min-height: 64px;
    font-size: clamp(2rem, 12vw, 3.4rem); font-weight: 700;
    color: var(--ink); background: var(--btn);
    border: 2px solid var(--border); border-radius: 14px;
    cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform 0.06s ease, background 0.12s ease, border-color 0.12s ease;
  }
  button.opt:active { transform: scale(0.98); }
  button.opt[aria-pressed="true"] {
    background: var(--accent); border-color: var(--accent); color: var(--accent-ink);
  }
  button.opt:disabled { opacity: 0.5; cursor: default; }
  button.opt[aria-pressed="true"]:disabled { opacity: 1; }

  #status { text-align: center; min-height: 2.6em; font-size: 0.95rem; }
  #status.err { color: var(--warn); }
  footer { text-align: center; color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
</style>
</head>
<body>

<header>
  <h1>06-763 &middot; vote</h1>
  <div class="sub">Tap the answer shown on the screen.<br>You can change it until voting closes.</div>
</header>

<div class="grid" id="grid">
  <button class="opt" data-opt="A" aria-pressed="false">A</button>
  <button class="opt" data-opt="B" aria-pressed="false">B</button>
  <button class="opt" data-opt="C" aria-pressed="false">C</button>
  <button class="opt" data-opt="D" aria-pressed="false">D</button>
</div>

<div id="status" role="status" aria-live="polite"></div>

<footer>
  Anonymous. Nothing identifies you, and this is not counted for a grade.
  Changed your mind? Tap another letter; only your last answer counts.
  The pad clears itself between questions.
</footer>

<script>
(function () {
  'use strict';

  // Re-voting REPLACES your answer rather than adding to the tally: the server
  // counts only the most recent vote per device inside each question's window.
  // So there is no lock, just a short debounce against a double-fire.
  var DEBOUNCE_MS = 700;

  // The phone follows the question rather than guessing at it: /state says whether
  // one is running and when it stops, so the pad clears the moment voting closes
  // and again when a new question opens. The phone still never learns what the
  // question IS.
  var POLL_MS = 5000;

  // Fallback for when /state cannot be reached. A window is 45 to 60 seconds, so
  // this clears late rather than early, which is the safer way to be wrong.
  var CLEAR_MS = 75000;
  var LAST_KEY = 'f26-06763-clicker/last';
  var DEV_KEY  = 'f26-06763-clicker/device';

  var buttons = Array.prototype.slice.call(document.querySelectorAll('button.opt'));
  var statusEl = document.getElementById('status');
  var busy = false;

  function store(key, val) {
    try { localStorage.setItem(key, val); } catch (e) { /* private mode */ }
  }
  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  // A random pseudonym, not an identity. It exists so this phone can replace its
  // own earlier answer, and so the room count reflects people rather than taps.
  var device = load(DEV_KEY);
  if (!device || !/^[A-Za-z0-9_-]{8,64}$/.test(device)) {
    var bytes = new Uint8Array(12);
    (self.crypto || {}).getRandomValues
      ? self.crypto.getRandomValues(bytes)
      : bytes.forEach(function (_, i) { bytes[i] = Math.floor(Math.random() * 256); });
    device = Array.prototype.map
      .call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); })
      .join('');
    store(DEV_KEY, device);
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'err' : '';
  }

  var expiry = null;

  function clearChoice() {
    try { localStorage.removeItem(LAST_KEY); } catch (e) { /* private mode */ }
    paint(null, 'Ready for the next question.');
  }

  function paint(current, message) {
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.opt === current ? 'true' : 'false');
    });
    if (message) setStatus(message);
    else if (current) setStatus('Your answer: ' + current + '. Tap another to change it.');
    else setStatus('Ready.');

    if (expiry) { clearTimeout(expiry); expiry = null; }
    if (current) expiry = setTimeout(clearChoice, CLEAR_MS);
  }

  function vote(opt) {
    if (busy) return;
    busy = true;
    setStatus('Sending ' + opt + '\u2026');

    // Same origin as this page, so the response is readable and the student gets
    // a real confirmation instead of a fire-and-forget guess.
    fetch('v/' + opt + '?d=' + encodeURIComponent(device), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('server returned ' + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data || data.ok !== true) throw new Error((data && data.error) || 'rejected');
        store(LAST_KEY, opt);
        store(LAST_KEY + '/at', String(Date.now()));
        paint(opt);
      })
      .catch(function (err) {
        paint(load(LAST_KEY));
        setStatus('Not recorded (' + err.message + '). Tap again.', true);
      })
      .then(function () {
        setTimeout(function () { busy = false; }, DEBOUNCE_MS);
      });
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { vote(b.dataset.opt); });
  });

  /* ---- follow the question ------------------------------------------- */

  var seenStart = null;   // which question the pad is currently showing an answer to
  var closed = false;

  function follow() {
    if (document.hidden) return;          // no point polling a pocketed phone
    fetch('state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (st) {
        if (!st) return;

        // A different start means a different question. Clear whatever the student
        // answered last time so they begin this one on a blank pad.
        if (st.start && st.start !== seenStart) {
          seenStart = st.start;
          closed = false;
          clearChoice();
        }

        if (st.open) {
          var left = Math.max(0, Math.round((st.end - st.server_ts) / 1000));
          var mine = load(LAST_KEY);
          setStatus(mine
            ? 'Your answer: ' + mine + '. ' + left + 's left, tap another to change it.'
            : 'Voting is open, ' + left + 's left.');
        } else if (!closed) {
          // Voting just stopped. Clear the pad rather than leaving a stale answer
          // sitting under a question that has already been revealed.
          closed = true;
          clearChoice();
          setStatus('Voting closed.');
        }
      })
      .catch(function () { /* offline or blocked: the timed fallback still applies */ });
  }

  setInterval(follow, POLL_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) follow(); });
  follow();

  // On load, only restore a choice recent enough to still belong to the question
  // on screen. A stale one is worse than none: it shows an answer to a question
  // that has already been revealed.
  var lastAt = parseInt(load(LAST_KEY + '/at'), 10);
  if (load(LAST_KEY) && lastAt && Date.now() - lastAt < CLEAR_MS) {
    paint(load(LAST_KEY));
    expiry = setTimeout(clearChoice, CLEAR_MS - (Date.now() - lastAt));
  } else {
    clearChoice();
    setStatus('Ready.');
  }
})();
</script>

</body>
</html>
