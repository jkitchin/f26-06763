name: Weekly release reminder

# Opens an issue, and a draft PR that has already done the mechanical part, for
# the lectures due to go live in the coming week. Nothing reaches students from
# this workflow: it pushes a branch and opens a DRAFT pull request, and a human
# still merges.
#
# 5pm Wednesday, Pittsburgh time, which is two working days before the Monday
# lecture. The `timezone` key matters rather than being tidiness: the semester
# crosses the end of daylight saving on 2026-11-01, and a plain UTC cron would
# quietly start firing an hour early for the last month of the course.
on:
  schedule:
    - cron: '0 17 * * 3'
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write        # push the release branch
  issues: write          # open the reminder
  pull-requests: write   # open the draft PR

# Deliberately not the `pages` group used by book.yml. Sharing it would make a
# release reminder queue behind a deploy, or worse, look like one.
concurrency:
  group: release-week
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Work out what is due
        id: due
        # Empty output is the normal quiet case, not a failure: fall break, the
        # end of the semester, and any week already released all land here.
        run: |
          numbers=$(python3 tools/next_release.py --format numbers)
          if [ -z "$numbers" ]; then
            echo "Nothing due. $(python3 tools/next_release.py)"
            echo "due=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          first=$(echo "$numbers" | awk '{print $1}')
          {
            echo "due=$numbers"
            echo "first=$first"
            echo "branch=release-week-$first"
            echo "title=$(python3 tools/next_release.py --format title)"
          } >> "$GITHUB_OUTPUT"
          python3 tools/next_release.py

      - name: Skip if this reminder already exists
        id: dup
        if: steps.due.outputs.due != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.due.outputs.title }}
          BRANCH: ${{ steps.due.outputs.branch }}
        run: |
          # Either an open issue with this exact title, or a branch already
          # pushed, means a release is in flight. Opening a second one buries the
          # first rather than helping.
          if gh issue list --state open --limit 100 --json title \
               --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "An open issue titled \"$TITLE\" already exists."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on the remote."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Do the release on a branch
        if: steps.due.outputs.due != '' && steps.dup.outputs.skip == 'no'
        env:
          DUE: ${{ steps.due.outputs.due }}
          BRANCH: ${{ steps.due.outputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          for n in $DUE; do
            echo "::group::release_week.py $n"
            python3 tools/release_week.py "$n"
            echo "::endgroup::"
          done
          # -A on purpose: release_week.py regenerates game/src/map/world.json,
          # and CI's `tools/world.py --check` fails the build if that is left out.
          git add -A
          # Built in python rather than sed: \+ is a GNU extension, so the same
          # one-liner produces "Release 3, 4" on a BSD sed and silently loses the
          # word "Lecture". Not worth a portability puzzle in a commit message.
          subject=$(python3 -c "import os,sys; \
            print('Release ' + ', '.join('Lecture ' + n for n in os.environ['DUE'].split()))")
          git commit -m "$subject" -m "Opened by the weekly release reminder. Review the diff before merging: it should touch only _toc.yml, the quiz banks' status: lines, and the regenerated course map."
          git push -u origin "$BRANCH"

      - name: Open the draft PR and the issue
        if: steps.due.outputs.due != '' && steps.dup.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.due.outputs.branch }}
          TITLE: ${{ steps.due.outputs.title }}
        run: |
          python3 tools/next_release.py --format body > /tmp/body.md

          {
            echo "The mechanical part is done on \`$BRANCH\`. Check the diff, take"
            echo "it out of draft, and merge; CI deploys on merge to main."
            echo
            cat /tmp/body.md
          } > /tmp/pr.md

          pr=$(gh pr create --draft --base main --head "$BRANCH" \
                 --title "$TITLE" --body-file /tmp/pr.md)
          echo "Opened $pr"

          # A dedicated label makes these easy to find later and is what the
          # duplicate check above would use if titles ever change.
          gh label create release-week --color BFD4F2 \
            --description "Weekly content release" 2>/dev/null || true

          {
            echo "Draft PR: $pr"
            echo
            echo "It has already run \`tools/release_week.py\` for each lecture, so CI"
            echo "has told you whether the release builds. Nothing is live until it is"
            echo "merged."
            echo
            cat /tmp/body.md
          } > /tmp/issue.md

          gh issue create --title "$TITLE" --body-file /tmp/issue.md \
            --assignee jkitchin --assignee victoraalves \
            --label course-admin --label release-week

      - name: Say why nothing happened
        if: steps.due.outputs.due == '' || steps.dup.outputs.skip == 'yes'
        run: echo "No reminder opened this week. See the steps above for the reason."
