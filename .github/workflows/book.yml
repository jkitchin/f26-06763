name: Build and deploy course site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quiz:
    # Its own job, ahead of the book build, because it takes about a second and
    # the build takes five minutes, 134s of which is installing TeX. A broken
    # quiz item should not cost that before it reports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pip install pyyaml pytest

      - name: Check the quiz bank still matches the lecture notes
        # The rule: every item's quoted span must appear verbatim in the file it
        # cites, and its needle must appear inside that quote. This exists
        # because the L11 and L13 figure headers drifted from their own notes
        # without anybody noticing, and a bank drafted against the wrong side
        # would ship a wrong answer.
        run: python game/validate.py

      - name: Check the lecture graph matches the notes
        # The course map draws a corridor for every cross-link one lecture makes
        # of another, so the graph has to be regenerated rather than trusted.
        # This also catches two things nothing else does: a link whose text
        # names one lecture while its href points at another (five of those
        # existed), and a link to a lecture that has no notes.md.
        run: python tools/graph.py --check

      - name: Check every served pool version is archived
        # tools/verify_evidence.py re-derives a student's item set to check it,
        # and item selection is a function of the whole pool, so adding one item
        # to a bank changes which items every student is served. Without an
        # archive, a PDF issued in week 3 and verified in week 9 is compared
        # against a derivation that never existed, and the honest student comes
        # back "item set is not the one jkitchin derives to".
        #
        # So the rule is: change a pool, bump its pool_version, archive it. This
        # fails the build on the one mistake that produces the silent version,
        # which is editing a bank and leaving pool_version alone.
        run: python tools/pool_archive.py --check

      - name: Check the map world matches the schedule and the graph
        # The map's rooms are the sessions in course/schedule.md, its regions
        # are the arcs the notes declare, and its corridors are the edges the
        # step above verified. Regenerating rather than trusting caught a
        # schedule parser that silently dropped L18 and L19, which would have
        # shipped a map with a room missing and five corridors leading out of
        # nothing.
        run: python tools/world.py --check

      - name: Check the two derivations still agree
        # game/src/seed.ts and tools/derive.py must produce identical item
        # selections forever. A divergence is invisible until students submit,
        # at which point it fails every honest PDF at once. The vectors are
        # generated by the TypeScript side and replayed through Python here.
        #
        # Regenerated rather than trusted: a committed vectors.json that was
        # never rebuilt would keep passing after seed.ts changed underneath it,
        # which is the exact failure this job exists to prevent.
        run: |
          cd game && npm ci --no-audit --no-fund && npm run vectors && cd ..
          git diff --exit-code --stat game/tests/vectors.json || {
            echo "::error::game/tests/vectors.json is stale. Run 'npm run vectors' in game/ and commit the result."
            exit 1
          }
          python tools/check_vectors.py

      - name: Run the quiz tests
        run: python -m pytest game/tests/ -q

      - name: Issue sample PDFs and verify them end to end
        # The two halves of the evidence chain are written in different
        # languages and only meet here. Everything above this checks one side:
        # the vectors prove the derivations agree, pytest proves the properties
        # hold, and neither notices if the app writes a payload the verifier
        # will not read.
        #
        # That is not hypothetical. Bumping SCHEMA in payload.ts without
        # bumping it in verify_evidence.py made every PDF report UNREADABLE,
        # which is the false-positive bucket, so the failure would have reached
        # a TA as "your file is corrupt" addressed to students who did nothing
        # wrong. Green everywhere else at the time.
        #
        # The samples are gitignored, so they are built here rather than
        # committed, which also means they cannot go stale.
        run: |
          pip install pypdf
          cd game && npm run --silent samples && cd ..
          python tools/verify_evidence.py game/tests/samples/ \
            --pool game/content/l15.yml | tee /tmp/verify.txt

          # The expected shape of that run, asserted rather than eyeballed. Two
          # honest first attempts, one honest *second* attempt, and the three
          # forgeries the samples exist to demonstrate.
          python - <<'PY'
          import re, sys
          text = open('/tmp/verify.txt').read()
          rows = [l for l in text.splitlines() if re.search(r'\b(PASS|REVIEW|UNREADABLE)\s*$', l)]
          fails = []

          tally = text.strip().splitlines()
          if '3 PASS, 2 REVIEW, 1 UNREADABLE' not in text:
              fails.append('verdict tally is not 3 PASS, 2 REVIEW, 1 UNREADABLE')

          # The retake must verify. If the attempt is not carried in the payload
          # and used to re-derive, this row fails `drv` and an honest student
          # who practised twice is sent to their instructor.
          a2 = [r for r in rows if re.search(r'\s2\s+\d+s', r) and r.rstrip().endswith('PASS')]
          if not a2:
              fails.append('no PASSing attempt-2 row: a legitimate retake does not verify')

          # Every passing row must carry a participation score, since that is
          # the number the whole change exists to deliver to a gradebook.
          for r in rows:
              if r.rstrip().endswith('PASS') and not re.search(r'\d+%', r):
                  fails.append(f'passing row has no score: {r.strip()}')

          if fails:
              for f in fails:
                  print(f'::error::{f}')
              sys.exit(1)
          print('evidence chain OK: honest work passes, retakes verify, forgeries do not')
          PY

      - name: Run the game's logic tests
        # These existed and ran nowhere. Plain node scripts under
        # --experimental-strip-types, no browser and no build, about a second
        # between them. persistence is the one that matters most: it is the
        # only thing asserting that a finished module stays finished when a
        # bank grows, and it was passing on laptops and checked by nothing.
        #
        # The browser suites (routes, nav, smoke) are NOT here. They serve
        # game/dist/, so they belong after the build, in the build job.
        run: |
          cd game
          for suite in mastery persistence map; do
            echo "--- $suite"
            npm run --silent "$suite"
          done

      - name: Typecheck the game
        run: cd game && npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          # 22.6+ for --experimental-strip-types, which the game's tests run
          # under. Matches the quiz job so the two cannot drift.
          node-version: "24"

      - name: Check the A1 evidence checksum matches the script
        # Students are told to compare the sha256 the report prints against
        # a01-evidence.py.sha256 on the site, and a TA is told to do the same. If
        # the script is edited and the checksum is not regenerated, every honest
        # submission mismatches at once and the error lands on students who did
        # nothing wrong. That is the same false-positive shape as bumping SCHEMA
        # in one place only, so it is checked here rather than remembered.
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import sys

          script = pathlib.Path("course/assignments/a01-evidence.py")
          published = pathlib.Path("course/assignments/a01-evidence.py.sha256")
          digest = hashlib.sha256(script.read_bytes()).hexdigest()
          recorded = published.read_text().split()[0]
          if digest != recorded:
              sys.exit(
                  f"{published} records {recorded}\nbut {script} hashes to {digest}\n"
                  f"Regenerate it:\n"
                  f"  shasum -a 256 {script} | "
                  f"awk '{{print $1\"  a01-evidence.py\"}}' > {published}"
              )
          print(f"A1 evidence checksum matches: {digest}")
          PY

      - name: Check every lecture carries index entries
        # The general index is only as good as the entries somebody remembered to
        # write, and a lecture that ships without them fails nothing on its own:
        # the build is green, the page renders, the term simply is not in the
        # index. So check the source. The entry text is checked too, because
        # Sphinx's parser splits on commas and semicolons and reads a leading
        # word-plus-colon as an index type, so a stray one turns a term into two
        # wrong ones with no warning anywhere. See CLAUDE.md section 4b.
        #
        # This runs before anything is installed so it fails in seconds rather
        # than after the TeX install.
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          # Below the twelve-to-twenty authoring target, so a lecture that comes
          # in slightly light does not block a merge, while one that forgot does.
          MIN_PER_LECTURE = 10
          TYPES = ("single:", "pair:", "triple:", "double:", "see:", "seealso:")
          # Sphinx reads these as legacy Python index types.
          RESERVED = ("module:", "keyword:", "operator:", "object:",
                      "exception:", "statement:")
          # Everything Sphinx's LaTeX writer does not escape on our behalf.
          BAD = set('|"\\{}$%#^~<>')

          problems, totals, forms = [], {}, {}


          def record(path, field):
              field = field.strip()
              if not field:
                  problems.append(f"{path}: empty index entry field")
                  return
              bad = BAD.intersection(field)
              if bad:
                  problems.append(
                      f"{path}: entry {field!r} contains {''.join(sorted(bad))}")
              if not field.isascii():
                  # The PDF index is set by makeindex, which sorts non-ASCII
                  # badly. _config.yml picks it over xindy on purpose.
                  problems.append(f"{path}: entry {field!r} is not ASCII")
              # "Parquet" and "parquet files" must not both become entries.
              key = " ".join(field.casefold().split()).rstrip("s")
              forms.setdefault(key, set()).add(field)


          def entries(path, arg):
              body = arg[1:].lstrip() if arg.startswith("!") else arg.strip()
              lowered = body.lower()
              if lowered.startswith(RESERVED):
                  problems.append(
                      f"{path}: {body!r} starts with a reserved index type")
              if lowered.startswith(TYPES):
                  for field in body.split(":", 1)[1].split(";"):
                      record(path, field)
                  return 1
              values = [v for v in body.split(",") if v.strip()]
              for value in values:
                  record(path, value.lstrip("! "))
              return len(values)


          for path in sorted(glob.glob("lectures/*/notes.md")):
              text = open(path, encoding="utf-8").read()
              count = 0
              for arg in re.findall(r"^```\{index\}[ \t]+(.+?)[ \t]*$", text, re.M):
                  count += entries(path, arg)
              totals[path] = count
              if count < MIN_PER_LECTURE:
                  problems.append(
                      f"{path}: {count} index entries, "
                      f"need at least {MIN_PER_LECTURE}")

          for key, variants in sorted(forms.items()):
              if len(variants) > 1:
                  problems.append("index term written more than one way: "
                                  + " / ".join(repr(v) for v in sorted(variants)))

          for path, count in totals.items():
              print(f"{path}: {count} index entries")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"OK: {sum(totals.values())} index entries "
                f"across {len(totals)} lectures")
          PY

      - name: Install Jupyter Book
        # Pinned to 1.x. Jupyter Book 2 (MyST) derives page URLs from the file
        # basename, so every lectures/*/notes.md would collapse onto a single
        # /notes URL, silently. 1.x mirrors the directory structure instead.
        run: pip install "jupyter-book<2"

      - name: Build the book
        run: jupyter-book build . --warningiserror --keep-going

      - name: Check the general index was built and is populated
        # genindex.html is a builder output rather than a source file, so nothing
        # else here would notice it going missing or coming out empty. Count the
        # per-entry anchors Sphinx emits (not the theme's markup, so a theme
        # upgrade does not break the check). The floor scales with the number of
        # RELEASED lectures in _toc.yml, because the course ships one week at a
        # time: each lecture carries at least a dozen {index} entries, so eight
        # per released lecture is a safe floor that still catches an empty or
        # broken index without hard-coding a whole-course number.
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          released = len(re.findall(
              r"^\s*-\s*file:\s*lectures/l\d\d/notes",
              Path("_toc.yml").read_text(encoding="utf-8"), re.M))
          min_anchors = max(8, 8 * released)

          page = Path("_build/html/genindex.html")
          if not page.exists():
              print("::error::no _build/html/genindex.html; "
                    "is html_use_index still true in _config.yml?")
              sys.exit(1)

          anchors = len(re.findall(r"#index-\d+", page.read_text(encoding="utf-8")))
          if anchors < min_anchors:
              print(f"::error::genindex.html has {anchors} indexed targets, "
                    f"expected at least {min_anchors} for {released} released lecture(s)")
              sys.exit(1)
          print(f"OK: genindex.html carries {anchors} indexed targets "
                f"for {released} released lecture(s)")
          PY

      - name: Render MARP slide decks
        # Each deck renders into its OWN directory as index.html, and that
        # lecture's figures/ are copied in beside it. MARP does not inline local
        # images, it emits <img src="figures/x.png">, so the relative path has to
        # resolve identically whether the deck is opened from lectures/lNN/ during
        # authoring or served from /slides/lNN/ in production.
        #
        # Only decks whose lecture is RELEASED in _toc.yml are rendered, so the
        # course ships one week at a time: a lecture commented out of _toc.yml
        # keeps its slides off the public site, matching its notes. Same lever
        # tools/world.py and game/validate.py read.
        run: |
          shopt -s nullglob
          released=$(grep -oE '^[[:space:]]*-[[:space:]]*file:[[:space:]]*lectures/l[0-9][0-9]/notes' _toc.yml | grep -oE 'l[0-9][0-9]')
          for deck in lectures/*/slides.md; do
            id=$(basename "$(dirname "$deck")")
            if ! grep -qx "$id" <<< "$released"; then
              echo "Skipping $id: not released in _toc.yml"
              continue
            fi
            out="_build/html/slides/$id"
            mkdir -p "$out"
            echo "Rendering $deck -> slides/$id/"
            npx -y @marp-team/marp-cli@latest "$deck" \
              --html \
              -o "$out/index.html"
            if compgen -G "lectures/$id/figures/*.png" > /dev/null; then
              mkdir -p "$out/figures"
              cp lectures/"$id"/figures/*.png "$out/figures/"
            fi
          done

      - name: Check every slide image actually resolves
        # A missing figure renders as a silent broken image in the deck. Catch it
        # in CI instead of in front of a lecture hall.
        run: |
          fail=0
          for html in _build/html/slides/*/index.html; do
            dir=$(dirname "$html")
            for src in $(grep -o 'src="[^"]*\.png"' "$html" | sed 's/src="//; s/"//'); do
              if [ ! -f "$dir/$src" ]; then
                echo "::error::$html references missing image $src"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Build the practice game
        # Same pattern as the MARP step above: a non-Sphinx artifact built
        # separately and copied into the output tree before it is uploaded.
        # VITE_MAC_KEY is what the evidence PDFs are stamped with; without the
        # secret the build falls back to a well-known development key and marks
        # the PDFs key_id "dev", which the next step refuses to publish.
        env:
          VITE_MAC_KEY: ${{ secrets.GAME_MAC_KEY }}
          VITE_KEY_ID: ${{ secrets.GAME_MAC_KEY && 'f26-k1' || 'dev' }}
          VITE_BUILD_COMMIT: ${{ github.sha }}
        run: |
          cd game
          npm ci --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p _build/html/game
          cp -r game/dist/* _build/html/game/

      - name: Drive the built game in a browser
        # The only checks that exercise the assembled bundle rather than a
        # layer of it. They mount the app at the deployed base path, walk the
        # routes, finish a module, walk the map, and download the evidence PDF.
        # A wrong Vite base renders a blank page that every file-exists check
        # happily passes, which is why these run against dist/ after the real
        # build rather than against source.
        #
        # They use the runner's google-chrome-stable through puppeteer-core,
        # the same browser the slides PDF step above needs, so they add no
        # download. routes and nav hardcoded a macOS Chrome path until
        # tests/chrome.ts; that is why they had never run here.
        run: |
          cd game
          for suite in routes nav smoke; do
            echo "--- $suite"
            npm run --silent "$suite"
          done

      - name: Check the game actually resolves its assets
        # A wrong Vite `base` produces an index.html that exists, is 200, and
        # renders a blank page because every asset 404s. Every other check in
        # this workflow passes on that, which is exactly why this one greps for
        # the deployed path rather than for the file.
        run: |
          html=_build/html/game/index.html
          test -f "$html" || { echo "::error::the game did not build"; exit 1; }
          grep -q '/f26-06763/game/assets/' "$html" || {
            echo "::error::$html has no /f26-06763/game/assets/ references; the Vite base is wrong"
            grep -o 'src="[^"]*"' "$html" || true
            exit 1
          }
          for asset in $(grep -o '/f26-06763/game/assets/[^"]*' "$html"); do
            test -f "_build/html${asset#/f26-06763}" || {
              echo "::error::$html references missing asset $asset"; exit 1; }
          done
          echo "OK: the game's assets resolve"

      - name: Refuse to publish evidence PDFs signed with the dev key
        # A missing repository secret would otherwise ship silently, and every
        # PDF issued all semester would carry a key that is published in the
        # source tree. Better to fail the deploy than to find out in December.
        if: github.ref == 'refs/heads/main'
        run: |
          if grep -rqs '"dev"' _build/html/game/assets/*.js && \
             ! grep -rqs 'f26-k1' _build/html/game/assets/*.js; then
            echo "::error::the game was built without GAME_MAC_KEY; set the repository secret"
            exit 1
          fi
          echo "OK: the game is not using the development key"

      - name: Check the build produced something
        run: |
          test -f _build/html/index.html || { echo "::error::book build produced no index.html"; exit 1; }
          echo "Slide decks rendered:"
          ls -1 _build/html/slides/ 2>/dev/null || echo "  (none yet)"

      - name: Verify no instructor-only material was published
        # The Pages site is public while the repo is private. course/modules/
        # holds teaching notes and must never be reachable. Fail loudly if it is.
        run: |
          if find _build/html -path "*modules*" -name "*.html" | grep -q .; then
            echo "::error::instructor material from course/modules/ was published"
            find _build/html -path "*modules*" -name "*.html"
            exit 1
          fi
          echo "OK: no course/modules/ pages in the build output"

      - name: Stamp the build with the commit it came from
        # Read back off the live site by the verify job below, which is the only
        # way to tell a fresh deploy from a stale one. Useful on its own too:
        # /f26-06763/build-info.json answers "what is actually published right
        # now", which is a different question from "did the last run go green".
        run: |
          cat > _build/html/build-info.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat _build/html/build-info.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only publish from main. PRs build as a check but do not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # A green deploy job is not evidence that the site updated.
    #
    # On 2026-08-06 the build job succeeded, actions/deploy-pages sat in
    # deployment_queued for ten minutes and timed out, and the published site
    # silently stayed on the previous commit while the run's build job still
    # showed green. A second attempt reported queued for hours. Nothing in this
    # workflow noticed, and the way it was eventually caught was a human
    # fetching a lecture URL by hand and getting a 404.
    #
    # So: read the stamp the build job baked in, off the live site, and require
    # it to name this commit. This is the deploy-time version of the rule in
    # CLAUDE.md section 8, that HTTP 200 is not evidence a page rendered.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site is serving this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "::error::deploy produced no page_url; cannot verify the deploy"
            exit 1
          fi
          url="${PAGE_URL%/}/build-info.json"
          echo "Expecting $url to report commit $EXPECTED"

          # Pages reports success slightly before the CDN serves the new build,
          # so poll rather than fetching once. Roughly three minutes; a deploy
          # that has not propagated by then has not propagated.
          live=""
          for attempt in $(seq 1 18); do
            # The cache buster is not superstition: without it an edge cache can
            # keep answering with the previous build and the check passes or
            # fails on stale data.
            body=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                     "${url}?cachebust=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)
            live=$(printf '%s' "$body" \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$live" = "$EXPECTED" ]; then
              echo "OK: the live site is serving $EXPECTED"
              printf '%s\n' "$body"
              exit 0
            fi
            echo "attempt ${attempt}/18: live=${live:-<unreachable>}"
            sleep 10
          done

          echo "::error::deploy reported success but ${PAGE_URL} is serving ${live:-nothing}, not ${EXPECTED}"
          echo "::error::the site is stale. Check https://www.githubstatus.com for a Pages incident, then re-run this workflow."
          exit 1
