name: Build and deploy course site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every lecture carries index entries
        # The general index is only as good as the entries somebody remembered to
        # write, and a lecture that ships without them fails nothing on its own:
        # the build is green, the page renders, the term simply is not in the
        # index. So check the source. The entry text is checked too, because
        # Sphinx's parser splits on commas and semicolons and reads a leading
        # word-plus-colon as an index type, so a stray one turns a term into two
        # wrong ones with no warning anywhere. See CLAUDE.md section 4b.
        #
        # This runs before anything is installed so it fails in seconds rather
        # than after the TeX install.
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          # Below the twelve-to-twenty authoring target, so a lecture that comes
          # in slightly light does not block a merge, while one that forgot does.
          MIN_PER_LECTURE = 10
          TYPES = ("single:", "pair:", "triple:", "double:", "see:", "seealso:")
          # Sphinx reads these as legacy Python index types.
          RESERVED = ("module:", "keyword:", "operator:", "object:",
                      "exception:", "statement:")
          # Everything Sphinx's LaTeX writer does not escape on our behalf.
          BAD = set('|"\\{}$%#^~<>')

          problems, totals, forms = [], {}, {}


          def record(path, field):
              field = field.strip()
              if not field:
                  problems.append(f"{path}: empty index entry field")
                  return
              bad = BAD.intersection(field)
              if bad:
                  problems.append(
                      f"{path}: entry {field!r} contains {''.join(sorted(bad))}")
              if not field.isascii():
                  # The PDF index is set by makeindex, which sorts non-ASCII
                  # badly. _config.yml picks it over xindy on purpose.
                  problems.append(f"{path}: entry {field!r} is not ASCII")
              # "Parquet" and "parquet files" must not both become entries.
              key = " ".join(field.casefold().split()).rstrip("s")
              forms.setdefault(key, set()).add(field)


          def entries(path, arg):
              body = arg[1:].lstrip() if arg.startswith("!") else arg.strip()
              lowered = body.lower()
              if lowered.startswith(RESERVED):
                  problems.append(
                      f"{path}: {body!r} starts with a reserved index type")
              if lowered.startswith(TYPES):
                  for field in body.split(":", 1)[1].split(";"):
                      record(path, field)
                  return 1
              values = [v for v in body.split(",") if v.strip()]
              for value in values:
                  record(path, value.lstrip("! "))
              return len(values)


          for path in sorted(glob.glob("lectures/*/notes.md")):
              text = open(path, encoding="utf-8").read()
              count = 0
              for arg in re.findall(r"^```\{index\}[ \t]+(.+?)[ \t]*$", text, re.M):
                  count += entries(path, arg)
              totals[path] = count
              if count < MIN_PER_LECTURE:
                  problems.append(
                      f"{path}: {count} index entries, "
                      f"need at least {MIN_PER_LECTURE}")

          for key, variants in sorted(forms.items()):
              if len(variants) > 1:
                  problems.append("index term written more than one way: "
                                  + " / ".join(repr(v) for v in sorted(variants)))

          for path, count in totals.items():
              print(f"{path}: {count} index entries")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"OK: {sum(totals.values())} index entries "
                f"across {len(totals)} lectures")
          PY

      - name: Install Jupyter Book
        # Pinned to 1.x. Jupyter Book 2 (MyST) derives page URLs from the file
        # basename, so every lectures/*/notes.md would collapse onto a single
        # /notes URL, silently. 1.x mirrors the directory structure instead.
        run: pip install "jupyter-book<2" pypdf

      - name: Install TeX for the PDF build
        # xelatex, not pdflatex: the sources carry non-ASCII engineering
        # notation (arrows, box drawing, Greek, superscripts, the micro sign)
        # that pdflatex will not set without a declaration per character.
        # fonts-freefont-otf supplies FreeSerif/FreeSans/FreeMono, which is what
        # Sphinx's xelatex configuration asks for and where the glyph coverage
        # comes from.
        #
        # The document loads 61 CTAN bundles, and the two -extra packages are
        # not optional padding. They were derived from course.fls after a local
        # build, then each uncertain file was looked up in the Ubuntu package
        # index rather than guessed:
        #   texlive-fonts-extra  bbm.sty (loaded transitively; the first CI
        #                        failure was "File `bbm.sty' not found"),
        #                        fontawesome5.sty
        #   texlive-pictures     pict2e.sty, ellipse.sty
        # A local TeX Live install is usually far more complete than this, so a
        # PDF that builds on a laptop does not prove the CI package set. Check
        # course.fls, not your own machine.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra texlive-pictures \
            fonts-freefont-otf latexmk

      - name: Build the book
        run: jupyter-book build . --warningiserror --keep-going

      - name: Check the general index was built and is populated
        # genindex.html is a builder output rather than a source file, so it is
        # in neither _toc.yml nor the sidebar and nothing else here would notice
        # it going missing or coming out empty. Count the per-entry anchors that
        # Sphinx emits rather than the theme's markup, so a theme upgrade does
        # not break the check. The floor is the 316 anchors the fourteen
        # backfilled lectures produce, less a margin.
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          MIN_ANCHORS = 250
          page = Path("_build/html/genindex.html")
          if not page.exists():
              print("::error::no _build/html/genindex.html; "
                    "is html_use_index still true in _config.yml?")
              sys.exit(1)

          html = page.read_text(encoding="utf-8")
          anchors = len(re.findall(r"#index-\d+", html))

          problems = []
          if anchors < MIN_ANCHORS:
              problems.append(
                  f"{anchors} indexed targets, expected at least {MIN_ANCHORS}")
          # Both ends of the semester, and the two clusters that make the index
          # worth having.
          for probe, label in [
              ("Parquet", "L4"),
              ("re-ranking", "L17"),
              ("case study", "the case-study cluster"),
              ("failure mode", "the failure-mode cluster"),
          ]:
              if probe not in html:
                  problems.append(f"nothing from {label} (probe {probe!r})")

          if problems:
              for problem in problems:
                  print(f"::error::genindex.html {problem}")
              sys.exit(1)
          print(f"OK: genindex.html carries {anchors} indexed targets")
          PY

      - name: Build the course PDF
        # The whole course as one document. Config lives under `latex:` in
        # _config.yml. This is deliberately not restricted to main: a PDF that
        # only breaks after merge is exactly the silent failure the rest of this
        # workflow exists to prevent.
        run: |
          jupyter-book build . --builder pdflatex
          # The index at the end of the PDF is typeset by makeindex under
          # latexmk, and nothing in that chain fails loudly: skip it and
          # \printindex simply emits nothing, leaving a blank Index page. The
          # .ind file is the evidence the chain ran. makeindex comes from
          # texlive-binaries, which latexmk depends on, and _config.yml sets
          # latex_use_xindy: false so that is the binary latexmkrc asks for.
          test -s _build/latex/course.ind || {
            echo "::error::makeindex produced no course.ind, so the PDF's Index is empty"
            echo "Index processor configured in _build/latex/latexmkrc:"
            grep makeindex _build/latex/latexmkrc || true
            command -v makeindex || echo "makeindex is not installed"
            exit 1
          }
          cp _build/latex/course.pdf _build/html/course.pdf

      - name: Check the PDF is a whole course and not a stub
        # A LaTeX run can succeed and still produce something truncated, so
        # check the artifact rather than the exit code: it has to be book-sized
        # and it has to contain text from both ends of the semester.
        run: |
          python - <<'PY'
          import sys
          from pypdf import PdfReader

          reader = PdfReader("_build/html/course.pdf")
          pages = len(reader.pages)
          text = "\n".join((p.extract_text() or "") for p in reader.pages)

          problems = []
          if pages < 200:
              problems.append(f"only {pages} pages; expected a whole course")
          for probe, label in [
              ("tiny in proportion", "L1"),
              ("retrieval", "L17"),
              ("Grading", "the syllabus"),
              ("→", "non-ASCII typography (font coverage)"),
          ]:
              if probe not in text:
                  problems.append(f"no text from {label} (probe {probe!r})")

          if problems:
              for p in problems:
                  print(f"::error::course.pdf {p}")
              sys.exit(1)
          print(f"OK: course.pdf is {pages} pages, {len(text.split()):,} words")
          PY

      - name: Render MARP slide decks
        # Each deck renders into its OWN directory as index.html, and that
        # lecture's figures/ are copied in beside it. MARP does not inline local
        # images, it emits <img src="figures/x.png">, so the relative path has to
        # resolve identically whether the deck is opened from lectures/lNN/ during
        # authoring or served from /slides/lNN/ in production.
        run: |
          shopt -s nullglob
          for deck in lectures/*/slides.md; do
            id=$(basename "$(dirname "$deck")")
            out="_build/html/slides/$id"
            mkdir -p "$out"
            echo "Rendering $deck -> slides/$id/"
            npx -y @marp-team/marp-cli@latest "$deck" \
              --html \
              -o "$out/index.html"
            if compgen -G "lectures/$id/figures/*.png" > /dev/null; then
              mkdir -p "$out/figures"
              cp lectures/"$id"/figures/*.png "$out/figures/"
            fi
          done

      - name: Check every slide image actually resolves
        # A missing figure renders as a silent broken image in the deck. Catch it
        # in CI instead of in front of a lecture hall.
        run: |
          fail=0
          for html in _build/html/slides/*/index.html; do
            dir=$(dirname "$html")
            for src in $(grep -o 'src="[^"]*\.png"' "$html" | sed 's/src="//; s/"//'); do
              if [ ! -f "$dir/$src" ]; then
                echo "::error::$html references missing image $src"
                fail=1
              fi
            done
          done
          exit $fail

      - name: Build slides.pdf, every deck as one document
        # The companion to course.pdf: the notes are one PDF, the decks are the
        # other, both at the site root.
        #
        # Two things about this are easy to get wrong. MARP's PDF export goes
        # through headless Chrome (there is no other path), so a browser has to
        # exist; the runner image ships google-chrome-stable, and the fallback
        # fetches Chrome for Testing rather than apt chromium, which on Ubuntu 24
        # is a snap wrapper that will not run here. And --allow-local-files is
        # required or every figures/*.png is dropped from the PDF. The HTML
        # export needs no such flag, so this fails silently and only in the PDF.
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome \
                         || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chrome on the runner; fetching Chrome for Testing"
            CHROME_PATH="$(npx -y puppeteer@latest browsers install chrome | awk '{print $NF}')"
          fi
          export CHROME_PATH
          echo "Rendering deck PDFs with $CHROME_PATH"

          mkdir -p _build/slides-pdf
          shopt -s nullglob
          for deck in lectures/*/slides.md; do
            id=$(basename "$(dirname "$deck")")
            npx -y @marp-team/marp-cli@latest "$deck" \
              --pdf \
              --allow-local-files \
              -o "_build/slides-pdf/$id.pdf"
          done

          python - <<'PY'
          from pathlib import Path

          from pypdf import PdfReader, PdfWriter


          def session_order(deck_id):
              # Lecture number, then the Week 8 mini-project sessions, which sit
              # between L14 and L15 in course/schedule.md and would otherwise sort
              # to the end of the document on their filename.
              if deck_id.startswith("mp"):
                  return (14, int(deck_id[2:]))
              return (int(deck_id[1:]), 0)


          def deck_title(deck_id):
              for line in Path(f"lectures/{deck_id}/slides.md").read_text().splitlines():
                  if line.startswith("# "):
                      return line[2:].strip()
              return deck_id.upper()


          decks = sorted((p.parent.name for p in Path("lectures").glob("*/slides.md")),
                         key=session_order)

          writer = PdfWriter()
          for deck_id in decks:
              source = f"_build/slides-pdf/{deck_id}.pdf"
              title = deck_title(deck_id)
              # One bookmark per session, so the merged document is navigable
              # rather than several hundred undifferentiated pages.
              writer.append(source, outline_item=title)
              print(f"{deck_id}: {len(PdfReader(source).pages)} slides, {title}")

          writer.write("_build/html/slides.pdf")
          print(f"slides.pdf: {len(decks)} decks, {len(PdfReader('_build/html/slides.pdf').pages)} pages")
          PY

      - name: Check slides.pdf is every deck, whole, with its figures
        # Same reasoning as the course.pdf check: a Chrome run can succeed and
        # still emit something truncated or picture-free. Three invariants, each
        # of which has a real failure behind it:
        #   pages       one page per slide, so a deck that rendered short is caught
        #   title text  the deck is present and its text is text, not a bitmap
        #   images      the figures survived, which is what --allow-local-files buys
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          from pypdf import PdfReader


          def expected_slides(source):
              # MARP breaks a deck on a thematic-break `---`. Skip the YAML
              # frontmatter, ignore anything inside a code fence, and require the
              # preceding line to be blank, which is what separates a page break
              # from a setext heading underline.
              lines = source.split("\n")
              start = 0
              if lines and lines[0].strip() == "---":
                  start = 1
                  while start < len(lines) and lines[start].strip() != "---":
                      start += 1
                  start += 1
              breaks, fenced, prev_blank = 0, False, True
              for line in lines[start:]:
                  stripped = line.strip()
                  if stripped.startswith("```"):
                      fenced = not fenced
                  elif not fenced and stripped == "---" and prev_blank:
                      breaks += 1
                  prev_blank = stripped == ""
              return breaks + 1


          def squashed(text):
              # A long title slide wraps, so the extracted text carries a newline
              # the markdown does not (L17 is the one that does it today).
              # Comparing without whitespace at all sidesteps that.
              return "".join(text.split())


          problems = []
          merged = PdfReader("_build/html/slides.pdf")
          merged_text = squashed("\n".join((p.extract_text() or "") for p in merged.pages))
          bookmarks = {o.title for o in merged.outline if hasattr(o, "title")}

          total = 0
          for deck in sorted(Path("lectures").glob("*/slides.md")):
              deck_id = deck.parent.name
              source = deck.read_text()
              rendered = PdfReader(f"_build/slides-pdf/{deck_id}.pdf")
              pages, wanted = len(rendered.pages), expected_slides(source)
              total += pages
              if pages != wanted:
                  problems.append(f"{deck_id}: {pages} pages rendered from {wanted} slides")

              title = next((ln[2:].strip() for ln in source.splitlines()
                            if ln.startswith("# ")), None)
              if title and squashed(title) not in merged_text:
                  problems.append(f"{deck_id}: no text from its title slide ({title!r})")
              if title and title not in bookmarks:
                  problems.append(f"{deck_id}: no bookmark ({title!r})")

              figures = set(re.findall(r'figures/[^\s")\']+\.png', source))
              embedded = sum(len(p.images) for p in rendered.pages)
              if embedded < len(figures):
                  problems.append(
                      f"{deck_id}: {embedded} images in the PDF for {len(figures)} figures "
                      "referenced (is --allow-local-files still set?)")

          if len(merged.pages) != total:
              problems.append(f"slides.pdf has {len(merged.pages)} pages, decks total {total}")

          if problems:
              for problem in problems:
                  print(f"::error::slides.pdf {problem}")
              sys.exit(1)
          print(f"OK: slides.pdf is {len(merged.pages)} pages across {len(bookmarks)} decks")
          PY

      - name: Check the build produced something
        run: |
          test -f _build/html/index.html || { echo "::error::book build produced no index.html"; exit 1; }
          test -f _build/html/course.pdf || { echo "::error::course.pdf did not reach the site"; exit 1; }
          test -f _build/html/slides.pdf || { echo "::error::slides.pdf did not reach the site"; exit 1; }
          echo "Slide decks rendered:"
          ls -1 _build/html/slides/ 2>/dev/null || echo "  (none yet)"

      - name: Verify no instructor-only material was published
        # The Pages site is public while the repo is private. course/modules/
        # holds teaching notes and must never be reachable. Fail loudly if it is.
        run: |
          if find _build/html -path "*modules*" -name "*.html" | grep -q .; then
            echo "::error::instructor material from course/modules/ was published"
            find _build/html -path "*modules*" -name "*.html"
            exit 1
          fi
          echo "OK: no course/modules/ pages in the build output"

      - name: Stamp the build with the commit it came from
        # Read back off the live site by the verify job below, which is the only
        # way to tell a fresh deploy from a stale one. Useful on its own too:
        # /f26-06763/build-info.json answers "what is actually published right
        # now", which is a different question from "did the last run go green".
        run: |
          cat > _build/html/build-info.json <<JSON
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat _build/html/build-info.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only publish from main. PRs build as a check but do not deploy.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    # A green deploy job is not evidence that the site updated.
    #
    # On 2026-08-06 the build job succeeded, actions/deploy-pages sat in
    # deployment_queued for ten minutes and timed out, and the published site
    # silently stayed on the previous commit while the run's build job still
    # showed green. A second attempt reported queued for hours. Nothing in this
    # workflow noticed, and the way it was eventually caught was a human
    # fetching a lecture URL by hand and getting a 404.
    #
    # So: read the stamp the build job baked in, off the live site, and require
    # it to name this commit. This is the deploy-time version of the rule in
    # CLAUDE.md section 8, that HTTP 200 is not evidence a page rendered.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the live site is serving this commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED: ${{ github.sha }}
        run: |
          if [ -z "$PAGE_URL" ]; then
            echo "::error::deploy produced no page_url; cannot verify the deploy"
            exit 1
          fi
          url="${PAGE_URL%/}/build-info.json"
          echo "Expecting $url to report commit $EXPECTED"

          # Pages reports success slightly before the CDN serves the new build,
          # so poll rather than fetching once. Roughly three minutes; a deploy
          # that has not propagated by then has not propagated.
          live=""
          for attempt in $(seq 1 18); do
            # The cache buster is not superstition: without it an edge cache can
            # keep answering with the previous build and the check passes or
            # fails on stale data.
            body=$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' \
                     "${url}?cachebust=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null || true)
            live=$(printf '%s' "$body" \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$live" = "$EXPECTED" ]; then
              echo "OK: the live site is serving $EXPECTED"
              printf '%s\n' "$body"
              exit 0
            fi
            echo "attempt ${attempt}/18: live=${live:-<unreachable>}"
            sleep 10
          done

          echo "::error::deploy reported success but ${PAGE_URL} is serving ${live:-nothing}, not ${EXPECTED}"
          echo "::error::the site is stale. Check https://www.githubstatus.com for a Pages incident, then re-run this workflow."
          exit 1
