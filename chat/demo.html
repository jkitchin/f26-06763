<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat with the course notes: local test page</title>
<!-- Open this file directly in Chrome, or serve the directory: python3 -m http.server -d chat 8016
     ?q=... runs one query on load, for headless checks. -->
<style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:1em auto}</style></head>
<body>
<h2>Chat with the course notes</h2>
<div class="rag-chat" data-examples="what does forgetting zero_grad do|why can't I shuffle sensor data before splitting it|what is LoRA fine-tuning"></div>
<script>
// ?model=Qwen2.5-1.5B-Instruct-q4f16_1-MLC tries another generator without editing rag-chat.js.
const m = new URLSearchParams(location.search).get('model');
if (m) document.querySelector('.rag-chat').dataset.model = m;
</script>
<script src="build/rag-index.js"></script>
<script src="rag-chat.js"></script>
<script>
const q = new URLSearchParams(location.search).get('q');
if (q) {
  const t = setInterval(() => {
    const b = document.querySelector('.rag button.primary');
    if (!b || b.disabled) return;
    clearInterval(t);
    document.querySelector('.rag input[type=text]').value = q;
    b.click();
    const w = setInterval(() => {
      const hits = [...document.querySelectorAll('.rag-hit')];
      if (!hits.length) return;
      clearInterval(w);
      document.title = 'DONE ' + hits.slice(0, 5).map(x => x.querySelector('a').textContent + ' {' + x.querySelector('.ranks').textContent + '}').join(' || ')
        + ' TIMES ' + [...document.querySelectorAll('.rag-stage')].map(s => s.querySelector('b').textContent + '=' + s.querySelector('.t').textContent).join(', ');
    }, 200);
  }, 200);
}
</script>
</body></html>
