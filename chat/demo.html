<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Chat with the course notes: local test page</title>
<!-- Serve this directory over HTTP (modules and fetch do not work from file://):
       python3 -m http.server -d chat 8016   then open http://localhost:8016/demo.html
     ?q=... runs one query on load, for headless checks. -->
<style>body{font-family:system-ui,sans-serif;max-width:1180px;margin:1em auto}</style></head>
<body>
<h2>Chat with the course notes</h2>
<div class="rag-chat" data-index="build/rag-index.json"></div>
<script type="module" src="rag-chat.js"></script>
<script>
const q = new URLSearchParams(location.search).get('q');
if (q) {
  const t = setInterval(() => {
    const b = document.querySelector('.rag button.primary');
    if (!b || b.disabled) return;
    clearInterval(t);
    document.querySelector('.rag input[type=text]').value = q;
    b.click();
    const w = setInterval(() => {
      const hits = [...document.querySelectorAll('.rag-hit')];
      if (!hits.length) return;
      clearInterval(w);
      document.title = 'DONE ' + hits.slice(0, 5).map(x => x.querySelector('a').textContent + ' {' + x.querySelector('.ranks').textContent + '}').join(' || ')
        + ' TIMES ' + [...document.querySelectorAll('.rag-stage')].map(s => s.querySelector('b').textContent + '=' + s.querySelector('.t').textContent).join(', ');
    }, 200);
  }, 200);
}
</script>
</body></html>
