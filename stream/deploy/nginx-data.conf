# Serves the miniproject's two Parquet subsets of the Rieth et al. (2017) Tennessee
# Eastman data (CC0), built by tools/make_mp_data.py. The full faulty file needs
# about 9 GB of RAM to read, which is why students download a subset from here
# instead.
#
# DEPLOYED 2026-09-16 on kitchin-services, the same Pi as the stream. It installs
# as a snippet and is pulled into the existing 443 server block by a one-line
# include next to the tep-mqtt one, so this file stays the only copy:
#
#   uv run --with pyreadr --with polars --with pyarrow python tools/make_mp_data.py /tmp/mp-data
#   ssh kitchin-services 'sudo mkdir -p /srv/f26-06763/data && sudo chown $USER /srv/f26-06763/data'
#   rsync /tmp/mp-data/*.parquet /tmp/mp-data/SHA256SUMS kitchin-services:/srv/f26-06763/data/
#   scp stream/deploy/nginx-data.conf kitchin-services:/tmp/
#   ssh kitchin-services 'sudo cp /tmp/nginx-data.conf /etc/nginx/snippets/f26-06763-data.conf'
#   # add: include /etc/nginx/snippets/f26-06763-data.conf;  to the 443 server block
#   ssh kitchin-services 'sudo nginx -t && sudo systemctl reload nginx'
#
# The checksums served at /f26-06763/data/SHA256SUMS must match
# course/miniproject-data.sha256; miniproject-evidence.py refuses a file that does not.

location /f26-06763/data/ {
    alias /srv/f26-06763/data/;
    autoindex off;
    types { application/vnd.apache.parquet parquet; text/plain SHA256SUMS; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
}
