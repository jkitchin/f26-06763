# Drop into the same 443 server block as nginx-mqtt.conf, with a one-line include.
#
# Serves the miniproject's two Parquet subsets of the Rieth et al. (2017) Tennessee
# Eastman data (CC0), built by tools/make_mp_data.py. The full faulty file needs
# about 9 GB of RAM to read, which is why students download a subset from here
# instead. Copy the build output, including SHA256SUMS, to the aliased directory:
#
#   uv run --with pyreadr --with polars --with pyarrow python tools/make_mp_data.py /tmp/mp-data
#   sudo mkdir -p /srv/f26-06763/data
#   sudo cp /tmp/mp-data/*.parquet /tmp/mp-data/SHA256SUMS /srv/f26-06763/data/
#
# Then check the published hashes against course/miniproject-data.sha256.

location /f26-06763/data/ {
    alias /srv/f26-06763/data/;
    autoindex off;
    types { application/vnd.apache.parquet parquet; text/plain SHA256SUMS; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
}
