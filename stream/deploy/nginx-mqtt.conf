# Drop into the server block for kitchin-services.cheme.cmu.edu, which already
# terminates TLS with a Let's Encrypt certificate.
#
# MQTT rides WebSockets on 443 because 1883 and 8883 are blocked inbound at the
# CMU network edge and 443 is not. Students therefore need no special ports
# open on their side either, which is the other half of why this works from a
# dorm or a coffee shop.

location /mqtt {
    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # An MQTT subscriber is idle between messages by definition, and nginx's
    # default proxy_read_timeout of 60s would cut the connection during any
    # simulated outage longer than a minute. The publisher's outages run to
    # forty samples, which is eighty seconds of wall clock, so the default
    # would disconnect every student in the class partway through one.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
