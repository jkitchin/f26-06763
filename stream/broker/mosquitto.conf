# Local rehearsal of the Raspberry Pi configuration.
#
# On the Pi the websockets listener binds to 127.0.0.1 and nginx terminates
# TLS in front of it, because ports 1883 and 8883 are blocked inbound at the
# CMU network edge and 443 is not. Here it binds to localhost too, for the
# same reason it will there: nothing but the proxy should reach it.

listener 9001 127.0.0.1
protocol websockets

# Students get no account: a hostname and a topic is the whole of what they
# are told, because per-student credentials would be a semester of account
# management to protect a feed of simulated data. The one account that exists
# is the publisher's, and the ACL is what makes that worth having: anonymous
# clients may read, only tep-publisher may write, so nobody can inject a
# fabricated reading into the stream somebody else is collecting.
allow_anonymous true
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Against a scanner finding an open broker on 443.
max_connections 200
max_queued_messages 200
max_packet_size 262144

persistence false
log_type warning
log_type error
