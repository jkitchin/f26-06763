  # --- o1: what UQ is, aleatoric and epistemic, kinds of interval ------------------------------

  - id: l14-q01
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l14-o1]
    prompt: |
      You re-test fifty more cylinders of concrete mixes you have already tested. Which part of
      the uncertainty in the strength prediction for those mixes goes down?
    options:
      - "Epistemic: the model learns those mixes better"
      - "Aleatoric: repeated tests average the scatter away"
      - "Both, by the same amount"
      - "Neither, because the mixes are not new"
    answer: "Epistemic: the model learns those mixes better"
    evidence: |
      Repeats pin down the strength of those mixes, so what the model does not know shrinks.
      The scatter between repeat specimens is the noise itself, and no number of repeats
      removes it from the next specimen.
    source:
      file: lectures/l14/notes.md
      heading: "Aleatoric and epistemic uncertainty"
      quote: |
        **Epistemic** uncertainty is what the model does not know yet, which more data in the right place
        reduces.
    verify: {mode: quote, needle: "more data in the right place", volatility: stable}
    tags: [aleatoric, epistemic]

  - id: l14-q02
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l14-o1]
    prompt: |
      You need to know whether the next cylinder of a mix will pass a strength specification.
      Which interval answers that?
    options:
      - "A confidence interval on the mean strength of the mix"
      - "A prediction interval, which includes the scatter of a new specimen"
      - "A credible interval on the model's parameters"
      - "Any of them, since all three are the same width"
    answer: "A prediction interval, which includes the scatter of a new specimen"
    evidence: |
      The cylinder that gets tested is a new measurement, carrying the noise as well as the
      model's uncertainty about the mean. A confidence or credible interval covers only the true
      function value, so it is narrower than what the specimen will do.
    source:
      file: lectures/l14/notes.md
      heading: "Three kinds of interval"
      quote: |
        needs the **prediction**
        interval, because the specimen that gets tested is a new measurement.
    verify: {mode: quote, needle: "specimen that gets tested is a new measurement", volatility: stable}
    tags: [prediction-interval, confidence-interval]

  # --- o2: calibration and recalibration ---------------------------------------------------------

  - id: l14-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o2]
    prompt: |
      A forecaster ignores the mix and issues the same interval for every cylinder, the 5% to 95%
      range of all past strengths. Its 90% intervals cover about 90% of new cylinders. What is
      wrong with it?
    options:
      - "Nothing; it is calibrated, so it is a good forecast"
      - "It is miscalibrated, because it ignores the inputs"
      - "It is calibrated but not sharp: its intervals are too wide to be useful"
      - "It is sharp but not calibrated"
    answer: "It is calibrated but not sharp: its intervals are too wide to be useful"
    evidence: |
      This is the climatological forecaster. Calibration alone can be bought with width; the goal
      is the sharpest intervals that stay calibrated. On the concrete data it covered 91% with
      intervals 55.9 MPa wide, against 22.2 MPa for the rescaled ensemble.
    source:
      file: lectures/l14/notes.md
      heading: "Sharpness subject to calibration"
      quote: |
        It is perfectly calibrated and useless.
    verify: {mode: quote, needle: "perfectly calibrated and useless", volatility: stable}
    tags: [sharpness, calibration, climatology]

  - id: l14-q04
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l14-o2]
    prompt: |
      On the calibration mixes, the z-scores (y − μ)/σ of an ensemble have a mean square well
      above 1. You rescale every σ by the factor that minimizes the negative log likelihood.
      What happens to the intervals?
    options:
      - "They get wider, because the factor is above 1"
      - "They get narrower, because the factor is below 1"
      - "They stay the same width and shift toward the data"
      - "Nothing, because rescaling cannot change coverage"
    answer: "They get wider, because the factor is above 1"
    evidence: |
      The best factor is the root mean square of the calibration z-scores. A mean square above 1
      means the errors are larger than the stated σ, so the model was overconfident and the
      factor widens every interval.
    source:
      file: lectures/l14/notes.md
      heading: "Worked example: recalibrating an ensemble"
      quote: |
        the mean square of the calibration $z$-scores. A calibrated model has $z$-scores with unit
        variance, so $s$ measures how far from that the model is.
    verify: {mode: quote, needle: "measures how far from that the model is", volatility: stable}
    tags: [recalibration, scale-factor]

  # --- o3: what a GP's band promises, and three failures -----------------------------------------

  - id: l14-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o3]
    prompt: |
      With its kernel settings held fixed, what does a Gaussian process's predictive variance
      depend on?
    options:
      - "The training targets, so a poor fit widens the band"
      - "Only the inputs and the kernel, not the observed targets"
      - "The residuals of the mean on the training points"
      - "The number of points only, not where they are"
    answer: "Only the inputs and the kernel, not the observed targets"
    evidence: |
      The variance formula contains the kernel values between inputs and no y at all. At fixed
      settings a GP that fits badly reports the same band as one that fits well; y reaches the
      band only through fitted hyperparameters.
    source:
      file: lectures/l14/notes.md
      heading: "Prior and posterior"
      quote: |
        **The variance does not contain $y$.** It depends "only on the inputs" (p. 18).
    verify: {mode: quote, needle: "only on the inputs", volatility: stable}
    tags: [gaussian-process, posterior-variance]

  - id: l14-q06
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l14-o3]
    prompt: |
      A team adds more simulation runs to an RBF Gaussian process and notices the fitted length
      scale falls every time: 0.09, then 0.06, then 0.03. They conclude the model is resolving
      finer detail. What did they miss?
    options:
      - "Nothing; a shorter length scale always means a better model"
      - "The optimizer is failing to converge as the data grow"
      - "The noise level is too high for an RBF kernel"
      - "A length scale that keeps shrinking signals a kernel that does not fit the function, such as a step"
    answer: "A length scale that keeps shrinking signals a kernel that does not fit the function, such as a step"
    evidence: |
      To bend at a discontinuity, a smooth kernel shortens its length scale everywhere, and more
      data push it further. Duvenaud's cookbook calls this a classic sign of misspecification;
      near the step the 95% band covered 72%.
    source:
      file: lectures/l14/notes.md
      heading: "Failure 2: a kernel that does not match the function"
      quote: |
        that "never stops becoming smaller as you add more data" "a classic sign of model
        misspecification".
    verify: {mode: quote, needle: "a classic sign of model", volatility: stable}
    tags: [gaussian-process, kernel-misspecification, practitioner]

  - id: l14-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o3]
    prompt: |
      Why is a Gaussian process fitted to five points, with its settings chosen by maximum
      likelihood, often overconfident?
    options:
      - "Many settings explain five points equally well, and maximum likelihood keeps one as if known"
      - "Five points are too few to compute a posterior at all"
      - "Maximum likelihood always overestimates the noise"
      - "The band cannot widen beyond the data with so few points"
    answer: "Many settings explain five points equally well, and maximum likelihood keeps one as if known"
    evidence: |
      Short and long length scales fit five points about equally, and the uncertainty about which
      is right never reaches the band. Over 200 data sets of five points, the median coverage of
      a nominal 95% band was 78%.
    source:
      file: lectures/l14/notes.md
      heading: "Failure 3: too few points"
      quote: |
        With few points, many
        settings explain the data about equally well, and maximum likelihood picks one of them as if it
        were known.
    verify: {mode: quote, needle: "picks one of them as if it", volatility: stable}
    tags: [gaussian-process, few-data, hyperparameters]

  - id: l14-q08
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o3]
    prompt: |
      Noise in a data set grows with x. A Gaussian process with one noise level covers 95% over
      the whole range. What does checking coverage by region show?
    options:
      - "95% everywhere, since the overall number is right"
      - "Too narrow where the noise is small, too wide where it is large"
      - "Too wide where the noise is small, too narrow where it is large"
      - "Too narrow everywhere, hidden by rounding"
    answer: "Too wide where the noise is small, too narrow where it is large"
    evidence: |
      One fitted noise level sits between the small and the large noise, so the band is too wide
      on the quiet side and too narrow on the noisy side. By third of the range the toy problem
      gave 100%, 98% and 88%.
    source:
      file: lectures/l14/notes.md
      heading: "Failure 1: noise that grows with the input"
      quote: |
        too wide on the left, too narrow on the right. The average hides both errors.
    verify: {mode: quote, needle: "The average hides both errors", volatility: stable}
    tags: [heteroscedastic-noise, gaussian-process]

  # --- o4: what an ensemble's spread measures ----------------------------------------------------

  - id: l14-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o4]
    prompt: |
      Ten networks trained from different seeds agree closely inside the training range, and a
      95% interval built from their spread alone covers far less than 95% there. Why?
    options:
      - "The networks were not trained long enough"
      - "Ten members are too few for a stable spread"
      - "The spread measures only the epistemic part and leaves out the noise"
      - "The spread is too large and overshoots the data"
    answer: "The spread measures only the epistemic part and leaves out the noise"
    evidence: |
      Members disagree about the function, not about a new measurement. Inside the data they
      agreed to 0.021 while the noise was 0.1, so the spread alone covered 29%; adding a noise
      estimate brought it to 93%.
    source:
      file: lectures/l14/notes.md
      heading: "What the spread measures"
      quote: |
        The spread is the epistemic part only, so an interval built from it
        alone covers **29%**.
    verify: {mode: quote, needle: "epistemic part only", volatility: measured}
    tags: [ensemble, epistemic, noise-term]

  - id: l14-q10
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l14-o4]
    prompt: |
      What does the spread of models refit on bootstrap resamples estimate?
    options:
      - "The noise in a new measurement"
      - "How much the fitted function varies with the data: the variance part of the error"
      - "The bias of the model, including its errors far from the data"
      - "The total prediction error, noise included"
    answer: "How much the fitted function varies with the data: the variance part of the error"
    evidence: |
      Resampling shows how the fit would change with a new data set of the same size. If every
      resample makes the same mistake, the spread is small and the error large, so the bias is
      missed, and so is the noise.
    source:
      file: lectures/l14/notes.md
      heading: "The bootstrap"
      quote: |
        That is the **variance** part of the error.
    verify: {mode: quote, needle: "part of the error", volatility: stable}
    tags: [bootstrap, variance, bias]

  # --- o5: conformal prediction and its condition ------------------------------------------------

  - id: l14-q11
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l14-o5]
    prompt: |
      An optimizer searches a surrogate for the strongest mix it can find, and the team reports
      each proposed mix with a split conformal 90% interval, citing the method's finite-sample
      guarantee. What is wrong?
    options:
      - "Split conformal needs Gaussian errors, which strengths are not"
      - "The calibration set must be larger than the training set"
      - "Proposed mixes are chosen for being different, so they are not exchangeable with the calibration mixes"
      - "Conformal intervals cannot be used with neural networks"
    answer: "Proposed mixes are chosen for being different, so they are not exchangeable with the calibration mixes"
    evidence: |
      The guarantee needs only exchangeability, and an optimizer breaks it on purpose. On the
      strongest mixes, held out because they differ, split conformal covered 56% at a nominal 90%.
    source:
      file: lectures/l14/notes.md
      heading: "Out of domain"
      quote: |
        The guarantee did not fail. Its
        condition was not met.
    verify: {mode: quote, needle: "condition was not met", volatility: stable}
    tags: [conformal-prediction, exchangeability, design-loop, practitioner]

  - id: l14-q12
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o5]
    prompt: |
      How does the width of a plain split conformal interval vary across inputs?
    options:
      - "It is the same everywhere; the guarantee holds on average over inputs"
      - "It grows where the training data are sparse"
      - "It follows the noise level at each input"
      - "It shrinks as the model becomes more confident"
    answer: "It is the same everywhere; the guarantee holds on average over inputs"
    evidence: |
      Plain split conformal adds one quantile of the calibration residuals to every prediction.
      Coverage is marginal, so on a problem with growing noise it was 100%, 95% and 82% by third;
      normalized scores or CQR make the width adapt.
    source:
      file: lectures/l14/notes.md
      heading: "Marginal coverage, not conditional coverage"
      quote: |
        "the width is exactly
        constant over x"
    verify: {mode: quote, needle: "constant over x", volatility: stable}
    tags: [conformal-prediction, marginal-coverage]

  - id: l14-q13
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l14-o5]
    prompt: |
      What coverage does the jackknife+ guarantee for a target level of 1 − α?
    options:
      - "Exactly 1 − α, like split conformal"
      - "At least 1 − 2α in the worst case, and close to 1 − α in practice"
      - "At least 1 − α, but only with Gaussian errors"
      - "No guarantee at all, like the plain jackknife"
    answer: "At least 1 − 2α in the worst case, and close to 1 − α in practice"
    evidence: |
      Barber et al. prove 1 − 2α and show the factor of 2 cannot be removed in general, while
      reporting near 1 − α in practice. The plain jackknife has no guarantee, and its coverage can
      vanish.
    source:
      file: lectures/l14/notes.md
      heading: "Jackknife+ and CV+"
      quote: |
        The worst case is $1 - 2\alpha$ (their Theorem 1)
    verify: {mode: quote, needle: "(their Theorem 1)", volatility: stable}
    tags: [jackknife-plus, cv-plus, guarantee]

  # --- o6: models with uncertainty built in (pycse) ----------------------------------------------

  - id: l14-q14
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o6]
    prompt: |
      LinearRegressionUQ with a cubic basis, fitted to a sine on [0, 1], covers about 95% inside
      the data and almost nothing beyond it, although its band widens there. Why?
    options:
      - "The noise estimate is too small"
      - "The cubic basis is wrong for a sine, and its uncertainty only covers fits within that basis"
      - "Linear regression cannot produce prediction intervals"
      - "The band widens too fast and overshoots"
    answer: "The cubic basis is wrong for a sine, and its uncertainty only covers fits within that basis"
    evidence: |
      The parameter term says how unsure the coefficients of a cubic are, not whether a cubic is
      the right shape. That is model inadequacy, and nothing inside the training range reveals it.
    source:
      file: lectures/l14/notes.md
      heading: "UQ built into models: pycse"
      quote: |
        the parameter term only measures uncertainty within that basis.
    verify: {mode: quote, needle: "only measures uncertainty within that basis", volatility: stable}
    tags: [pycse, model-inadequacy]

  - id: l14-q15
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l14-o6]
    prompt: |
      While fitting, a pycse model prints "Model is well-calibrated", then covers well under 95%
      beyond its training range. What did the message check?
    options:
      - "Coverage on a held-out region beyond the training data"
      - "That the network converged"
      - "The rescaling factor on validation points from inside the training range"
      - "That the residuals are Gaussian"
    answer: "The rescaling factor on validation points from inside the training range"
    evidence: |
      The validation points came from the same range as the training points, so the check is an
      in-distribution statement. It says nothing about inputs beyond the data.
    source:
      file: lectures/l14/notes.md
      heading: "UQ built into models: pycse"
      quote: |
        so it is an in-distribution statement
    verify: {mode: quote, needle: "in-distribution statement", volatility: stable}
    tags: [pycse, calibration, practitioner]
