  - id: l05-q01
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l05-o2]
    prompt: |
      A 200-line pipeline written as one function returns a per-fault summary
      table, and one column of it looks wrong.

      What does writing it as a single function cost you here?
    options:
      - "Nothing; one function is easier to debug because all the logic sits in one place"
      - "There is no intermediate output to open, so you cannot tell which step introduced it without adding prints and re-running the whole thing"
      - "The error has to be in the aggregation, since that is the last step that ran"
      - "You can only find it by rewriting the pipeline in Polars, whose query plan shows each step"
    answer: "There is no intermediate output to open, so you cannot tell which step introduced it without adding prints and re-running the whole thing"
    evidence: |
      A pipeline built from stages has a seam at every boundary: you can open
      the output of load, of clean, of aggregate, and see exactly what each one
      produced. One long function has no such seam, so every question about the
      middle costs you a full re-run with prints added.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "A pipeline written as one long function has no seam: nothing to test on its own, nothing to re-run on its own."
    verify: {mode: quote, needle: "has no seam", volatility: stable}
    tags: [pipelines, stages, debugging]

  - id: l05-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o3]
    prompt: |
      A Polars pipeline starts with `pl.scan_parquet(...)` and later selects 6 of
      a table's 55 columns before `.collect()`.

      What does the plan do with that, and what is the idea called?
    options:
      - "Nothing; scan_parquet always reads every column regardless of what is selected later"
      - "It folds the selection into the scan, so only those 6 columns are read off disk: projection pushdown"
      - "It reads all 55 columns into memory first, then drops 49 of them: eager projection"
      - "It reads only the first 6 columns in file order, which only works if you select by position"
    answer: "It folds the selection into the scan, so only those 6 columns are read off disk: projection pushdown"
    evidence: |
      Because scan_parquet builds a plan instead of reading immediately, a
      later `.select()` folds back into the read itself, so the columns you
      never asked for are never pulled off disk. This is the same saving
      DuckDB applied to Parquet in Lecture 4, now inside a dataframe pipeline
      with no server involved.
    source:
      file: lectures/l05/notes.md
      heading: "Getting DuckDB's trick without DuckDB"
      quote: "projection pushdown and predicate pushdown DuckDB applied to Parquet in Lecture 4"
    verify: {mode: quote, needle: "projection pushdown and predicate pushdown", volatility: stable}
    tags: [polars, lazy, query-optimization]

  - id: l05-q03
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l05-o3]
    prompt: |
      What does lazy evaluation cost you, in Polars?
    options:
      - "Memory, since the whole plan must be held before anything executes"
      - "Errors move away from the line that causes them, sometimes several stages away"
      - "Determinism, since the optimizer may reorder operations between runs"
      - "Type safety, since column types are only known once the data is materialized"
    answer: "Errors move away from the line that causes them, sometimes several stages away"
    evidence: |
      A malformed expression may not raise until `.collect()`, several lines
      and possibly several stages from the mistake, where pandas' eager default
      would have failed right on the offending line. That debugging cost is
      real, and it is why an exploratory notebook often stays eager.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "lazy evaluation moves errors away from the line that caused them, sometimes several stages away"
    verify: {mode: quote, needle: "moves errors away from the line that caused them", volatility: stable}
    tags: [polars, lazy, debugging]

  - id: l05-q04
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o3]
    prompt: |
      When is staying with pandas the right call, even though Polars is faster?
    options:
      - "When the data fits in memory, since Polars' advantage only appears above that"
      - "When your codebase or your collaborators only speak pandas"
      - "When the transformations are simple, since Polars' planner needs complex queries to pay off"
      - "When you need plotting, since Polars cannot be converted to a plottable form"
    answer: "When your codebase or your collaborators only speak pandas"
    evidence: |
      Polars is stricter, and stricter costs you while you are still learning
      it: more of your mistakes become real errors instead of quiet
      workarounds. Stay with pandas when your codebase or collaborators only
      speak it; reach for Polars once the table outgrows comfort. Note the
      last option is wrong for the same reason converting is cheap: shared
      Arrow layout, so plotting from a Polars result costs little.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "Polars is stricter, and stricter costs you while you are learning it"
    verify: {mode: quote, needle: "stricter costs you while you are learning it", volatility: stable}
    tags: [polars, pandas, tooling]

  - id: l05-q05
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l05-o2]
    prompt: |
      A pipeline stage caches its output to Parquet under a name that mentions
      only the stage, `clean.parquet`. A config parameter the stage depends on
      changes, and the stage is re-run.

      What happens?
    options:
      - "The cache is invalidated automatically, since the config is part of the stage's inputs"
      - "The stale file is reused silently, because nothing about the filename reflects the config"
      - "The stage fails, since the cached schema no longer matches the new config"
      - "A new cache entry is written alongside the old one, and the newer is preferred"
    answer: "The stale file is reused silently, because nothing about the filename reflects the config"
    evidence: |
      Naming the cache after the stage rather than after the inputs and
      settings that actually determine its contents is the trap. The fix is
      to name the cached file after the config too, not just the stage, so a
      changed setting produces a different filename and the old one is never
      mistaken for current.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "the stale file gets reused silently, because nothing tells it to invalidate"
    verify: {mode: quote, needle: "stale file gets reused silently", volatility: stable}
    tags: [pipelines, caching, idempotency]

  - id: l05-q06
    kind: predict_measure
    rung: 1
    difficulty: 2
    objectives: [l05-o1]
    prompt: |
      A Python loop over a sensor column, against the vectorized equivalent.

      Before you look: how much slower is the loop?
    predict:
      ask: "Write down a factor before revealing."
      common_prior: "Maybe 5 or 10 times. Interpreted code is slower but not absurdly so."
    options:
      - "Within a factor of two of 100 times slower"
      - "About 5 times slower, which is the usual interpreter overhead"
      - "About 1,000 times slower, since every element crosses the Python-C boundary"
      - "Roughly the same, since NumPy loops internally anyway"
    answer: "Within a factor of two of 100 times slower"
    evidence: |
      Two orders of magnitude, and the reason is that the vectorized version
      hands the whole column to compiled code once while the loop pays
      Python's per-row overhead every time. This is the measurement that makes
      "vectorize" a rule rather than a preference.
    source:
      file: lectures/l05/notes.md
      heading: "Why this matters"
      quote: "commonly about **100 times** slower than checking the whole column at once"
    verify: {mode: ordering, needle: "100 times", volatility: measured}
    tags: [vectorization, performance]

  - id: l05-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o3]
    prompt: |
      Converting a table from pandas to Polars, or back, is usually cheap. Why?
    options:
      - "Both libraries call the same C extension underneath, so no data actually moves"
      - "Both lay their columns out the same way in memory, the Arrow format"
      - "pandas and Polars use identical column names and types by convention, so no translation is needed"
      - "Polars automatically caches every pandas dataframe it has already seen"
    answer: "Both lay their columns out the same way in memory, the Arrow format"
    evidence: |
      Arrow is the columnar format for data held in memory, Parquet's
      counterpart from Lecture 4 on disk. Because pandas and Polars both lay
      their columns out in Arrow, moving a table between the two is cheap,
      which is what makes prototyping in whichever one you know a reasonable
      default.
    source:
      file: lectures/l05/notes.md
      heading: "Getting DuckDB's trick without DuckDB"
      quote: "cheap because both libraries lay columns out the same way in memory"
    verify: {mode: quote, needle: "both libraries lay columns out the same way in memory", volatility: stable}
    tags: [arrow, polars, pandas]

  - id: l05-q08
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o2]
    prompt: |
      What does it mean for a pipeline stage to be idempotent, and why does it
      matter?
    options:
      - "Running it twice has the same effect as running it once, so a partial failure can be retried without corrupting anything"
      - "It runs in constant time regardless of input size, which makes scheduling predictable"
      - "It holds no state between invocations, so stages can run in any order"
      - "It writes atomically, so a reader never sees a half-written file"
    answer: "Running it twice has the same effect as running it once, so a partial failure can be retried without corrupting anything"
    evidence: |
      Retryability is the whole payoff. You do not need to know whether the
      last attempt finished; you just run the stage again. That is what a
      database's transactions gave you for free, and what a plain Python
      pipeline has to rebuild by hand.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "A stage is **idempotent** when running it twice has the same effect as running it once."
    verify: {mode: quote, needle: "running it twice has the same effect as running it once", volatility: stable}
    tags: [pipelines, idempotency]

  - id: l05-q09
    kind: mechanism_recall
    rung: 5
    difficulty: 3
    objectives: [l05-o3]
    prompt: |
      Close the notes. Explain what happens, step by step, between writing
      `pl.scan_parquet(...).group_by(...).agg(...)` and getting a result back.
      Stop when you stall, and note where.
    checklist:
      - text: "scan_parquet hands back a description of the read, not the data itself; nothing is read yet"
        needle: "description of the read"
      - text: "Each method call (group_by, agg) adds a step to that plan"
        needle: "step"
      - text: "Nothing runs until .collect() is called"
        needle: "collect"
      - text: "At that point the plan runs in one optimized pass, with later steps like column selection folded back into the read"
        needle: "one optimized pass"
      - text: "This is the same projection and predicate pushdown DuckDB applied to Parquet in Lecture 4, now with no server"
        needle: "no server"
    answer: null
    evidence: |
      The whole benefit of the lazy API depends on this order: describe first,
      then execute in one pass. Skipping straight to "it runs the query"
      misses why scan_parquet beats read_parquet for a pipeline, and why the
      plan is worth printing with `.explain()` before you trust it. Where you
      stalled is your reading assignment.
    source:
      file: lectures/l05/notes.md
      heading: "Getting DuckDB's trick without DuckDB"
      quote: "hands back a description of the read, not the data"
    verify:
      mode: manual
      needle: "description of the read"
      volatility: stable
      exempt_reason: >-
        Free-text recall; each checklist entry is verified against the source
        individually rather than the answer being matched as a whole.
    tags: [polars, lazy, self-test]

  - id: l05-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l05-o1]
    prompt: |
      Open [`l05-pipelines.ipynb`](../lectures/l05/l05-pipelines.ipynb) and run
      the pandas-against-Polars benchmark on the sensor data.

      What should you conclude from whichever number you get?
    options:
      - "That Polars should replace pandas in your projects, since the benchmark settles it"
      - "That the ratio is a property of this workload and this machine, and the transferable habit is measuring rather than assuming"
      - "That the two are equivalent, since the difference is within run-to-run noise"
      - "That benchmarks of this kind are not meaningful, since real pipelines are dominated by input and output"
    answer: "That the ratio is a property of this workload and this machine, and the transferable habit is measuring rather than assuming"
    evidence: |
      A speed ratio measured on one laptop, one dataset, and one set of
      operations does not generalize to your own pipeline. The number worth
      carrying from this session is the hundredfold vectorization gap, not
      this ratio, because that one is about the shape of the computation
      rather than about which library you chose.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "A benchmark measures one workload on one machine"
    verify: {mode: quote, needle: "measures one workload on one machine", volatility: stable}
    tags: [polars, benchmark, notebook]
