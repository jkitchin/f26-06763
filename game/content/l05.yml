  - id: l05-q01
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l05-o2]
    prompt: |
      Your pipeline is one long function. The table it returns has one column
      of obviously wrong numbers.

      Why is that hard to track down?
    options:
      - "No step saved its output, so there is nothing to inspect"
      - "The bug has to be in the last step that ran"
      - "You cannot put print statements inside a function"
      - "Pandas hides intermediate results on purpose"
    answer: "No step saved its output, so there is nothing to inspect"
    evidence: |
      Stages give you a seam at every boundary. You open the output of load,
      then of clean, then of aggregate, and the first one that looks wrong
      tells you which step to fix. One long function has no such seam, so
      every question about the middle costs you a full re-run with prints
      added.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "A pipeline written as one long function has no seam: nothing to test on its own, nothing to re-run on its own."
    verify: {mode: quote, needle: "has no seam", volatility: stable}
    tags: [pipelines, stages, debugging]

  - id: l05-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o3]
    prompt: |
      You `scan_parquet` a table of 55 columns, select 6 of them, then
      `.collect()`.

      How many columns come off the disk?
    options:
      - "6: the selection folds into the read"
      - "55, and then 49 are dropped"
      - "55, because a scan always reads everything"
      - "6, but only if you select by position"
    answer: "6: the selection folds into the read"
    evidence: |
      This is projection pushdown. Because `scan_parquet` builds a plan
      instead of reading immediately, your later `.select()` folds back into
      the read itself, so the 49 columns you never asked for are never pulled
      off the disk. DuckDB did the same thing to Parquet in Lecture 4, from
      inside a database. Polars does it with no server involved.
    source:
      file: lectures/l05/notes.md
      heading: "Polars: plan the work, then run it"
      quote: "projection pushdown and predicate pushdown DuckDB applied to Parquet in Lecture 4"
    verify: {mode: quote, needle: "projection pushdown and predicate pushdown", volatility: stable}
    tags: [polars, lazy, query-optimization]

  - id: l05-q03
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l05-o3]
    prompt: |
      What do you give up by running Polars in lazy mode?
    options:
      - "Errors surface at `.collect()`, far from their cause"
      - "Memory, because the plan is held in full"
      - "Repeatability, because the optimizer reorders steps"
      - "Column types, until the data is loaded"
    answer: "Errors surface at `.collect()`, far from their cause"
    evidence: |
      A bad expression may not raise until `.collect()`, several lines and
      sometimes several stages away from the line that caused it. Eager pandas
      would have failed on the offending line instead. That is a real
      debugging cost, and it is why exploratory work often stays eager and
      the lazy version comes later, once the pipeline has settled.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "lazy evaluation moves errors away from the line that caused them, sometimes several stages away"
    verify: {mode: quote, needle: "moves errors away from the line that caused them", volatility: stable}
    tags: [polars, lazy, debugging]

  - id: l05-q04
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o3]
    prompt: |
      When should you stay with pandas instead of switching to Polars?
    options:
      - "When your codebase or coworkers only use pandas"
      - "When the whole table already fits in memory"
      - "When the transformations are fairly simple"
      - "When you need to plot the result afterwards"
    answer: "When your codebase or coworkers only use pandas"
    evidence: |
      Polars is stricter, and that costs you while you are still learning it:
      more of your mistakes turn into real errors instead of quiet
      workarounds. The deciding factor is usually who else has to read your
      code. Plotting is not a reason to avoid Polars, because converting
      between the two is cheap.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "Polars is stricter, and stricter costs you while you are learning it"
    verify: {mode: quote, needle: "stricter costs you while you are learning it", volatility: stable}
    tags: [polars, pandas, tooling]

  - id: l05-q05
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l05-o2]
    prompt: |
      A stage saves its result as `clean.parquet`. You change a setting that
      stage depends on and run the pipeline again.

      What do you get?
    options:
      - "The old file, because its name ignores the setting"
      - "A fresh result, because the setting is an input"
      - "An error, because the schema no longer matches"
      - "Two files, and the newer one is used"
    answer: "The old file, because its name ignores the setting"
    evidence: |
      Nothing links `clean.parquet` to the setting that produced it, so
      nothing marks it stale and the next run quietly reads it back. Name the
      cache after the inputs and settings that determine its contents, so a
      changed setting produces a different filename and the old one can never
      be mistaken for current.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "The stale file gets reused silently, because nothing tells it to invalidate."
    verify: {mode: quote, needle: "stale file gets reused silently", volatility: stable}
    tags: [pipelines, caching, idempotency]

  - id: l05-q06
    kind: predict_measure
    rung: 1
    difficulty: 2
    objectives: [l05-o1]
    prompt: |
      One `for` loop over a column of 480,000 readings, against the same test
      done on the whole column at once.

      Before you look: how much slower is the loop?
    predict:
      ask: "Write down a factor before revealing."
      common_prior: "Maybe 5 or 10 times. Interpreted code is slower, but not absurdly so."
    options:
      - "Hundreds of times slower"
      - "About five times slower"
      - "About the same speed"
      - "Only slower on bigger data"
    answer: "Hundreds of times slower"
    evidence: |
      Measured on the reactor-pressure column, 480,000 readings: the
      whole-column comparison takes 0.2 ms, a plain `for` loop about 20 ms,
      and the same thing written with `iterrows()` about 3,900 ms. The
      whole-column version hands the work to compiled code once; the loop
      pays Python's per-row cost 480,000 times. Which loop you write matters
      as much as whether you write one at all.
    source:
      file: lectures/l05/notes.md
      heading: "Why this matters"
      quote: "**hundreds of times** slower than working on the whole column at once"
    verify: {mode: ordering, needle: "hundreds of times", volatility: measured}
    tags: [vectorization, performance]

  - id: l05-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o1]
    prompt: |
      You have one row per reading. You want one row per fault, with each
      sensor averaged over that fault.

      Which operation gets you there?
    options:
      - 'group_by on faultNumber, then agg with mean'
      - 'join on faultNumber, then agg with mean'
      - 'filter on faultNumber, then agg with mean'
      - 'sort by faultNumber, then agg with mean'
    answer: 'group_by on faultNumber, then agg with mean'
    evidence: |
      This is `GROUP BY faultNumber` from Lecture 3, written as a method call
      instead of a clause: `readings.group_by("faultNumber").agg(...)`. A join
      matches rows across two tables, a filter throws rows away, and a sort
      reorders them. None of the three collapses many rows into one summary
      per group, which is the job here.
    source:
      file: lectures/l05/notes.md
      heading: "What carries over from SQL"
      quote: "does the same job as `GROUP BY faultNumber`"
    verify: {mode: quote, needle: "GROUP BY faultNumber", volatility: stable}
    tags: [dataframe, group-by, sql]

  - id: l05-q08
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l05-o2]
    prompt: |
      What does it mean to say a stage is idempotent?
    options:
      - "Running it twice does what running it once does"
      - "It takes the same time on any input size"
      - "It keeps no state between two runs"
      - "It never leaves a half-written file"
    answer: "Running it twice does what running it once does"
    evidence: |
      The payoff is that you can retry. You do not have to work out whether
      the last attempt finished, or what it left behind: you just run the
      stage again. A database's transactions gave you this for free, and a
      plain Python pipeline has to rebuild it by hand.
    source:
      file: lectures/l05/notes.md
      heading: "Making it safe to rerun"
      quote: "A stage is **idempotent** when running it twice has the same effect as running it once."
    verify: {mode: quote, needle: "running it twice has the same effect as running it once", volatility: stable}
    tags: [pipelines, idempotency]

  - id: l05-q09
    kind: mechanism_recall
    rung: 5
    difficulty: 3
    objectives: [l05-o3]
    prompt: |
      Close the notes. Walk through what happens between writing
      `pl.scan_parquet(...).group_by(...).agg(...)` and getting a table back.

      Stop when you stall, and note where.
    checklist:
      - text: "`scan_parquet` returns a description of the read, not the data. Nothing is read yet."
        needle: "description of the read"
      - text: "Each call you chain on adds one step to that plan."
        needle: "step"
      - text: "Nothing runs until `.collect()`."
        needle: "collect"
      - text: "`.collect()` runs the whole plan in one optimized pass."
        needle: "one optimized pass"
      - text: "Column selection folds back into the read, the way DuckDB did it in Lecture 4, with no server."
        needle: "no server"
    answer: null
    evidence: |
      The order is the whole point: describe first, then run once. If you skip
      to "it runs the query", you lose the reason `scan_parquet` beats
      `read_parquet` in a pipeline, and the reason the plan is worth printing
      with `.explain()` before you trust it. Whichever step you stalled on is
      the paragraph to reread.
    source:
      file: lectures/l05/notes.md
      heading: "Polars: plan the work, then run it"
      quote: "hands back a description of the read, not the data"
    verify:
      mode: manual
      needle: "description of the read"
      volatility: stable
      exempt_reason: >-
        Free-text recall; each checklist entry is verified against the source
        individually rather than the answer being matched as a whole.
    tags: [polars, lazy, self-test]

  - id: l05-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l05-o1]
    prompt: |
      Run the pandas-against-Polars benchmark in
      [`l05-pipelines.ipynb`](../lectures/l05/l05-pipelines.ipynb).

      What does the number you get tell you?
    options:
      - "How these operations run on this machine, and little else"
      - "That Polars should replace pandas in your work"
      - "That the two are the same once you allow for noise"
      - "That timing a pipeline is not worth doing"
    answer: "How these operations run on this machine, and little else"
    evidence: |
      One laptop, one dataset, one set of operations. Run the same comparison
      on a different pipeline and the ratio moves. What does carry over is
      the gap between a loop and a whole-column operation, because that comes
      from the shape of the computation rather than from which library you
      picked. So measure your own pipeline before you rewrite it.
    source:
      file: lectures/l05/notes.md
      heading: "Where this pushes back"
      quote: "A benchmark measures one workload on one machine"
    verify: {mode: quote, needle: "measures one workload on one machine", volatility: stable}
    tags: [polars, benchmark, notebook]
