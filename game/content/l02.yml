items:

  - id: l02-q01
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l02-o1]
    prompt: |
      "We locked the environment, pinned the seed, and tracked the run, so the
      result is trustworthy."

      What does that argument miss?
    options:
      - "Nothing, provided the lockfile is regenerated whenever a dependency changes"
      - "Reproducible is not the same as correct: a pipeline with an off-by-one error will reproduce the wrong answer with perfect fidelity"
      - "Seeds do not make a result reproducible across platforms, so the claim overstates what pinning buys"
      - "Tracking is only meaningful if the tracked run is also deployed, which this does not say"
    answer: "Reproducible is not the same as correct: a pipeline with an off-by-one error will reproduce the wrong answer with perfect fidelity"
    evidence: |
      Reproducibility makes a result *checkable*; it is a precondition for
      catching errors, not a substitute for doing so. Note how the Duke errors
      were actually caught: not by re-running the original code, which would have
      reproduced its mistakes, but by outside statisticians re-implementing the
      analysis from scratch and finding the two disagreed. Reproduction confirms
      you can regenerate a number. Confirming it is right is a separate act
      called validation.
    source:
      file: lectures/l02/notes.md
      heading: "Reproducible is not the same as correct"
      quote: "Reproducible is not the same as correct"
    verify: {mode: quote, needle: "Reproducible is not the same as correct", volatility: stable}
    tags: [reproducibility, validation]

  - id: l02-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l02-o1]
    prompt: |
      A lockfile pins the exact version of every Python package. What does it
      still not pin?
    options:
      - "The random seed, which has to be set separately in code"
      - "The compiled bytes: platform-specific wheels differ between macOS and Linux, and system C libraries are not covered at all"
      - "Transitive dependencies, which resolve freshly on each install"
      - "The Python interpreter version, which is recorded separately"
    answer: "The compiled bytes: platform-specific wheels differ between macOS and Linux, and system C libraries are not covered at all"
    evidence: |
      A package version is not the same as the code that runs. The lockfile says
      nothing about system C libraries, the CUDA toolkit, or the operating system,
      and a pinned version can even become unavailable if it is removed from the
      index. For most engineering work that is enough; when you need the whole
      stack frozen the tool is a container, which is a Week 12 topic. The honest
      framing is that `uv` gives you a reproducible Python environment, which is
      most of what you need and not quite all of it.
    source:
      file: lectures/l02/notes.md
      heading: "A lockfile pins versions, not the whole world"
      quote: "A lockfile pins versions, not the whole world"
    verify: {mode: quote, needle: "pins versions, not the whole world", volatility: stable}
    tags: [reproducibility, environments]
    sequence:
      prompt: "The uv commands of a normal day, in the order you reach for them."
      steps: ["uv init", "uv add", "uv run", "uv sync"]
      why: >-
        init creates the project, add resolves and locks a dependency, run
        executes inside the environment after checking the lockfile still
        matches pyproject.toml, and sync rebuilds the whole thing from the
        lockfile on a machine that has never seen it. The last one is the one
        that ends "works on my machine".

  - id: l02-q03
    kind: locus_of_control
    rung: 3
    difficulty: 2
    objectives: [l02-o1]
    prompt: |
      Twenty minutes of poking at a file to decide whether an idea is worth
      pursuing. Should you set up a locked, tracked, packaged project first?
    options:
      - "Yes, always; the discipline is cheap and retrofitting is expensive"
      - "No for a genuinely throwaway exploration, but the trap is that results cross the line into needing it quietly"
      - "No; scaffolding is only warranted once a result is going to be published"
      - "Yes, because an unlocked environment cannot produce a result worth acting on at all"
    answer: "No for a genuinely throwaway exploration, but the trap is that results cross the line into needing it quietly"
    evidence: |
      There is a real judgment call about when to pay for the discipline. Full
      scaffolding on a twenty-minute exploration is cumbersome and is its own kind
      of over-engineering. The moment an analysis will be rerun, shared, built
      upon, or believed by anyone, including your future self, it has crossed the
      line, and almost nobody notices the crossing at the time. So the default
      leans toward scaffolding, because retrofitting is the expensive direction.
    source:
      file: lectures/l02/notes.md
      heading: "The discipline has a cost, and sometimes it is overkill"
      quote: "The trap is that results almost always cross that line quietly, without anyone deciding that they have."
    verify: {mode: quote, needle: "cross that line quietly", volatility: stable}
    tags: [reproducibility, judgment]

  - id: l02-q04
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l02-o2]
    prompt: |
      A content hash tells you two runs used different data. What does it not
      tell you?
    options:
      - "Whether the file is genuinely different, since hashes collide in practice"
      - "Which rows changed, whether the change was a fix or a corruption, or whether it matters"
      - "When the change happened, which requires a timestamp alongside the hash"
      - "Who made the change, which requires an audit log rather than a hash"
    answer: "Which rows changed, whether the change was a fix or a corruption, or whether it matters"
    evidence: |
      A hash is a smoke alarm, not an investigation. Detecting change is the
      floor of data provenance rather than the ceiling, and the tools that go
      further, versioning data by content with a readable history of what changed
      and why, are `git-lfs` and DVC. Collisions are not the concern: the hash is
      certain that the file differs, and useless about everything after that.
    source:
      file: lectures/l02/notes.md
      heading: "A hash tells you that data changed, not what or why"
      quote: "It will not tell you which rows changed, whether the change was a fix or a corruption, or whether it matters for your result"
    verify: {mode: quote, needle: "whether the change was a fix or a corruption", volatility: stable}
    tags: [provenance, data-versioning]

  - id: l02-q05
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l02-o4]
    prompt: |
      Every run in your MLflow project logs a seed. A colleague concludes the
      project is reproducible.

      What is wrong with that inference?
    options:
      - "Nothing; a logged seed plus logged parameters is what reproducibility means in practice"
      - "Tracking records, it does not enforce: MLflow will faithfully log a run whose environment was never locked"
      - "Seeds are per-library, so one logged seed does not cover NumPy, PyTorch and Python's own RNG"
      - "The seed should be logged as a tag rather than a parameter, or it will not be searchable"
    answer: "Tracking records, it does not enforce: MLflow will faithfully log a run whose environment was never locked"
    evidence: |
      The tracker is a filing system, and a filing system is only as trustworthy
      as the discipline of the person filing. Logging a seed documents one input
      to a run that may still be irreproducible for a dozen other reasons. The
      third option is a real and separate concern; it is not the flaw in the
      inference, which is that recording is being mistaken for guaranteeing.
    source:
      file: lectures/l02/notes.md
      heading: "Tracking records; it does not enforce"
      quote: "Tracking records; it does not enforce"
    verify: {mode: quote, needle: "it does not enforce", volatility: stable}
    tags: [tracking, mlflow]

  - id: l02-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l02-o2]
    prompt: |
      Why do large binary files not belong in plain git?
    options:
      - "Git rejects files above a fixed size limit, so they cannot be committed at all"
      - "Git stores a full copy of every version, so a repeatedly-changed binary makes the history unusable to clone"
      - "Git cannot compute diffs for binary content, so the commits carry no information"
      - "Binary files break the working tree on checkout across operating systems"
    answer: "Git stores a full copy of every version, so a repeatedly-changed binary makes the history unusable to clone"
    evidence: |
      Code, data, and models are three different versioning problems and the
      session is explicit that one tool does not serve all three. Git is superb
      for text it can diff and terrible for a 400 MB file rewritten weekly,
      because every version stays in the history forever. That the diffs are
      uninformative is true and is not the binding cost; the binding cost is that
      the repository stops being clonable.
    source:
      file: lectures/l02/notes.md
      heading: "Versioning code, data, and models are three different problems"
      quote: "three different problems"
    verify: {mode: quote, needle: "three different problems", volatility: stable}
    tags: [versioning, git]

  - id: l02-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l02-o3]
    prompt: |
      What is the point of turning an exploratory notebook into a module with a
      command-line entry point?
    options:
      - "Speed, since a script runs faster than the same code in a notebook kernel"
      - "It becomes testable and callable, so the thing you validated can be run again by something other than a human clicking cells"
      - "Notebooks cannot be version-controlled, so moving to a script is what makes the work reviewable"
      - "It reduces memory use, since a script releases state between stages"
    answer: "It becomes testable and callable, so the thing you validated can be run again by something other than a human clicking cells"
    evidence: |
      Notebooks are version-controllable, awkwardly, so that is not the argument.
      The argument is that a notebook's execution order is a human decision made
      at runtime, and a module's is not. Once there is an entry point, CI can run
      it, a scheduler can run it, and a test can assert what it produces, none of
      which is available to a sequence of cells.
    source:
      file: lectures/l02/notes.md
      heading: "From notebook to module"
      quote: "From notebook to module"
    verify: {mode: quote, needle: "notebook to module", volatility: stable}
    tags: [packaging, testing]
    sequence:
      prompt: "The notebook refactor: the functions the data moves through, in order."
      steps: [load, clean, featurize, train]
      why: >-
        The refactor is mechanical, which is the good news. Each function takes
        its inputs as arguments and returns a value, so it can be imported and
        tested on its own rather than depending on the ambient state of a
        notebook that has to be run in an order you remember.
    terms:
      prompt: "Folders and files of the src layout"
      correct: [src, data, notebooks, scripts, tests, pyproject.toml, uv.lock, .python-version]
      wrong: [dist, vendor, node_modules, bin]

  - id: l02-q08
    kind: mechanism_recall
    rung: 5
    difficulty: 2
    objectives: [l02-o4]
    prompt: |
      Close the notes. What has to be true for "one run equals one fact you can
      reproduce"? List what a run must record. Stop when you stall, and note
      where.
    checklist:
      - text: "A locked environment, so the packages can be reinstalled exactly"
        needle: "lockfile"
      - text: "A pinned interpreter version"
        needle: "pinned interpreter"
      - text: "A fixed random seed"
        needle: "fixed seed"
      - text: "The code commit, recorded as a SHA"
        needle: "recorded SHA"
      - text: "A content hash of the input data"
        needle: "hash"
    answer: null
    evidence: |
      Five things, and the tracker enforces none of them. That is the point of
      the list: MLflow will happily record a run missing four of the five, and the
      record will look identical to a good one. The habits are what make the
      thing you filed worth retrieving.
    source:
      file: lectures/l02/notes.md
      heading: "Tracking records; it does not enforce"
      quote: "the lockfile, the pinned interpreter, the fixed seed, and the recorded SHA and hash"
    verify:
      mode: manual
      needle: "the pinned interpreter, the fixed seed"
      volatility: stable
      exempt_reason: >-
        Free-text recall; each checklist entry is verified against the source
        individually rather than the answer being matched as a whole.
    tags: [tracking, self-test]

  - id: l02-q09
    kind: locus_of_control
    rung: 3
    difficulty: 3
    objectives: [l02-o1]
    prompt: |
      Two labs report different results from what is supposedly the same
      analysis. Both can reproduce their own numbers exactly.

      What resolves it?
    options:
      - "Comparing lockfiles, since a dependency difference is the likeliest cause of a numeric disagreement"
      - "Re-implementing the analysis independently, which is how the Duke errors were actually found"
      - "Re-running each pipeline on the other lab's data, which isolates data from code"
      - "Increasing precision, since disagreements of this kind usually trace to floating-point accumulation"
    answer: "Re-implementing the analysis independently, which is how the Duke errors were actually found"
    evidence: |
      Every other option is a good diagnostic and none of them can catch a shared
      misunderstanding of what the analysis should do. Re-running reproduces;
      re-implementing validates. The Duke errors survived because re-running the
      original code would have faithfully regenerated the mistakes, and they were
      only found when outside statisticians built the analysis again from scratch
      and the two versions disagreed.
    source:
      file: lectures/l02/notes.md
      heading: "Reproducible is not the same as correct"
      quote: "Outside statisticians re-implemented the analysis from scratch and found that the two versions disagreed"
    verify: {mode: quote, needle: "the analysis from scratch", volatility: stable}
    tags: [reproducibility, validation]

  - id: l02-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l02-o3]
    prompt: |
      Open [`l02-scaffold.ipynb`](../lectures/l02/l02-scaffold.ipynb) and work
      through building the project scaffold.

      What does `uv` produce that a `requirements.txt` does not?
    options:
      - "A faster install, since uv resolves dependencies in parallel"
      - "A lockfile recording what was actually installed, including transitive dependencies, rather than what was asked for"
      - "A virtual environment, which requirements.txt cannot create"
      - "A dependency graph, which requirements.txt flattens and loses"
    answer: "A lockfile recording what was actually installed, including transitive dependencies, rather than what was asked for"
    evidence: |
      A requirements file is a request; a lockfile is a record. The distinction
      only bites when a transitive dependency moves under you, which is exactly
      the failure L13 documents when scikit-learn 1.8 and 1.9 assigned folds
      differently under an identical call. Speed is real and is not the reason
      this is in the toolchain.
    source:
      file: lectures/l02/notes.md
      heading: "Lockfiles and requirements files"
      quote: "Lockfiles and requirements files"
    verify: {mode: quote, needle: "Lockfiles and requirements files", volatility: stable}
    tags: [environments, notebook]
