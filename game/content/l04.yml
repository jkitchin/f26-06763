  - id: l04-q09
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l04-o1]
    prompt: |
      A pipeline writes one Parquet file per reading, as readings arrive.

      What is wrong?
    options:
      - "Nothing; appending new files is the documented way to add data to Parquet"
      - "Parquet's advantages come from scanning columns across many rows, and a file per row gives up all of them while adding per-file overhead"
      - "Parquet cannot store a single row, so the writes will fail"
      - "The files will not be readable by DuckDB unless they share a schema"
    answer: "Parquet's advantages come from scanning columns across many rows, and a file per row gives up all of them while adding per-file overhead"
    evidence: |
      Writing new files is indeed how you add data to Parquet, which is what makes
      this failure plausible enough to happen: the mechanism is correct and the
      granularity destroys the point. Columnar compression and column skipping
      both need many rows in one file to do anything, and each file carries schema
      and footer overhead. This access pattern is a row store's, and it should be
      in one.
    source:
      file: lectures/l04/notes.md
      heading: "Parquet: a columnar file format"
      quote: "Parquet: a columnar file format"
    verify: {mode: quote, needle: "a columnar file format", volatility: stable}
    tags: [parquet, anti-pattern]

  - id: l04-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l04-o2]
    prompt: |
      Open [`l04-storage.ipynb`](../lectures/l04/l04-storage.ipynb) and run the
      same aggregate against a row store and against Parquet via DuckDB.

      What should you take from the ratio you measure?
    options:
      - "That DuckDB should be the default engine for this workload from now on"
      - "That the advantage is specific to this access pattern and this size, which is the thing to check before choosing"
      - "That PostgreSQL is misconfigured, since a correctly indexed server should match a columnar scan"
      - "That the comparison is unfair, since the two are not doing the same work"
    answer: "That the advantage is specific to this access pattern and this size, which is the thing to check before choosing"
    evidence: |
      The two *are* doing the same work, which is what makes the comparison
      meaningful; they are doing it against layouts built for different patterns.
      Run the same comparison on a point lookup and the ordering reverses. The
      measured 80-times speedup is real, it appears at millions of rows, and it
      is an argument for a seam between two stores rather than for replacing one
      with the other.
    source:
      file: lectures/l04/notes.md
      heading: "DuckDB: SQL analytics inside your process"
      quote: "DuckDB: SQL analytics inside your process"
    verify: {mode: quote, needle: "SQL analytics inside your process", volatility: stable}
    tags: [duckdb, benchmark, notebook]
