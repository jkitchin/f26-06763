  # --- o1: what a PINN minimizes, and why its physics is approximate ---------------------------

  - id: l13-q01
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l13-o1]
    prompt: |
      A PINN's loss has two terms. What does the second one measure?
    options:
      - "The residual of the governing equation, zero for a function that obeys it exactly"
      - "The error against measurements taken after the training window"
      - "The size of the network's weights, to keep it from overfitting"
      - "The difference between the PINN and a plain network trained on the same data"
    answer: "The residual of the governing equation, zero for a function that obeys it exactly"
    evidence: |
      The first term fits the data. The second plugs the network's output and its derivatives
      into the equation of motion and squares what is left over, the residual. A function that
      obeys the equation exactly makes it zero.
    source:
      file: lectures/l13/notes.md
      heading: "Physics in the loss"
      quote: |
        The **second term is the residual** of the equation: zero for a function that obeys it
        exactly.
    verify: {mode: quote, needle: "second term is the residual", volatility: stable}
    tags: [pinn, loss, residual]

  - id: l13-q02
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l13-o1]
    prompt: |
      Where does the spring-mass PINN evaluate its physics term?
    options:
      - "At 40 collocation points spread over the whole second, including where there is no data"
      - "Only at the 10 measured time points, where the answer is known"
      - "Only after the last measurement, where the data cannot help"
      - "At every training step's random batch of measurements"
    answer: "At 40 collocation points spread over the whole second, including where there is no data"
    evidence: |
      The physics term needs no measurements, only the equation, so it can be evaluated
      anywhere. Spreading the collocation points over the whole interval is what lets the
      equation guide the network after the data run out.
    source:
      file: lectures/l13/notes.md
      heading: "Physics in the loss"
      quote: |
        Here there are $M = 40$ collocation points, spread over the whole interval from 0 to 1 s,
        where we have no data.
    verify: {mode: quote, needle: "spread over the whole interval", volatility: stable}
    tags: [pinn, collocation-point]

  - id: l13-q03
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l13-o1]
    prompt: |
      You raise λ, the weight on the PINN's physics term, and retrain. What happens?
    options:
      - "The residual shrinks, and the fit to the data gets a little worse"
      - "The residual becomes exactly zero"
      - "Both the residual and the fit to the data improve"
      - "Nothing, since λ only rescales the whole loss"
    answer: "The residual shrinks, and the fit to the data gets a little worse"
    evidence: |
      The physics is a penalty, so λ sets the exchange rate between the two terms. Making the
      residual more expensive shrinks it at some cost in data fit, but a penalty never forces it
      to exactly zero.
    source:
      file: lectures/l13/notes.md
      heading: "The physics is a penalty, not a constraint"
      quote: |
        This is a **soft constraint**: the optimizer trades a little physics for a little data fit,
        with $\lambda$ setting the exchange rate.
    verify: {mode: quote, needle: "trades a little physics for a little data fit", volatility: stable}
    tags: [pinn, soft-constraint, lambda]

  - id: l13-q04
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l13-o1]
    prompt: |
      After training, the PINN's residual is 0.7 N at its 40 collocation points. What is it over
      the whole second?
    options:
      - "Larger: 5.3 N, because the physics is penalized only where it is evaluated"
      - "Also about 0.7 N, because the network is smooth between the points"
      - "Exactly zero, because the collocation points cover the interval"
      - "Smaller, because the residual averages out between the points"
    answer: "Larger: 5.3 N, because the physics is penalized only where it is evaluated"
    evidence: |
      The optimizer only sees the residual at the collocation points, so that is where it is
      pushed down. Between them nothing penalizes it, and over the whole second the root mean
      square is 5.3 N.
    source:
      file: lectures/l13/notes.md
      heading: "The physics is a penalty, not a constraint"
      quote: |
        At the 40 collocation points it is 0.7 N; between them it is larger. The physics is
        penalized only where you evaluate it.
    verify: {mode: quote, needle: "penalized only where you evaluate it", volatility: measured}
    tags: [pinn, residual, collocation-point]

  # --- o2: a PINN in JAX, against a plain network -----------------------------------------------

  - id: l13-q05
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l13-o2]
    prompt: |
      Both networks fit the 10 spring-mass measurements from the first 0.36 s. After the data run
      out, which one is right?
    options:
      - "The PINN; the plain network is wrong by about half a meter"
      - "Both, since they fit the same 10 points"
      - "The plain network, since no residual term compromises its fit"
      - "Neither, since no model can say anything past its data"
    answer: "The PINN; the plain network is wrong by about half a meter"
    evidence: |
      With nothing after 0.36 s, the plain network drifts to a flat line (RMSE 0.54 m). The PINN
      follows the oscillation (RMSE 0.001 m), because the equation tells it what happens next.
    source:
      file: lectures/l13/notes.md
      heading: "Training and the result"
      quote: |
        After it, the plain network is wrong by about half a meter. The PINN is right, because the
        equation told it what happens next.
    verify: {mode: quote, needle: "the plain network is wrong by about half a meter", volatility: measured}
    tags: [pinn, extrapolation]

  - id: l13-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o2]
    prompt: |
      The PINN needs the second derivative of the network with respect to time. How does the JAX
      code get it?
    options:
      - "By applying jax.grad twice, differentiating with respect to the input t"
      - "By finite differences between neighbouring collocation points"
      - "With jax.vmap, which returns the derivative at every point at once"
      - "With a second network trained to predict the acceleration"
    answer: "By applying jax.grad twice, differentiating with respect to the input t"
    evidence: |
      jax.grad returns the derivative of a scalar function. Applied to the network's output as a
      function of t, and then again, it gives the exact second derivative. jax.vmap only
      evaluates that derivative at many points at once.
    source:
      file: lectures/l13/notes.md
      heading: "A PINN in JAX"
      quote: |
        `jax.grad(f, argnums=1)` returns the derivative of `f` with respect to its second
        argument, the time; applying it twice gives the second derivative.
    verify: {mode: quote, needle: "applying it twice gives the second derivative", volatility: stable}
    tags: [jax, automatic-differentiation, pinn]

  # --- o3: from a recurrent network to a neural ODE ---------------------------------------------

  - id: l13-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o3]
    prompt: |
      A recurrent network and a neural ODE are both trained on the same spring-mass data. What
      does the neural ODE learn that the recurrent network does not?
    options:
      - "The right-hand side f, the vector field, which holds for any starting state and any sampling times"
      - "The jump from one sample to the next, for one fixed step size"
      - "One trajectory x(t), for this release of the mass"
      - "The step sizes the ODE solver should take"
    answer: "The right-hand side f, the vector field, which holds for any starting state and any sampling times"
    evidence: |
      A recurrent network learns a time-discrete realization of the dynamics, tied to its step
      Δt. A neural ODE learns f itself, the arrows on the phase plane, and the solver turns those
      into a trajectory at whatever times you ask for.
    source:
      file: lectures/l13/notes.md
      heading: "What a neural ODE learns: the vector field"
      quote: |
        A neural ODE learns the right-hand side $f$: the **vector field** of the system. A recurrent
        network learns one time-discrete realization of it, tied to its step $\Delta t$.
    verify: {mode: quote, needle: "one time-discrete realization of it", volatility: stable}
    tags: [neural-ode, vector-field, recurrent-network]

  - id: l13-q08
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l13-o3]
    prompt: |
      You halve the time step of the recurrent update. What happens to its largest error against
      the exact solution of the ODE?
    options:
      - "It roughly halves, because forward Euler is first order"
      - "It drops to about a quarter"
      - "It stays the same, because the network has not changed"
      - "It doubles, because twice as many steps accumulate error"
    answer: "It roughly halves, because forward Euler is first order"
    evidence: |
      Forward Euler's error is proportional to the step size, so halving Δt halves it. On the
      spring-mass the largest error went from 0.106 to 0.049 to 0.024 m as Δt halved from
      0.0025 s.
    source:
      file: lectures/l13/notes.md
      heading: "Shrinking the step"
      quote: |
        From $\Delta t = 0.0025$ s down, halving the step halves the error. Forward Euler is a
        **first-order** method.
    verify: {mode: quote, needle: "halving the step halves the error", volatility: measured}
    tags: [euler, convergence, neural-ode]

  - id: l13-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o3]
    prompt: |
      Start from the residual update h_(k+1) = h_k + Δt f(h_k; θ), with f a neural network.
      What do you get as Δt goes to zero?
    options:
      - "A neural ODE, dh/dt = f(h, t, θ), of which the recurrent network is the Euler discretization"
      - "A PINN, because the residual of the update goes to zero"
      - "A DAE, because the update becomes an algebraic equation"
      - "The same recurrent network, run for more steps"
    answer: "A neural ODE, dh/dt = f(h, t, θ), of which the recurrent network is the Euler discretization"
    evidence: |
      Dividing by Δt turns the left side into a difference quotient, which becomes a derivative
      in the limit. The recurrent network was a forward Euler discretization of that ODE all
      along.
    source:
      file: lectures/l13/notes.md
      heading: "The limit"
      quote: |
        Let $\Delta t \to 0$. The left side tends to the derivative of $h$ (Chen et al., Eq. 2):
    verify: {mode: quote, needle: "the left side tends to the derivative", volatility: stable}
    tags: [neural-ode, recurrent-network]

  # --- o4: physics enforced, path constraints and DAEs -------------------------------------------------------------------

  - id: l13-q10
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l13-o4]
    prompt: |
      In the tank manifold, two tanks must keep equal levels, x0 = x1. Which equation gives the
      flow y2 into tank x1?
    options:
      - "None: y2 is whatever keeps the two levels equal"
      - "A valve equation relating y2 to the pressure drop"
      - "The pump equation, since the pump drives every flow"
      - "A neural network trained on measured flows"
    answer: "None: y2 is whatever keeps the two levels equal"
    evidence: |
      The constraint x0 = x1 holds at every instant, and y2 is the algebraic variable that makes
      it hold. No equation states it directly, which is what makes the model a DAE rather than
      an ODE.
    source:
      file: lectures/l13/notes.md
      heading: "Differential-algebraic equations"
      quote: |
        No equation gives $y_2$ directly. It is whatever keeps $x_0 = x_1$ at every instant.
    verify: {mode: quote, needle: "no equation gives", volatility: stable}
    tags: [dae, algebraic-variable]

  - id: l13-q11
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o4]
    prompt: |
      A batch reactor's temperature must stay below a limit at every instant. A PINN-style model
      puts that limit in its loss as a penalty. Why is that not enough?
    options:
      - "A penalty makes violations small, not zero; the limit has to hold at every instant, as a path constraint"
      - "A penalty cannot be differentiated, so the optimizer ignores it"
      - "Penalties only work for equality constraints"
      - "Temperature limits can only be held by a controller, never by a model"
    answer: "A penalty makes violations small, not zero; the limit has to hold at every instant, as a path constraint"
    evidence: |
      A penalty trades the constraint against the data fit, so it can leave a small violation,
      and it only acts where it is evaluated. A safety limit is a path constraint: it must hold
      at every instant, which needs it enforced, not penalized.
    source:
      file: lectures/l13/notes.md
      heading: "From a penalty to a constraint"
      quote: |
        **Safety.** A reactor temperature or a pressure must stay below its limit at every instant.
    verify: {mode: quote, needle: "must stay below its limit at every instant", volatility: stable}
    tags: [hard-constraint, path-constraint, practitioner]

  # --- o5: sequential and simultaneous training ---------------------------------------------------

  - id: l13-q12
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l13-o5]
    prompt: |
      In the simultaneous approach, when are the model equations satisfied?
    options:
      - "Only when the solver converges"
      - "At every iterate, since each iterate is a simulation"
      - "Only at the measured time points"
      - "Never exactly; they are penalized like a PINN's residual"
    answer: "Only when the solver converges"
    evidence: |
      The states at every time point are unknowns of one optimization problem, and the model is
      a set of equality constraints on them. Intermediate iterates can break those constraints;
      the converged solution satisfies them.
    source:
      file: lectures/l13/notes.md
      heading: "Simultaneous: discretize, then optimize"
      quote: |
        The model equations are satisfied **only when the solver converges**.
    verify: {mode: quote, needle: "only when the solver converges", volatility: stable}
    tags: [simultaneous-approach, collocation]

  - id: l13-q13
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o5]
    prompt: |
      At iteration 0 the simultaneous fit of the spring-mass has a sum of squared errors of 0.00.
      Why is it not finished?
    options:
      - "Its states sit on the data but break the model equations"
      - "It has not computed a gradient yet"
      - "The data are noisy, so a perfect fit is suspect"
      - "Interior-point solvers always run a fixed number of iterations"
    answer: "Its states sit on the data but break the model equations"
    evidence: |
      The states start as an interpolation of the data, so the misfit is zero, but the largest
      violation of the collocation equations is 7.7. The solver then repairs the physics, ending
      with a defect of 2.5e-15.
    source:
      file: lectures/l13/notes.md
      heading: "The same problem, both ways"
      quote: |
        The **simultaneous** run starts with the states on the data (so it fits, but breaks the
        ODE), then pulls the two together.
    verify: {mode: quote, needle: "so it fits, but breaks the", volatility: stable}
    tags: [simultaneous-approach, infeasible-path]

  - id: l13-q14
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l13-o5]
    prompt: |
      A team estimates the damping and stiffness of a lightly damped oscillator by single
      shooting, starting from k = 150 N/m, and reports μ = 0.29 N·s/m and k = 419 N/m as the
      system's values. What did they miss?
    options:
      - "Single shooting can stop in a local minimum on oscillating data; the simultaneous approach from the same start found μ = 0.99, k = 402"
      - "BFGS needed more iterations to reach the true values"
      - "With noisy data, the damping cannot be estimated at all"
      - "Single shooting cannot estimate two parameters at once"
    answer: "Single shooting can stop in a local minimum on oscillating data; the simultaneous approach from the same start found μ = 0.99, k = 402"
    evidence: |
      A simulated oscillation slightly out of phase with the data misfits everywhere, so the loss
      has many local minima. The sequential run stopped in one (sum of squared errors 5.23); the
      simultaneous run reached the true values within noise (0.036).
    source:
      file: lectures/l13/notes.md
      heading: "The same problem, both ways"
      quote: |
        The **sequential** run gets stuck in a **local minimum**.
    verify: {mode: quote, needle: "gets stuck in a", volatility: measured}
    tags: [sequential-approach, local-minimum, practitioner]

  # --- o6: a neural DAE with SiNDAE -----------------------------------------------------------------

  - id: l13-q15
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o6]
    prompt: |
      On a new batch, the bioreactor's neural ODE drives the substrate to −0.37 g/L. What does
      SiNDAE's neural DAE prediction do differently?
    options:
      - "Solves the same model as an NLP with S ≥ 0, moving the growth rate off the network's value only where a constraint would break"
      - "Retrains the network on the new batch before predicting"
      - "Clips the substrate at zero after integrating"
      - "Integrates with a smaller time step"
    answer: "Solves the same model as an NLP with S ≥ 0, moving the growth rate off the network's value only where a constraint would break"
    evidence: |
      In prediction the network equation gets slack variables whose sum is penalized. The solver
      keeps the network's growth rate wherever it can, and overrules it only where S would
      otherwise go negative.
    source:
      file: lectures/l13/notes.md
      heading: "Inference on a new batch"
      quote: |
        In prediction, SiNDAE lets the solver move the growth rate away from the network's value only
        where a constraint would otherwise break, at a price set by `slack_coef`.
    verify: {mode: quote, needle: "only where a constraint would otherwise break", volatility: stable}
    tags: [neural-dae, sindae, constraint]

  - id: l13-q16
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l13-o6]
    prompt: |
      A report says: "The neural DAE never lets the substrate go negative, so it must be more
      accurate than the neural ODE on every state." What is wrong with the claim?
    options:
      - "Feasible is not accurate: the neural DAE's substrate error is 0.30 g/L, the neural ODE's 0.19 g/L"
      - "Nothing: a constraint that holds makes every predicted state more accurate"
      - "The neural DAE cannot predict substrate, only biomass"
      - "The neural DAE's substrate does go negative, only less than the neural ODE's"
    answer: "Feasible is not accurate: the neural DAE's substrate error is 0.30 g/L, the neural ODE's 0.19 g/L"
    evidence: |
      The constraint stops the prediction from being impossible; it does not make the learned
      growth rate correct. On the new batch the neural DAE never goes below zero, yet its
      substrate error against the true model (RMSE 0.30 g/L) is larger than the neural ODE's
      (0.19 g/L).
    source:
      file: lectures/l13/notes.md
      heading: "Inference on a new batch"
      quote: |
        **Feasible is not the same as accurate.** The constraint keeps the prediction physical; it
        does not make the learned growth rate correct.
    verify: {mode: quote, needle: "feasible is not the same as accurate", volatility: measured}
    tags: [neural-dae, accuracy, practitioner]

  # --- o7: where the physics lives -------------------------------------------------------------------

  - id: l13-q17
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o7]
    prompt: |
      A projection layer enforces a linear balance A y = b, such as a heat exchanger's energy
      balance, on a network's output. How well does the output satisfy it?
    options:
      - "To machine precision, in training and in use"
      - "Approximately, with the error set by a penalty weight like a PINN's λ"
      - "Only on the training data"
      - "Only after the network has been trained to convergence"
    answer: "To machine precision, in training and in use"
    evidence: |
      The layer replaces the raw output by the closest point on the constraint, a fixed linear
      correction with no trainable weights. Every output it returns satisfies A y = b, whatever
      the network upstream does.
    source:
      file: lectures/l13/notes.md
      heading: "Projection layers"
      quote: |
        The output satisfies $Ay = b$ to machine precision, in training and in use.
    verify: {mode: quote, needle: "to machine precision, in training and in use", volatility: stable}
    tags: [projection-layer, hard-constraint]

  - id: l13-q18
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l13-o7]
    prompt: |
      A neural DAE and a projection layer both enforce a constraint exactly. Where does each one
      do it?
    options:
      - "The neural DAE in the solver; the projection layer in the network, on every forward pass"
      - "Both in the loss, with a large penalty weight"
      - "The neural DAE in the network; the projection layer in the solver"
      - "Both after training, by clipping the outputs"
    answer: "The neural DAE in the solver; the projection layer in the network, on every forward pass"
    evidence: |
      A neural DAE writes the constraints into the optimization problem the solver satisfies. A
      projection layer is part of the network itself, so every output it returns already obeys
      the constraint.
    source:
      file: lectures/l13/notes.md
      heading: "Constraints inside the network: projection layers"
      quote: |
        A neural DAE enforces constraints in the **solver**. Another option is to build them into the
        **network**, so that every output satisfies them.
    verify: {mode: quote, needle: "enforces constraints in the", volatility: stable}
    tags: [neural-dae, projection-layer, comparison]
