# L13 item bank for scientific machine learning: physics-informed neural networks (PINNs) on a
# damped spring-mass, recurrent networks as Euler steps of a neural ODE that learns a vector
# field, physics enforced as constraints (path constraints, DAEs), sequential and simultaneous
# training, neural DAEs trained and solved with SiNDAE on a fed-batch bioreactor, and projection
# layers. Version 4 replaced version 3 after the lecture was reworked: items on the GRU, the
# thermocouple and the DAE index were replaced. Version 5 updates the bioreactor numbers after
# the lecture moved to the SiNDAE example's three training batches. None was served.

