  # --- o1: a generative model of text -------------------------------------------------------

  - id: l17-q21
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o1]
    prompt: |
      At its core, what does an LLM do?
    options:
      - "Gives a probability for the next token, then repeats"
      - "Looks up the answer in a database of facts"
      - "Searches the web and summarizes what it finds"
      - "Runs a program written for each kind of question"
    answer: "Gives a probability for the next token, then repeats"
    evidence: |
      It gives a probability for every possible next token; one is picked and appended, and the
      model runs again. Chat, summaries and code all come from this one loop.
    source:
      file: lectures/l17/notes.md
      heading: "Why this matters"
      quote: |
        Under the hood, an LLM does one thing: it gives a probability for the next token, and one token
          is picked.
    verify: {mode: quote, needle: "it gives a probability for the next token", volatility: stable}
    tags: [overview, next-token]

  - id: l17-q22
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o1]
    prompt: |
      How does a chatbot turn your question into an answer?
    options:
      - "It continues a hidden script that holds your message"
      - "It retrieves a stored answer that matches your question"
      - "It writes the whole answer at once, then checks it"
      - "It turns your question into a database query"
    answer: "It continues a hidden script that holds your message"
    evidence: |
      The app wraps your message in a script, with special tokens marking who speaks. The model
      continues that script one token at a time, and the app shows only the reply.
    source:
      file: lectures/l17/notes.md
      heading: "Why this matters"
      quote: |
        The app wraps your question in a hidden script
    verify: {mode: quote, needle: "hidden script", volatility: stable}
    tags: [overview, chat]

  - id: l17-q01
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o1]
    prompt: |
      Lecture 16's generative models drew a whole point (x, y) at once. How does an LLM generate
      a text?
    options:
      - "One token at a time, each given the tokens before it"
      - "Every token at once, like one sample from a Gaussian mixture"
      - "Word by word, with each word drawn independently"
      - "As one whole sentence, picked from a list of candidates"
    answer: "One token at a time, each given the tokens before it"
    evidence: |
      A text has far too many possible values to draw at once. One token at a time, each step is
      one choice from the vocabulary, and the chain rule makes the result exact.
    source:
      file: lectures/l17/notes.md
      heading: "One variable at a time"
      quote: |
        One token at a time, each step is one choice among 50,257.
    verify: {mode: quote, needle: "one choice among 50,257", volatility: stable}
    tags: [generative-model, lecture-16]

  - id: l17-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o1]
    prompt: |
      Why is predicting the next token enough to model a whole text?
    options:
      - "The chain rule splits p(text) into next-token probabilities"
      - "Each word depends only on the word right before it"
      - "It is a rough approximation that works for short texts"
      - "The model memorizes every text it was trained on"
    answer: "The chain rule splits p(text) into next-token probabilities"
    evidence: |
      The probability of a text is exactly the product of its next-token probabilities, with no
      approximation. Learn those, and the model can both score a text and write one.
    source:
      file: lectures/l17/notes.md
      heading: "The chain rule"
      quote: |
        The chain rule of probability writes the probability of a text as a product of next-token
          probabilities, with no approximation:
    verify: {mode: quote, needle: "with no approximation", volatility: stable}
    tags: [chain-rule]

  - id: l17-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o1]
    prompt: |
      An LLM writing an answer works like Lecture 8's recursive forecast. What weakness do they
      share?
    options:
      - "Each output is fed back in, so early errors carry forward"
      - "Both can look back only a fixed 10 steps"
      - "Both are linear models of their inputs"
      - "Both must be trained on labels written by people"
    answer: "Each output is fed back in, so early errors carry forward"
    evidence: |
      Both use their own predictions as later inputs. In Lecture 8 the forecast drifted to the
      mean; in an LLM, one wrong token early on steers the rest of the answer.
    source:
      file: lectures/l17/notes.md
      heading: "Autoregressive, as in Lecture 8"
      quote: |
        **The same weakness:** both feed their own outputs back in, so an early mistake becomes an input
          for every later step.
    verify: {mode: quote, needle: "an early mistake becomes an input", volatility: stable}
    tags: [autoregressive, lecture-8]

  # --- o2: tokens and the context window ----------------------------------------------------

  - id: l17-q23
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o2]
    prompt: |
      What is a token?
    options:
      - "A piece of text: a character, a word or part of a word"
      - "One full sentence of the prompt"
      - "One parameter of the model"
      - "One layer of the transformer"
    answer: "A piece of text: a character, a word or part of a word"
    evidence: |
      The tokenizer cuts text into tokens and gives each one a number, its id. The model never
      sees letters, only the ids.
    source:
      file: lectures/l17/notes.md
      heading: "Tokens"
      quote: |
        A **token** is a piece of text the model reads and writes: a character, a word, or part of a word.
    verify: {mode: quote, needle: "a character, a word, or part of a word", volatility: stable}
    tags: [tokens, overview]

  - id: l17-q04
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o2]
    prompt: |
      Byte-pair encoding merges frequent pieces of text into single tokens. What does that buy?
    options:
      - "Fewer tokens per text: more fits, and writing is faster"
      - "Exactly one token for every word ever written"
      - "A model that no longer needs a vocabulary"
      - "Rare words are dropped, so the text gets cleaner"
    answer: "Fewer tokens per text: more fits, and writing is faster"
    evidence: |
      Frequent pieces become one token, so sequences get shorter: more text fits in the context
      window and generation takes fewer steps. Rare words still split into known pieces.
    source:
      file: lectures/l17/notes.md
      heading: "Byte-pair encoding"
      quote: |
        Frequent pieces become one token, so sequences get shorter
    verify: {mode: quote, needle: "sequences get shorter", volatility: stable}
    tags: [byte-pair-encoding]

  - id: l17-q06
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l17-o2]
    prompt: |
      An LLM reads "4140" as two text pieces, "414" and "0". What should you do with arithmetic
      and unit conversions?
    options:
      - "Do them in code, not in the model"
      - "Write every number in scientific notation"
      - "Raise the temperature so it tries more digits"
      - "Nothing: the model computes them exactly"
    answer: "Do them in code, not in the model"
    evidence: |
      The model predicts digits as text; it does not calculate. Numbers, units and part numbers
      are where LLMs slip, so check them and compute in code.
    source:
      file: lectures/l17/notes.md
      heading: "Numbers and units cost more than words"
      quote: |
        **So numbers, units and part numbers are where LLMs slip.** Check them, and do the arithmetic
          in code.
    verify: {mode: quote, needle: "do the arithmetic", volatility: stable}
    tags: [numbers, practitioner]

  - id: l17-q07
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o2]
    prompt: |
      You paste a manual longer than the model's context window. What happens to the part past
      the window?
    options:
      - "The model never sees it"
      - "It is read, but with lower attention weights"
      - "It is summarized automatically before answering"
      - "It is stored and read on your next question"
    answer: "The model never sees it"
    evidence: |
      The context window is the most tokens the model can take in at once. Text beyond it is not
      part of the input, so long documents must be cut, summarized or searched first.
    source:
      file: lectures/l17/notes.md
      heading: "The context window"
      quote: |
        Text beyond the window is not seen at all. Long documents must be cut, summarized or searched.
    verify: {mode: quote, needle: "not seen at all", volatility: stable}
    tags: [context-window]

  # --- o3: pretraining on the transformer with a causal mask --------------------------------

  - id: l17-q24
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o3]
    prompt: |
      What happens in one training step of an LLM?
    options:
      - "It guesses next tokens; all parameters are nudged toward the truth"
      - "A person corrects its answers and rewrites its rules"
      - "It saves the text in a database to look up when asked later"
      - "It picks the best of several models trained side by side"
    answer: "It guesses next tokens; all parameters are nudged toward the truth"
    evidence: |
      Show it text, let it guess each next token, compare with the token that really came next,
      and take a gradient step on every parameter. Repeat, many times over.
    source:
      file: lectures/l17/notes.md
      heading: "Tuning the dials"
      quote: |
        nudge every dial a little so the true one gets more
          likely.
    verify: {mode: quote, needle: "nudge every dial a little", volatility: stable}
    tags: [training, overview]

  - id: l17-q09
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o3]
    prompt: |
      Pretraining uses trillions of tokens that nobody labeled. Where do the targets come from?
    options:
      - "The text itself, shifted by one token"
      - "People who label a small sample of it"
      - "A smaller model that labels it first"
      - "The tokenizer, which marks tokens right or wrong"
    answer: "The text itself, shifted by one token"
    evidence: |
      The target at every position is the token that actually came next. That is why any text
      can be used, without anyone labeling it.
    source:
      file: lectures/l17/notes.md
      heading: "Every position at once"
      quote: |
        **Self-supervised:** the labels are the text itself, shifted by one.
    verify: {mode: quote, needle: "shifted by one", volatility: stable}
    tags: [self-supervised, pretraining]

  - id: l17-q08
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o3]
    prompt: |
      An LLM uses Lecture 12's transformer with one change. Which?
    options:
      - "Each token sees only itself and earlier tokens"
      - "There is no attention, only the MLP"
      - "Each token sees only the token right before it"
      - "The tokens are read from right to left"
    answer: "Each token sees only itself and earlier tokens"
    evidence: |
      A causal mask hides later tokens. In training the next token is the answer, so it has to
      stay hidden.
    source:
      file: lectures/l17/notes.md
      heading: "Attention looks back"
      quote: |
        One change from Lecture 12: a token may attend only to itself and the tokens before it.
    verify: {mode: quote, needle: "only to itself and the tokens before it", volatility: stable}
    tags: [causal-mask, lecture-12]

  # --- o4: size, data, compute and post-training --------------------------------------------

  - id: l17-q14
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o4]
    prompt: |
      Trained on our notes alone, the tiny GPT spells our terms but writes no meaningful sentence.
      What would help most?
    options:
      - "Far more text, and a bigger model"
      - "Training longer on the same notes"
      - "A higher sampling temperature"
      - "A longer context window"
    answer: "Far more text, and a bigger model"
    evidence: |
      It already copies our style. Meaning takes far more data and parameters; training longer
      on the same small text only memorizes it.
    source:
      file: lectures/l17/notes.md
      heading: "What it writes as it learns"
      quote: |
        Far more text, and a
          bigger model, are what turn style into meaning.
    verify: {mode: quote, needle: "turn style into meaning", volatility: stable}
    tags: [scale, tiny-gpt]

  - id: l17-q16
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o4]
    prompt: |
      A pretrained model continues your question instead of answering it. What turns it into a
      chat model?
    options:
      - "More training on good answers and on people's preferences"
      - "More pretraining on web text"
      - "A larger context window"
      - "A lower temperature"
    answer: "More training on good answers and on people's preferences"
    evidence: |
      Supervised fine-tuning trains on examples of good answers; RLHF or DPO then trains on which
      of two answers people prefer. More pretraining only makes it better at continuing text.
    source:
      file: lectures/l17/notes.md
      heading: "After pretraining"
      quote: |
        **Supervised fine-tuning** (SFT) trains it further, with the same next-token loss, on examples
           of instructions and good answers, written by people.
    verify: {mode: quote, needle: "instructions and good answers", volatility: stable}
    tags: [post-training]

  - id: l17-q25
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o4]
    prompt: |
      You ask an LLM about last week's measurements from your plant. What is the problem?
    options:
      - "It knows only its training data: nothing recent or private"
      - "Measurements are too numeric for any LLM to read"
      - "It refuses every question about a specific plant"
      - "A week of data is always too long for its context window"
    answer: "It knows only its training data: nothing recent or private"
    evidence: |
      Training stops at a cutoff date and never sees your company's documents. Put the data it
      needs in the prompt, and do not ask it for current values.
    source:
      file: lectures/l17/notes.md
      heading: "Limitations and trade-offs"
      quote: |
        **It knows only its training data:** nothing after its cutoff date
    verify: {mode: quote, needle: "nothing after its cutoff date", volatility: stable}
    tags: [training-data, practitioner]

  # --- o5: temperature and hallucination ----------------------------------------------------

  - id: l17-q17
    kind: direction
    rung: 2
    difficulty: 1
    objectives: [l17-o5]
    prompt: |
      You lower the temperature. What happens to the text the model writes?
    options:
      - "Safer and more repetitive: it sticks to the likeliest tokens"
      - "More varied: unlikely tokens get a real chance"
      - "Nothing changes; only the speed goes up"
      - "It switches to a smaller vocabulary"
    answer: "Safer and more repetitive: it sticks to the likeliest tokens"
    evidence: |
      Low temperature sharpens the probabilities toward the most likely token. High temperature
      flattens them, so the text gets more varied and makes more mistakes.
    source:
      file: lectures/l17/notes.md
      heading: "Sampling: temperature"
      quote: |
        Below 1, it sharpens the
          distribution toward the most likely token; above 1, it flattens it.
    verify: {mode: quote, needle: "sharpens the", volatility: stable}
    tags: [temperature]

  - id: l17-q19
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o5]
    prompt: |
      Why can an LLM state a wrong number as fluently as a right one?
    options:
      - "Training rewards likely text; nothing checks facts"
      - "Numbers are hidden from the model during training"
      - "A low temperature forces it to guess"
      - "It was trained on simulated data only"
    answer: "Training rewards likely text; nothing checks facts"
    evidence: |
      Pretraining makes likely text likely, true or not. That is why every number and unit from
      an LLM has to be checked against a measurement, a handbook or a calculation.
    source:
      file: lectures/l17/notes.md
      heading: "Fluent is not the same as true"
      quote: |
        **Why:** pretraining rewards the likely next token. Nothing in the loss checks a fact.
    verify: {mode: quote, needle: "Nothing in the loss checks a fact", volatility: stable}
    tags: [hallucination, practitioner]

  - id: l17-q20
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o5]
    prompt: |
      The same prompt can give a different answer, even at temperature 0. As in Lecture 1, what
      should you save?
    options:
      - "The output you used, with the model's name and the date"
      - "Only the prompt; the output can always be regenerated"
      - "The temperature setting, which fixes the output"
      - "Nothing: rerun the prompt when you need it"
    answer: "The output you used, with the model's name and the date"
    evidence: |
      Providers do not promise identical outputs for identical inputs. A result you cannot
      regenerate has to be stored, with what produced it: Lecture 1's reproducibility rule.
    source:
      file: lectures/l17/notes.md
      heading: "Limitations and trade-offs"
      quote: |
        Save the output you used, with the model's name and the date, as in
    verify: {mode: quote, needle: "Save the output you used", volatility: stable}
    tags: [reproducibility, lecture-1]
