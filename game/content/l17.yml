items:

  - id: l17-q01
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l17-o1]
    prompt: |
      "We added RAG, so the answers are grounded now."

      What does adding retrieval without a retrieval evaluation actually buy?
    options:
      - "Grounding, since the model can now only answer from documents you supplied"
      - "A system whose failures now come with a citation attached"
      - "Freshness, which is the main benefit and does not depend on evaluation"
      - "Lower cost, since retrieved chunks are cheaper than long-context prompts"
    answer: "A system whose failures now come with a citation attached"
    evidence: |
      A confident wrong answer looks identical to a confident right one. Nothing
      about a fluent, well-cited-looking answer distinguishes retrieval finding
      the right chunk from retrieval confidently finding the wrong one, unless
      you built and ran the retrieval eval. Freshness and cost are real benefits
      and neither is what the question asked. The notes go further than most
      treatments here: a RAG system without a retrieval eval is not obviously
      safer than no RAG system at all.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "failures now come with a citation attached"
    verify: {mode: quote, needle: "come with a citation attached", volatility: stable}
    tags: [rag, evaluation]

  - id: l17-q02
    kind: predict_measure
    rung: 2
    difficulty: 3
    objectives: [l17-o1]
    prompt: |
      Context windows now reach hundreds of thousands of tokens. Why not paste
      the whole corpus into every prompt instead of chunking and retrieving?

      Cost is one answer. Before you look: what is the other one?
    predict:
      ask: "Write down a second reason before revealing."
      common_prior: "There isn't one. If it fits and you can afford it, long context is simply better."
    options:
      - "Latency, since a long prompt takes proportionally longer to process before the first token"
      - "Models do not read a long context uniformly: accuracy on a fact is worse when it sits in the middle"
      - "Truncation, since providers silently drop the oldest tokens once the window is exceeded"
      - "The attention mechanism degrades quadratically, so quality falls smoothly with length"
    answer: "Models do not read a long context uniformly: accuracy on a fact is worse when it sits in the middle"
    evidence: |
      Liu and colleagues' 2023 "Lost in the Middle" found accuracy on a fact
      embedded in a long context is reliably higher near the beginning or end and
      measurably worse in the middle, regardless of how relevant the fact is. So
      a shorter, retrieval-curated context is not just cheaper, it can be more
      reliable. Note that latency is a real cost and the wrong answer here: L15
      measured input length as nearly free in wall-clock terms, and it is output
      length that moves the clock.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "Lost in the Middle"
    verify: {mode: quote, needle: "Lost in the Middle", volatility: stable}
    tags: [rag, long-context]

  - id: l17-q03
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l17-o2]
    prompt: |
      Your retrieval quality has quietly degraded. The index was built with one
      embedding model; a recent change re-embeds queries with a different one.
      Nothing in the logs shows an error.

      Why not, and what is the fix?
    options:
      - "The vector store validates dimensions, so a mismatch is caught only if the dimensions differ; pad the shorter vectors"
      - "The query is placed in the wrong space and nothing raises; pin the model in the index metadata"
      - "The scores are renormalised per query, which hides the change; disable normalisation to surface it"
      - "The index needs rebuilding on every deploy, and the staleness is what degraded retrieval"
    answer: "The query is placed in the wrong space and nothing raises; pin the model in the index metadata"
    evidence: |
      This is the same silent-conversion shape as the dtype trap in L11 and the
      unit mismatch in L7: a value crosses an interface, is interpreted in the
      wrong frame, and every downstream diagnostic reports something plausible.
      The discipline is the same too, pin the model the way you pin a seed or a
      library version, and record it next to the artifact it produced.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "model than the one used to build the index does not raise an error"
    verify: {mode: quote, needle: "does not raise an error", volatility: stable}
    tags: [rag, embeddings, silent-failure]

  - id: l17-q04
    kind: locus_of_control
    rung: 3
    difficulty: 3
    objectives: [l17-o2]
    prompt: |
      A fact your users need was split across two chunks at ingestion time, so no
      single chunk contains it. Retrieval never returns a chunk that answers the
      question.

      Where does the fix belong?
    options:
      - "In the retriever: a cross-encoder re-ranker will surface both halves and the model can combine them"
      - "In chunking, at ingestion; re-ranking cannot recover a split fact"
      - "In the generation prompt: instruct the model to combine partial evidence across retrieved chunks"
      - "In k: retrieve more chunks so both halves are likely to appear in the context together"
    answer: "In chunking, at ingestion; re-ranking cannot recover a split fact"
    evidence: |
      Chunking is a lossy transformation you cannot fully undo downstream, so
      money spent getting it right the first time buys more than the same money
      spent on a fancier retriever afterward. Raising k and re-ranking are both
      real techniques and both operate on what chunking already produced. This is
      the retrieval version of a rule this course keeps repeating: fix it at the
      boundary where the information is still intact.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "Chunking is a lossy transformation you cannot fully undo downstream"
    verify: {mode: quote, needle: "lossy transformation you cannot fully undo", volatility: stable}
    tags: [rag, chunking]

  - id: l17-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      When is adding hybrid retrieval or a cross-encoder re-ranker not worth it?
    options:
      - "When the corpus is large, since two indexes do not scale to millions of documents"
      - "When plain dense retrieval already hits recall@k near 1.0, since there is nothing left to improve"
      - "When queries are short, since re-rankers need long queries to score against"
      - "When the embedding model is recent, since modern embeddings subsume what BM25 contributes"
    answer: "When plain dense retrieval already hits recall@k near 1.0, since there is nothing left to improve"
    evidence: |
      Hybrid and re-ranking are a real gain for real operational cost: two
      indexes to maintain, more latency, and more to keep synchronised when the
      corpus updates. The instruction is to measure the recall and nDCG gain
      against your own gold set before adding either. A corpus small and clean
      enough that dense retrieval already finds everything has nothing left for a
      re-ranker to improve, and you would be paying the cost for none of the gain.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "has nothing left for a re-ranker to improve"
    verify: {mode: quote, needle: "nothing left for a re-ranker to improve", volatility: stable}
    tags: [rag, retrieval, cost]

  - id: l17-q06
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l17-o3]
    prompt: |
      A retrieved chunk comes back with a similarity of 0.83. What does that
      number license you to conclude?
    options:
      - "That the chunk is relevant with roughly 83% confidence, which is a usable threshold"
      - "That it is topically close, and nothing about whether it answers the question or even agrees with it"
      - "That it is the best match available, since scores are normalised across the corpus"
      - "That the answer can be generated from it, provided the score exceeds your tuned cutoff"
    answer: "That it is topically close, and nothing about whether it answers the question or even agrees with it"
    evidence: |
      Treat a similarity score as a measure of topical closeness, never as a
      confidence score. L15 measured the sharp version of this: a fault report
      and its refutation score 0.694 while two descriptions of the same event
      score 0.532, so "about the same thing" and "says the same thing" are
      different questions and cosine answers only the first. A tuned cutoff
      inherits that problem rather than solving it.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "never as a confidence score"
    verify: {mode: quote, needle: "never as a confidence score", volatility: stable}
    tags: [rag, similarity]

  - id: l17-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      In what order should a RAG system be evaluated?
    options:
      - "Judge the generated answers first, since that is what users experience, then trace failures back to retrieval"
      - "Build the retrieval gold set and measure recall@k before ever judging a generated answer"
      - "Both at once, since retrieval and generation failures are indistinguishable from the outside"
      - "Neither in isolation; only end-to-end task success is meaningful for a retrieval system"
    answer: "Build the retrieval gold set and measure recall@k before ever judging a generated answer"
    evidence: |
      If the right chunk was never retrieved, no amount of prompt work at the
      generation step can fix the answer, and judging the answer tells you the
      system failed without telling you where. Measuring retrieval separately
      partitions the failure: either the chunk was not there, or it was there and
      the model did not use it, and those have entirely different fixes.
    source:
      file: lectures/l17/notes.md
      heading: "Where this pushes back"
      quote: "before you ever judge a generated answer"
    verify: {mode: quote, needle: "before you ever judge a generated answer", volatility: stable}
    tags: [rag, evaluation]

  - id: l17-q08
    kind: mechanism_recall
    rung: 5
    difficulty: 3
    objectives: [l17-o2]
    prompt: |
      Close the notes. Write out the stages of a RAG pipeline in order, from raw
      documents to a grounded answer, and name one design decision at each stage.
      Stop when you stall, and note where.
    checklist:
      - text: "Ingest and chunk the documents"
        needle: "chunk"
      - text: "Embed the chunks and build an index"
        needle: "index"
      - text: "Embed the query and retrieve the top k"
        needle: "retriev"
      - text: "Optionally re-rank the candidates"
        needle: "rank"
      - text: "Ground the generation in the retrieved context, with an instruction to refuse if it is not there"
        needle: "Grounding"
    answer: null
    evidence: |
      The stage people compress is the first, and it is the one that cannot be
      repaired later: chunking is lossy and no re-ranker recovers a fact split
      across two chunks. The stage people omit entirely is the refusal
      instruction at generation, which is L15's NOT FOUND escape hatch arriving
      in a new setting. Where you stalled is your reading assignment.
    source:
      file: lectures/l17/notes.md
      heading: "The anatomy of a RAG pipeline"
      quote: "chunk"
    verify:
      mode: manual
      needle: "chunk"
      volatility: stable
      exempt_reason: >-
        Free-text recall; each checklist entry is verified against the source
        individually rather than the answer being matched as a whole.
    tags: [rag, self-test]

  - id: l17-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o2]
    prompt: |
      What does BM25 contribute that dense retrieval does not?
    options:
      - "Semantic matching across paraphrase, which embeddings approximate less reliably"
      - "Exact lexical matching, which is what rescues a query containing a part number or an error code"
      - "A calibrated probability of relevance, which dense scores lack"
      - "Language independence, since term statistics do not depend on a trained model"
    answer: "Exact lexical matching, which is what rescues a query containing a part number or an error code"
    evidence: |
      The two fail in complementary directions, which is the whole argument for
      hybrid retrieval. Dense retrieval finds the maintenance entry that shares
      no words with the query, which L15 measured; BM25 finds the chunk
      containing `P/N 4L-2200-XG` exactly, which an embedding may fragment beyond
      recognition. Neither dominates, and which one you need depends on whether
      your users search by meaning or by identifier.
    source:
      file: lectures/l17/notes.md
      heading: "Retrieval mechanics: dense, keyword, and hybrid"
      quote: "**BM25**"
    verify: {mode: quote, needle: "BM25", volatility: stable}
    tags: [rag, retrieval]

  - id: l17-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      Open [`l17-rag.ipynb`](../lectures/l17/l17-rag.ipynb) and run the retrieval
      evaluation against the gold set.

      What is recall@k measuring, and why is it computed before any answer is
      judged?
    options:
      - "The fraction of generated answers that cite a real source, which is the grounding rate"
      - "The fraction of questions whose correct chunk appears in the top k"
      - "The average similarity of the top k chunks, which indicates whether the index is well built"
      - "The fraction of retrieved chunks that are relevant, which is precision at the retrieval stage"
    answer: "The fraction of questions whose correct chunk appears in the top k"
    evidence: |
      It is a ceiling. If the right chunk is not in the top k, the generator
      cannot produce a grounded correct answer no matter how good the prompt is,
      so recall@k tells you the best your system could do before you spend any
      effort on generation. Note the last option describes precision, which is a
      different and also useful number, and confusing the two is the commonest
      error in reading a retrieval eval.
    source:
      file: lectures/l17/notes.md
      heading: "Evaluating retrieval, separately from evaluating the answer"
      quote: "**Recall@k** asks"
    verify: {mode: quote, needle: "recall@k", volatility: stable}
    tags: [rag, evaluation, notebook]
