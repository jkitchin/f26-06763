  # --- o1: a generative model of text -------------------------------------------------------

  - id: l17-q01
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l17-o1]
    prompt: |
      Lecture 16's generative models drew a whole point (x, y) at once. How does an LLM draw a
      text?
    options:
      - "One token at a time, each given the tokens before it"
      - "Every token at once, like one sample from a Gaussian mixture"
      - "Word by word, with each word drawn independently"
      - "As one whole sentence, picked from a list of candidates"
    answer: "One token at a time, each given the tokens before it"
    evidence: |
      A 10-token text already has about 10^47 possible values, far too many to draw at once.
      One token at a time, each step is one choice among 50,257, and the chain rule makes the
      result exact.
    source:
      file: lectures/l17/notes.md
      heading: "One variable at a time"
      quote: |
        One token at a time, each step is one choice among 50,257.
    verify: {mode: quote, needle: "one choice among 50,257", volatility: stable}
    tags: [generative-model, lecture-16]

  - id: l17-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o1]
    prompt: |
      Why is a model that only predicts the next token a complete model of text?
    options:
      - "The chain rule makes p(text) a product of next-token probabilities"
      - "Each token depends only on the token right before it"
      - "It approximates p(text), and the error shrinks as models get bigger"
      - "Texts are short, so little is lost by going one token at a time"
    answer: "The chain rule makes p(text) a product of next-token probabilities"
    evidence: |
      p(x_1, ..., x_T) = product over t of p(x_t | all earlier tokens). This is exact, with no
      assumption about which earlier tokens matter. Learn the next-token probabilities and you
      have the whole distribution.
    source:
      file: lectures/l17/notes.md
      heading: "The chain rule"
      quote: |
        The chain rule of probability writes the probability of a text as a product of next-token
          probabilities, with no approximation:
    verify: {mode: quote, needle: "with no approximation", volatility: stable}
    tags: [chain-rule]

  - id: l17-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o1]
    prompt: |
      An LLM writing an answer works like Lecture 8's recursive AR forecast. Which weakness do
      they share?
    options:
      - "Each output is fed back in, so an early error carries forward"
      - "Both can only use a fixed window of the last 10 values"
      - "Both are linear models, so they cannot capture curved trends in data"
      - "Both must be trained on labels written by people"
    answer: "Each output is fed back in, so an early error carries forward"
    evidence: |
      Both use their own predictions as later inputs. In Lecture 8 the forecast was worse than
      the mean after two hours; in an LLM, one wrong token early on steers the rest of the answer.
    source:
      file: lectures/l17/notes.md
      heading: "Autoregressive, as in Lecture 8"
      quote: |
        **The same weakness:** both feed their own outputs back in, so an early mistake becomes an input
          for every later step.
    verify: {mode: quote, needle: "an early mistake becomes an input", volatility: stable}
    tags: [autoregressive, lecture-8]

  # --- o2: tokens and the context window ----------------------------------------------------

  - id: l17-q04
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o2]
    prompt: |
      Byte-pair encoding builds a vocabulary by repeating one step. Which?
    options:
      - "Merge the most frequent pair of neighboring tokens"
      - "Split the longest token in the vocabulary into two shorter ones"
      - "Add every whole word that appears at least twice in the text"
      - "Drop the rarest characters from the vocabulary"
    answer: "Merge the most frequent pair of neighboring tokens"
    evidence: |
      Start from characters, count every adjacent pair, merge the most frequent one into a new
      token, repeat. In "aaabdaaabac" the first merge is a + a, which appears 4 times.
    source:
      file: lectures/l17/notes.md
      heading: "Byte-pair encoding"
      quote: |
        merge it into one new token, repeat
    verify: {mode: quote, needle: "merge it into one new token", volatility: stable}
    tags: [byte-pair-encoding]

  - id: l17-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o2]
    prompt: |
      Why do LLMs cut text into subwords rather than whole words?
    options:
      - "A new word, like the pump tag P-101A, can still be built from pieces"
      - "Attention can compare only pieces of words, never whole words at once"
      - "Whole words would make every text many more tokens long"
      - "Subwords make every word exactly two tokens, so costs are fixed"
    answer: "A new word, like the pump tag P-101A, can still be built from pieces"
    evidence: |
      A word vocabulary has no token for a word it never saw. With subwords, common words stay
      whole and rare ones split ("overhe" + "ated"), so any text can be written. Whole words give
      fewer tokens, not more.
    source:
      file: lectures/l17/notes.md
      heading: "Three ways to cut a text"
      quote: |
        so any new word can still be built
    verify: {mode: quote, needle: "any new word can still be built", volatility: stable}
    tags: [tokens, subwords]

  - id: l17-q06
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l17-o2]
    prompt: |
      The tokenizer cuts "4140" into "414" and "0". What should you do with unit conversions?
    options:
      - "Do them in code: the model sees text pieces, not a quantity"
      - "Write numbers in scientific notation so each stays one token"
      - "Raise the temperature so the model explores more digits"
      - "Nothing: the model rebuilds the number before computing"
    answer: "Do them in code: the model sees text pieces, not a quantity"
    evidence: |
      The model predicts digits as tokens; it does not calculate. Scientific notation splits into
      even more pieces: "Q = 1.5e-3 m³/s" is 15 characters and 12 tokens.
    source:
      file: lectures/l17/notes.md
      heading: "Numbers and units cost more than words"
      quote: |
        **So numbers, units and part numbers are where LLMs slip.** Check them, and do the arithmetic
          in code.
    verify: {mode: quote, needle: "do the arithmetic", volatility: stable}
    tags: [tokens, numbers, practitioner]

  - id: l17-q07
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o2]
    prompt: |
      You paste a manual longer than the model's context window. What happens to the part past
      the window?
    options:
      - "The model never sees it"
      - "It is read, but with lower attention weights"
      - "It is summarized automatically before answering"
      - "It is stored and read on your next question"
    answer: "The model never sees it"
    evidence: |
      The context window is the most tokens the model can take in at once. Text beyond it is not
      part of the input, so long documents must be cut, summarized or searched first.
    source:
      file: lectures/l17/notes.md
      heading: "The context window"
      quote: |
        Text beyond the window is not seen at all. Long documents must be cut, summarized or searched.
    verify: {mode: quote, needle: "not seen at all", volatility: stable}
    tags: [context-window]

  # --- o3: pretraining on the transformer with a causal mask --------------------------------

  - id: l17-q08
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o3]
    prompt: |
      An LLM uses Lecture 12's transformer with one change. Which?
    options:
      - "A causal mask: each token sees only itself and earlier tokens"
      - "No attention at all: each token goes through the MLP on its own"
      - "Each token attends only to the single token right before it"
      - "The tokens are read from right to left, so the answer comes first"
    answer: "A causal mask: each token sees only itself and earlier tokens"
    evidence: |
      The mask sets the scores of later tokens to minus infinity, so their weights are 0. The
      prediction at position t uses only tokens 1 to t, and in training the answer stays hidden.
    source:
      file: lectures/l17/notes.md
      heading: "Attention looks back"
      quote: |
        One change from Lecture 12: a token may attend only to itself and the tokens before it.
    verify: {mode: quote, needle: "only to itself and the tokens before it", volatility: stable}
    tags: [causal-mask, attention, lecture-12]

  - id: l17-q09
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l17-o3]
    prompt: |
      Pretraining uses trillions of tokens that nobody labeled. Where do the targets come from?
    options:
      - "The text itself, shifted by one token"
      - "People who label a small sample of it"
      - "A smaller model that labels it first"
      - "The tokenizer, which marks tokens right or wrong"
    answer: "The text itself, shifted by one token"
    evidence: |
      The target at every position is the token that actually came next. That is why any text
      can be used, without anyone labeling it.
    source:
      file: lectures/l17/notes.md
      heading: "Every position at once"
      quote: |
        **Self-supervised:** the labels are the text itself, shifted by one.
    verify: {mode: quote, needle: "shifted by one", volatility: stable}
    tags: [self-supervised, pretraining]

  - id: l17-q10
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      The pretraining loss is the cross-entropy of Lecture 10. At each position, what is being
      classified?
    options:
      - "The next token, among all tokens in the vocabulary"
      - "Whether the sentence so far is true or false"
      - "The topic of the document the text came from"
      - "Whether the token is a whole word or a piece of one"
    answer: "The next token, among all tokens in the vocabulary"
    evidence: |
      Each position is a classification with one class per token: 50,257 classes for GPT-2, 129
      for our tiny GPT. The loss is minus the log of the probability given to the true class.
    source:
      file: lectures/l17/notes.md
      heading: "The objective"
      quote: |
        **Cross-entropy:** each position is a classification over the vocabulary
    verify: {mode: quote, needle: "classification over the vocabulary", volatility: stable}
    tags: [cross-entropy, lecture-10]

  - id: l17-q11
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      Our tiny GPT has 842,881 parameters, 58 ms per training step, and gradients from
      backpropagation (Lecture 11). Where does it sit on Lecture 15's optimizer map?
    options:
      - "Gradient-based: many inputs, cheap steps, gradients available"
      - "Bayesian optimization: few inputs, expensive experiments"
      - "A grid search over every parameter, one at a time"
      - "Derivative-free search, since a noisy loss makes gradients useless"
    answer: "Gradient-based: many inputs, cheap steps, gradients available"
    evidence: |
      Lecture 15's reactor had 2 knobs and hours per experiment: Bayesian optimization. Hundreds
      of thousands of parameters with cheap gradients is gradient territory; GPT-3 used Adam,
      Llama 3 AdamW.
    source:
      file: lectures/l17/notes.md
      heading: "Training is an optimization problem"
      quote: |
        The tiny GPT
        (red star) has 842,881 knobs and 58 ms per training step, with gradients: gradient descent.
    verify: {mode: quote, needle: "with gradients: gradient descent", volatility: stable}
    tags: [optimization, lecture-15, lecture-11]

  - id: l17-q12
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l17-o3]
    prompt: |
      The tiny GPT ends with a training loss of 1.22 and a held-out loss of 1.51. What does the
      gap tell you?
    options:
      - "It has started to memorize its training text: overfitting"
      - "It is undertrained, and more steps will close the gap"
      - "The held-out notes use characters the model never saw in training"
      - "The learning rate is too low to reach the held-out text"
    answer: "It has started to memorize its training text: overfitting"
    evidence: |
      With 0.6 million characters, the training loss keeps falling while the held-out loss levels
      off: Lecture 9's overfitting. More steps widen the gap; the held-out curve is the one to
      trust.
    source:
      file: lectures/l17/notes.md
      heading: "Reading the loss"
      quote: |
        Its training loss (1.22) falls below its held-out loss (1.51): with 0.6 million characters,
          it starts to memorize.
    verify: {mode: quote, needle: "it starts to memorize", volatility: measured}
    tags: [held-out, overfitting, lecture-9]

  - id: l17-q13
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l17-o3]
    prompt: |
      The held-out loss is 1.51, and e^(-1.51) is about 0.22. What does 22% mean?
    options:
      - "The true next character typically gets about 22% probability"
      - "22% of the model's next-character guesses are right"
      - "The model has learned 22% of its 129-character vocabulary"
      - "Training is 22% of the way from a blind guess to a loss of zero"
    answer: "The true next character typically gets about 22% probability"
    evidence: |
      The loss is the average of -ln p, so e^(-loss) is the typical p: the geometric mean of the
      probabilities given to the true characters. It is not the share of right guesses. A blind
      guess gives 1/129, 0.8%.
    source:
      file: lectures/l17/notes.md
      heading: "Reading the loss"
      quote: |
        is not the share of right guesses: it is the geometric mean of the probabilities the
          model gave the true characters.
    verify: {mode: quote, needle: "geometric mean", volatility: measured}
    tags: [cross-entropy, loss]

  # --- o4: data and scale -------------------------------------------------------------------

  - id: l17-q14
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o4]
    prompt: |
      Trained on our notes alone, the tiny GPT finishes 15 of 16 course terms but writes no
      meaningful sentence. What would help most?
    options:
      - "Far more text, and a bigger model"
      - "Training longer on the same notes"
      - "A higher sampling temperature"
      - "A longer context window"
    answer: "Far more text, and a bigger model"
    evidence: |
      It already copies our style. Meaning takes far more data and parameters; training longer on
      0.6 million characters only memorizes them, as the held-out loss shows.
    source:
      file: lectures/l17/notes.md
      heading: "What it writes as it learns"
      quote: |
        Far more text, and a
          bigger model, are what turn style into meaning.
    verify: {mode: quote, needle: "turn style into meaning", volatility: stable}
    tags: [scaling, tiny-gpt]

  - id: l17-q15
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o4]
    prompt: |
      DeepSeek-V3 has 671 billion parameters, 37 billion of them active. What does "active" mean?
    options:
      - "Only part of the parameters is used for each token"
      - "Only 37 billion were trained; the rest are left random"
      - "The rest are kept for languages other than English"
      - "The rest switch on only at a high temperature"
    answer: "Only part of the parameters is used for each token"
    evidence: |
      DeepSeek-V3 is a mixture of experts: for each token, only some of its expert sub-networks
      run. All 671 billion parameters are trained; 37 billion do the work on any one token, which
      keeps each step cheaper.
    source:
      file: lectures/l17/notes.md
      heading: "Models over the years"
      quote: |
        they use only part of their parameters for each
          token
    verify: {mode: quote, needle: "only part of their parameters", volatility: stable}
    tags: [mixture-of-experts, scaling]

  - id: l17-q16
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o4]
    prompt: |
      Asked a question, a pretrained model continues the text instead of answering. What turns it
      into a chat model?
    options:
      - "More training on good answers, then on people's preferences"
      - "More pretraining on web text, until it learns to answer on its own"
      - "A larger context window, so it sees the whole question"
      - "A lower temperature, so it picks the most likely answer"
    answer: "More training on good answers, then on people's preferences"
    evidence: |
      Supervised fine-tuning (SFT) trains on examples of good answers; RLHF or DPO then trains on
      which of two answers people prefer. More pretraining only makes it better at continuing
      text.
    source:
      file: lectures/l17/notes.md
      heading: "After pretraining"
      quote: |
        **Supervised fine-tuning** (SFT) trains it further, with the same next-token loss, on examples
           of instructions and good answers, written by people.
    verify: {mode: quote, needle: "instructions and good answers", volatility: stable}
    tags: [post-training, sft, rlhf]

  # --- o5: temperature and hallucination ----------------------------------------------------

  - id: l17-q17
    kind: direction
    rung: 2
    difficulty: 1
    objectives: [l17-o5]
    prompt: |
      You lower the temperature from 1 to 0.3. What happens to the next-token probabilities?
    options:
      - "The top token takes more of them: safer, more repetitive text"
      - "They flatten, so unlikely tokens get a real chance"
      - "They stay the same; only the speed of generation changes a little"
      - "Only the most common words in the vocabulary remain"
    answer: "The top token takes more of them: safer, more repetitive text"
    evidence: |
      The logits are divided by the temperature before the softmax. Dividing by 0.3 stretches the
      gaps, so the most likely token takes more of the probability.
    source:
      file: lectures/l17/notes.md
      heading: "Sampling: temperature"
      quote: |
        Below 1, it sharpens the
          distribution toward the most likely token; above 1, it flattens it.
    verify: {mode: quote, needle: "sharpens the", volatility: stable}
    tags: [temperature]

  - id: l17-q18
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o5]
    prompt: |
      The softmax with a temperature is Boltzmann's distribution. In that parallel, what does a
      token's logit play?
    options:
      - "Minus the energy of a state"
      - "The temperature k_BT of the system"
      - "The number of states the system can visit"
      - "The entropy of the system"
    answer: "Minus the energy of a state"
    evidence: |
      exp(z/τ) matches exp(-E/k_BT): a high logit is a low energy, and τ plays k_BT. Cold, the
      lowest-energy state (the top token) wins; hot, every state gets visited.
    source:
      file: lectures/l17/notes.md
      heading: "Spin the wheel"
      quote: |
        A logit $z$ plays minus an energy, and $\tau$ plays $k_BT$.
    verify: {mode: quote, needle: "plays minus an energy", volatility: stable}
    tags: [temperature, boltzmann]

  - id: l17-q19
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l17-o5]
    prompt: |
      Why can an LLM state a wrong number as fluently as a right one?
    options:
      - "Its loss rewards the likely next token; nothing checks facts"
      - "Numbers split into tokens, and it cannot read the tokens back"
      - "A low temperature forces it to guess when unsure"
      - "It was trained on simulations, not on measurements"
    answer: "Its loss rewards the likely next token; nothing checks facts"
    evidence: |
      Pretraining makes likely text likely, true or not. After "…100 degrees", Qwen gave
      "Fahrenheit" 58.6% for water's boiling point and took it. Check every number and unit.
    source:
      file: lectures/l17/notes.md
      heading: "Fluent is not the same as true"
      quote: |
        **Why:** pretraining rewards the likely next token. Nothing in the loss checks a fact.
    verify: {mode: quote, needle: "Nothing in the loss checks a fact", volatility: stable}
    tags: [hallucination, practitioner]

  - id: l17-q20
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l17-o5]
    prompt: |
      The same prompt can give a different answer, even at temperature 0. As in Lecture 1, what
      should you save?
