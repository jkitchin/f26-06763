  # --- o1: what BO is, why it is called Bayesian, and when it beats other optimizers ----------

  - id: l15-q01
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l15-o1]
    prompt: |
      What makes the reactor's yield a black-box objective?
    options:
      - "You can only evaluate it: set the inputs, run it, read one noisy number"
      - "It comes from a neural network whose weights nobody can inspect or interpret"
      - "Its formula is known, but it is too long to differentiate by hand in the lab"
      - "It returns several outputs at once, so no single one of them can be optimized"
    answer: "You can only evaluate it: set the inputs, run it, read one noisy number"
    evidence: |
      In the lab there is no formula and no gradient. You choose a temperature, run the
      experiment for hours, and get one measured yield back, with noise. The kinetics formula in
      the notes only plays the role of the lab.
    source:
      file: lectures/l15/notes.md
      heading: "Why the budget matters"
      quote: |
        A **black-box objective** is a function you can only evaluate: set the inputs, run the
        experiment or simulation, read one (noisy) number. No formula, no gradient.
    verify: {mode: quote, needle: "a function you can only evaluate", volatility: stable}
    tags: [black-box, definition]

  - id: l15-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o1]
    prompt: |
      Why is it called *Bayesian* optimization?
    options:
      - "It updates a belief about the unknown curve with every experiment, and decides on that belief"
      - "It applies Bayes' rule to estimate the gradient of the yield from noisy finite differences"
      - "Its objective has to be a probability, such as a yield, so the method is named after Bayes"
      - "Thomas Bayes first used it to choose experiments, and the name stayed with the method"
    answer: "It updates a belief about the unknown curve with every experiment, and decides on that belief"
    evidence: |
      The unknown is the whole function. A GP prior over it is updated by each experiment into a
      posterior, and the next experiment is chosen on that posterior. Bayesian statistics for the
      belief, plus a decision on it.
    source:
      file: lectures/l15/notes.md
      heading: "Why it is called Bayesian"
      quote: |
        **Then the decision is taken on the posterior:** where to experiment next, given what we now
          believe.
    verify: {mode: quote, needle: "decision is taken on the posterior", volatility: stable}
    tags: [bayesian, posterior]

  - id: l15-q03
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l15-o1]
    prompt: |
      You are fitting thousands of weights in a model whose loss and gradient take a millisecond to
      compute. A colleague suggests Bayesian optimization. What do you answer?
    options:
      - "Use a gradient-based method: evaluations are cheap, gradients exist, and there are too many inputs"
      - "Use BO: it searches globally, so it is always safer than a local gradient-based method"
      - "Use BO with a batch acquisition, so that it can run thousands of evaluations at once"
      - "Use random search: with that many weights, no surrogate model of the loss can help"
    answer: "Use a gradient-based method: evaluations are cheap, gradients exist, and there are too many inputs"
    evidence: |
      BO pays off when an evaluation is expensive, noisy and without gradients, with a budget of
      tens and up to about 20 inputs. Cheap evaluations with gradients and many variables are
      what gradient-based methods are built for.
    source:
      file: lectures/l15/notes.md
      heading: "Bayesian optimization against gradient-based optimization"
      quote: |
        **Gradient-based** (Newton, L-BFGS, IPOPT): cheap evaluations, smooth functions, gradients
          available (from a model, by automatic differentiation or adjoints), and many variables, up to
          millions. It finds a local optimum fast.
    verify: {mode: quote, needle: "cheap evaluations, smooth functions", volatility: stable}
    tags: [gradient-based, when-to-use, practitioner]

  - id: l15-q04
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l15-o1]
    prompt: |
      On the two-knob reactor, starting from the cold side, L-BFGS-B with finite-difference
      gradients often stopped where it started. Why?
    options:
      - "Each gradient costs experiments, and the noise swamps the small differences on the flat cold side"
      - "The yield surface has many local optima, and L-BFGS-B was trapped in the nearest of them"
      - "L-BFGS-B needs exact second derivatives, which a noisy experiment can never provide"
      - "The temperature bounds stopped every step before it could get near the optimum"
    answer: "Each gradient costs experiments, and the noise swamps the small differences on the flat cold side"
    evidence: |
      A finite difference compares two noisy measurements. Where the true change is tiny, as on
      the cold plateau, the difference is mostly noise, so the gradient points nowhere useful.
      The surface has one optimum; the problem is the noise, not local optima.
    source:
      file: lectures/l15/notes.md
      heading: "Bayesian optimization against gradient-based optimization"
      quote: |
        estimates gradients by nudging each input. Each gradient
          costs experiments, and the measurement noise swamps the small differences in the flat, cold
          region. It often stops where it started.
    verify: {mode: quote, needle: "measurement noise swamps the small differences", volatility: stable}
    tags: [gradient-based, finite-differences, noise]

  # --- o2: the loop, and exploration against exploitation ------------------------------------

  - id: l15-q05
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l15-o2]
    prompt: |
      Which is one pass of the Bayesian optimization loop?
    options:
      - "Fit the GP to all data, maximize the acquisition, run that experiment, add it to the data"
      - "Maximize the acquisition, fit the GP to the newest point only, run it, discard the older data"
      - "Run a batch of random experiments, fit the GP once, and report the maximum of its mean"
      - "Fit the GP, run the experiment where its mean is highest, then refit the acquisition function"
    answer: "Fit the GP to all data, maximize the acquisition, run that experiment, add it to the data"
    evidence: |
      Fit, score, run, add. The GP is refitted to every experiment so far on each pass, and the
      next experiment is the maximizer of the acquisition function, not of the GP mean alone.
    source:
      file: lectures/l15/notes.md
      heading: "The Bayesian optimization loop"
      quote: |
        1. **Fit** the GP to every experiment so far.
        2. **Score** every candidate with the acquisition function.
        3. **Run** the experiment where the score is largest.
        4. **Add** the result to the data, and repeat until the budget is spent.
    verify: {mode: quote, needle: "repeat until the budget is spent", volatility: stable}
    tags: [loop]

  - id: l15-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o2]
    prompt: |
      On the reactor, BO climbed from the cold side toward 80 °C, then experiment 8 jumped to
      140 °C. What was that jump?
    options:
      - "Exploration: the GP was still unsure there, so expected improvement there was not zero"
      - "Exploitation: the GP mean predicted its highest yield of all at the hot end"
      - "A bug: expected improvement should never pick a point on the edge of the bounds"
      - "Chance: optimize_acqf returned one of its random candidates instead of the best"
    answer: "Exploration: the GP was still unsure there, so expected improvement there was not zero"
    evidence: |
      The band was still wide at the hot end, so expected improvement there was not zero. That
      experiment cost one run and collapsed the band; BO never went back there and settled at
      80 °C.
    source:
      file: lectures/l15/notes.md
      heading: "The loop on the reactor"
      quote: |
        Experiment 8 jumped to 140 °C: the GP was still unsure there, so the expected improvement there
          was not zero.
    verify: {mode: quote, needle: "the GP was still unsure there", volatility: measured}
    tags: [exploration, reactor]

  - id: l15-q07
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o2]
    prompt: |
      What goes wrong with pure exploitation?
    options:
      - "It keeps sampling next to the best point so far, and can sit on a local optimum forever"
      - "It samples wherever the band is widest, and spends the whole budget learning the curve"
      - "It needs the gradient of the objective, which a laboratory experiment cannot provide"
      - "It can only use the GP's standard deviation, and has to ignore the mean altogether"
    answer: "It keeps sampling next to the best point so far, and can sit on a local optimum forever"
    evidence: |
      Exploitation goes where the mean is high, which is next to the incumbent. It never looks
      elsewhere, so it cannot find a better region. Sampling where the band is widest is the
      other extreme, pure exploration.
    source:
      file: lectures/l15/notes.md
      heading: "Exploration and exploitation"
      quote: |
        **Pure exploitation** keeps sampling next to the best point so far. It can sit on a local
          optimum forever, because it never looks elsewhere.
    verify: {mode: quote, needle: "sit on a local", volatility: stable}
    tags: [exploitation, local-optimum]

  # --- o3: the acquisition functions -----------------------------------------------------------

  - id: l15-q08
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l15-o3, l15-o2]
    prompt: |
      You raise κ in the upper confidence bound μ(x) + κσ(x). What changes in where it samples?
    options:
      - "It weights uncertainty more, so it samples more where the GP is unsure: it explores"
      - "It weights the mean more, so it samples closer to the best point so far: it exploits"
      - "Nothing changes, because κ only rescales the acquisition and not its maximizer"
      - "It samples where the measurement noise is lowest, because κ divides the noise"
    answer: "It weights uncertainty more, so it samples more where the GP is unsure: it explores"
    evidence: |
      κ multiplies σ. With κ = 0, UCB is the GP mean and exploits; as κ grows, uncertain regions
      outscore regions with a high mean. On the reactor, κ = 2 picked the furthest point into
      the unknown of the four acquisitions.
    source:
      file: lectures/l15/notes.md
      heading: "Upper and lower confidence bounds (UCB, LCB)"
      quote: |
        $\kappa$ is the knob. $\kappa = 0$: the mean only, pure exploitation. Large $\kappa$: the band
          wins, exploration.
    verify: {mode: quote, needle: "is the knob", volatility: stable}
    tags: [upper-confidence-bound, exploration]

  - id: l15-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o3]
    prompt: |
      Expected improvement is EI = (μ − f*)Φ(z) + σφ(z). Which part rewards exploration?
    options:
      - "The second term, σφ(z): it grows where the GP is uncertain"
      - "The first term, (μ − f*)Φ(z): it grows where the GP mean is high above the incumbent"
      - "Neither term: EI only exploits, which is the reason UCB was invented afterwards"
      - "Both terms equally: splitting EI into two terms is only algebra, with no meaning"
    answer: "The second term, σφ(z): it grows where the GP is uncertain"
    evidence: |
      The first term is large where the mean beats the incumbent, which is exploitation. The
      second is large where σ is large, which is exploration. EI carries both in one number.
    source:
      file: lectures/l15/notes.md
      heading: "Expected improvement (EI)"
      quote: |
        The first term grows where the mean is high, the second where the uncertainty is high.
    verify: {mode: quote, needle: "the second where the uncertainty is high", volatility: stable}
    tags: [expected-improvement, exploration]

  - id: l15-q10
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l15-o3]
    prompt: |
      With ξ = 0, probability of improvement keeps picking points just above the best so far.
      Why?
    options:
      - "It scores only the chance of beating the best, not by how much"
      - "It uses the GP's standard deviation but ignores the GP's mean completely"
      - "It is computed by sampling, so its value is too noisy near the incumbent"
      - "Its margin ξ is negative by default, which pulls it toward the incumbent"
    answer: "It scores only the chance of beating the best, not by how much"
    evidence: |
      A point just next to the incumbent beats it with high probability, by a tiny amount. PI
      cannot tell that from a likely large gain, so it exploits. EI fixes this by weighting each
      improvement by its size.
    source:
      file: lectures/l15/notes.md
      heading: "Probability of improvement (PI)"
      quote: |
        Con: it ignores **how much** better. With $\xi = 0$ it picks a point just above the incumbent,
          with a high chance of a tiny gain: it exploits.
    verify: {mode: quote, needle: "a point just above the incumbent", volatility: stable}
    tags: [probability-of-improvement, exploitation]

  - id: l15-q11
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o3]
    prompt: |
      Without measurement noise, what is expected improvement at a temperature you already ran?
    options:
      - "Zero: no uncertainty there, and no improvement to expect"
      - "Its maximum, because the GP is most confident at a measured point"
      - "The measured yield itself, because the GP passes through the data"
      - "A negative number, which is how the loop avoids repeating experiments"
    answer: "Zero: no uncertainty there, and no improvement to expect"
    evidence: |
      At a measured point σ = 0 and μ is the measured value, at most the incumbent. The
      improvement is then zero for sure, so its expected value is zero. EI grows away from the
      data.
    source:
      file: lectures/l15/notes.md
      heading: "Expected improvement (EI)"
      quote: |
        EI is zero at an experiment already run (no uncertainty, no improvement) and grows away from
          the data.
    verify: {mode: quote, needle: "ei is zero at an experiment already run", volatility: stable}
    tags: [expected-improvement]

  - id: l15-q12
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l15-o3, l15-o4]
    prompt: |
      Why does the worked example use LogExpectedImprovement instead of plain EI?
    options:
      - "Far from the data, EI and its gradient underflow to zero, and the search stalls"
      - "Taking the log moves the maximizer, so that the loop explores more than plain EI does"
      - "BoTorch can only minimize, so the acquisition has to be turned negative with a log"
      - "The log turns EI into a probability that sums to one over all the candidate inputs"
    answer: "Far from the data, EI and its gradient underflow to zero, and the search stalls"
    evidence: |
      A double-precision number below about 10^-324 is stored as exactly 0. Far from the data EI
      is that small, so EI and its slope are both 0 there, and the optimizer that follows the
      slope has nowhere to go. LogEI computes log EI directly, with the same maximizer.
    source:
      file: lectures/l15/notes.md
      heading: "Log expected improvement (LogEI)"
      quote: |
        **Red**: the temperatures where the computer stores EI as exactly 0 (12% of them). There EI is
          flat, so the optimizer of the acquisition, which follows its slope, has no direction to move.
    verify: {mode: quote, needle: "has no direction to move", volatility: measured}
    tags: [log-expected-improvement, numerics]

  # --- o4: BoTorch, and an honest comparison ---------------------------------------------------

  - id: l15-q14
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l15-o4]
    prompt: |
      Why does the worked example build the SingleTaskGP with Normalize and Standardize?
    options:
      - "Temperature to [0, 1], yields to mean 0 and standard deviation 1, so the kernel defaults fit"
      - "Without the two transforms the GP is only an approximation, and with them it becomes exact"
      - "The transforms remove the measurement noise from the yields before the GP is fitted"
      - "LogExpectedImprovement accepts inputs only between 0 and 1, so the transforms are required"
    answer: "Temperature to [0, 1], yields to mean 0 and standard deviation 1, so the kernel defaults fit"
    evidence: |
      The kernel's default length scale and the GP's priors assume inputs of order 1 and outputs
      of order 1. Temperature in degrees and yields near 0.4 are neither, so BoTorch rescales both
      and the defaults become sensible.
    source:
      file: lectures/l15/notes.md
      heading: "Bayesian optimization in BoTorch"
      quote: |
        `Normalize` maps the
          temperature to [0, 1]; `Standardize` gives the yields mean 0 and standard deviation 1. The
          kernel's settings are then sensible defaults.
    verify: {mode: quote, needle: "sensible defaults", volatility: stable}
    tags: [botorch, transforms]

  - id: l15-q15
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l15-o4]
    prompt: |
      The lab gives no gradients, yet optimize_acqf runs gradient-based searches inside the loop.
      Why is that fine?
    options:
      - "It searches the acquisition, a cheap formula from the GP; the experiment runs once per pass"
      - "BoTorch estimates gradients of the yield itself from the experiments it has already run"
      - "It is not fine, and it is the reason BO only works on smooth, noise-free objectives"
      - "The gradients come from the Arrhenius formula inside the run_experiment function"
    answer: "It searches the acquisition, a cheap formula from the GP; the experiment runs once per pass"
    evidence: |
      Maximizing the acquisition is an optimization over the GP, which is a formula with exact
      gradients from automatic differentiation. Only the chosen point is run in the lab.
    source:
      file: lectures/l15/notes.md
      heading: "Bayesian optimization in BoTorch"
      quote: |
        Optimizing the acquisition function is itself an optimization, but a cheap one: the GP is a
          formula, so gradient-based search works there.
    verify: {mode: quote, needle: "but a cheap one", volatility: stable}
    tags: [botorch, optimize-acqf]

  - id: l15-q16
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l15-o4]
    prompt: |
      A team runs BO once on their reactor, reaches the best yield at experiment 6, and reports
      "BO finds the optimum in 6 experiments". What is missing?
    options:
      - "Several seeds and a baseline: BO is random, and one run proves nothing"
      - "A larger budget: BO results can only be trusted after many dozens of experiments"
      - "A gradient check: the optimum must be confirmed afterwards with L-BFGS-B"
      - "Nothing: once the GP is fitted, BO is deterministic and one run is enough"
    answer: "Several seeds and a baseline: BO is random, and one run proves nothing"
    evidence: |
      The noise and the random candidates make every run different. The notes report 10 seeds,
      random search and two classic optimizers as baselines, the best-so-far curve with its
      spread, and the budget counted.
    source:
      file: lectures/l15/notes.md
      heading: "Comparing optimizers over several seeds"
      quote: |
        One run proves nothing: BO is random (the noise, the random candidates).
    verify: {mode: quote, needle: "one run proves nothing", volatility: stable}
    tags: [seeds, baseline, practitioner]

  # --- o5: extensions and applications ---------------------------------------------------------

  - id: l15-q17
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l15-o5]
    prompt: |
      The lab has four reactors that can run at the same time. Which extension of BO fits?
    options:
      - "Batch BO: choose four experiments at once, with q=4 and a batch acquisition"
      - "Multi-fidelity BO, because four reactors give four different fidelities"
      - "Constrained BO, with one feasibility constraint for each of the reactors"
      - "Four independent BO loops, one per reactor, each with its own random seed"
    answer: "Batch BO: choose four experiments at once, with q=4 and a batch acquisition"
    evidence: |
      A batch acquisition such as qLogEI scores a set of four points jointly, so the four picks
      spread out instead of piling onto the same spot. Four independent loops would each pick
      nearly the same experiment.
    source:
      file: lectures/l15/notes.md
      heading: "Extensions engineers need"
      quote: |
        **Batches:** the lab has four reactors. Choose four experiments at once (`q=4`, with a batch
          acquisition such as qLogEI).
    verify: {mode: quote, needle: "the lab has four reactors", volatility: stable}
    tags: [batch, extensions]

  - id: l15-q18
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l15-o5, l15-o1]
    prompt: |
      Which of these problems fits Bayesian optimization best?
    options:
      - "Choosing a fast-charging protocol, when each test cycles a battery for days"
      - "Training an image classifier with millions of weights and cheap exact gradients"
      - "Solving a steady-state flowsheet whose Jacobian is analytic and takes milliseconds"
      - "Sorting a table of past experiments by their measured yields, highest yield first"
    answer: "Choosing a fast-charging protocol, when each test cycles a battery for days"
    evidence: |
      Each evaluation is slow, noisy and has no gradient, and only a few dozen are affordable.
      Attia et al. (2020) combined BO with early predictions of battery life for exactly this.
      The other two problems have cheap evaluations and gradients.
    source:
      file: lectures/l15/notes.md
      heading: "Where Bayesian optimization is used"
      quote: |
        Attia et al. (2020) combined BO with early predictions of battery life, and
          ranked 224 fast-charging protocols in 16 days.
    verify: {mode: quote, needle: "early predictions of battery life", volatility: stable}
    tags: [applications, batteries, when-to-use]
