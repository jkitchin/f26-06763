  - id: l21-q01
    kind: predict_measure
    rung: 1
    difficulty: 3
    objectives: [l21-o2]
    prompt: |
      This session's demo validates a deliberately naive judge, a lexical-overlap
      heuristic, against hand labels on eight constructed cases.

      Before you look: what is Cohen's kappa?
    predict:
      ask: "Write a number between -1 and 1, and say what you expect."
      common_prior: "Something positive but mediocre, maybe 0.4. Word overlap is crude but not useless."
    options:
      - "About 0.4, mediocre but clearly better than chance, which is what a crude lexical heuristic ought to manage"
      - "About -0.11, which is agreement no better than chance"
      - "About 0.8, since the cases were constructed to be unambiguous and a heuristic should handle unambiguous cases"
      - "Undefined, because kappa needs more than eight examples to be computed"
    answer: "About -0.11, which is agreement no better than chance"
    evidence: |
      Every disagreement traces to a specific, nameable blind spot. The heuristic
      cannot tell a citation that supports the answer from one that does not,
      because it never looks at the citation; and it cannot tell "48 mm" from
      "36 mm" inside an otherwise identical sentence, because word overlap does
      not distinguish those the way a person instantly does. A real LLM judge
      would close some of those gaps and not others, and the entire point of
      running the validation is that you find out which, on your rubric, with
      your judge, rather than assuming.
    source:
      file: lectures/l21/notes.md
      heading: "LLM-as-judge, done carefully"
      quote: "kappa of about -0.11, agreement no better\nthan chance"
    verify: {mode: quote, needle: "-0.11", volatility: measured}
    tags: [evaluation, judge]

  - id: l21-q02
    kind: locus_of_control
    rung: 3
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      You validate your LLM judge against fifty hand labels and it fails: kappa
      is close to zero.

      What should you do?
    options:
      - "Skip judge validation in future; a check that fails this often is not earning its cost"
      - "Sharpen the rubric, or add a programmatic check for the dimension it is blind to"
      - "Move to a larger judge model, since capability is what a low kappa is measuring"
      - "Relabel the examples, since disagreement this severe usually means the human labels were inconsistent"
    answer: "Sharpen the rubric, or add a programmatic check for the dimension it is blind to"
    evidence: |
      Treat a judge's kappa the way you would treat a surrogate's calibration
      coverage: a number you check, not a property you assume. The fix is almost
      always a sharper rubric or an added programmatic check, not a bigger model,
      because the usual failure is that the rubric did not say what you meant
      rather than that the judge could not read it. Note what the third option
      quietly assumes: that capability, not specification, is the binding
      constraint. It usually is not.
    source:
      file: lectures/l21/notes.md
      heading: "LLM-as-judge, done carefully"
      quote: "the fix is almost always a sharper rubric or an added programmatic check for the specific dimension the judge is blind to, not a bigger model"
    verify: {mode: quote, needle: "a sharper rubric or an added programmatic check", volatility: stable}
    tags: [evaluation, judge]

  - id: l21-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      Which of these is a known systematic bias of LLM-as-judge, and what is the
      direct control for it?
    options:
      - "Recency bias; place the stronger answer second so it is freshest in context"
      - "Position bias; randomize answer order in pairwise comparisons so the effect cancels"
      - "Temperature bias; set the judge's temperature to zero so its scores stop varying"
      - "Vocabulary bias; restrict the rubric to words that appear in the answers themselves"
    answer: "Position bias; randomize answer order in pairwise comparisons so the effect cancels"
    evidence: |
      The three named biases are position, length, and self-preference. None of
      them makes LLM-as-judge useless; they make it a measurement instrument with
      known systematic errors, which is a reason to calibrate rather than to
      discard. Randomizing order cancels position bias directly, and a
      length-normalized criterion is the analogous control when longer answers
      keep winning for the wrong reason. Temperature is a real setting and not
      one of the biases.
    source:
      file: lectures/l21/notes.md
      heading: "LLM-as-judge, done carefully"
      quote: "randomize answer order in pairwise comparisons to cancel out position bias"
    verify: {mode: quote, needle: "cancel out position bias", volatility: stable}
    tags: [evaluation, judge, bias]

  - id: l21-q04
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l21-o1]
    prompt: |
      Your model reports 94% accuracy on the test set and the number has been
      stable for months. A customer reports that it fails badly on night-shift
      data.

      What is the defect in the reporting?
    options:
      - "Accuracy is the wrong metric here; F1 balances precision against recall and would have surfaced the night-shift failure"
      - "An aggregate is a weighted average over whatever slices happen to be in the test set, and the weights are an accident of how the data was collected"
      - "The test set is stale and should be refreshed continuously from production traffic"
      - "94% is simply too low a bar for a production system, and the threshold should be raised"
    answer: "An aggregate is a weighted average over whatever slices happen to be in the test set, and the weights are an accident of how the data was collected"
    evidence: |
      A single scalar cannot show you which slice is failing, and a slice that is
      rare in your test set contributes almost nothing to the aggregate however
      badly it does. Refreshing the test set is the wrong instinct here for a
      separate reason: an eval set that moves cannot be compared with itself over
      time, which is why the session insists on a frozen, versioned one. Report
      per slice, and freeze the set.
    source:
      file: lectures/l21/notes.md
      heading: "ML metrics recap, and why one number hides the failure that matters"
      quote: "the weights are usually an accident of how the data w"
    verify: {mode: quote, needle: "an accident of how the data", volatility: stable}
    tags: [evaluation, slices]

  - id: l21-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o1]
    prompt: |
      Why must an eval set be frozen and versioned rather than refreshed as new
      production data arrives?
    options:
      - "Because labelling is expensive, so re-labelling should be avoided where possible"
      - "Because a set that moves cannot be compared with itself over time"
      - "Because production data is not representative of the deployment distribution"
      - "Because a frozen set can be cached, which makes the harness fast enough to run in CI"
    answer: "Because a set that moves cannot be compared with itself over time"
    evidence: |
      The whole value of an eval number is the comparison it supports: this
      version against last version. Change the set and the comparison silently
      becomes a comparison of two different questions, so a drop could mean a
      regression or could mean the new examples were harder, and you cannot tell
      which. Freezing does not mean never adding; it means versioning, so that
      every number is attached to the set it was computed on.
    source:
      file: lectures/l21/notes.md
      heading: "The eval mindset: a frozen, versioned test set"
      quote: "the test set has to be **frozen** and **versioned**"
    verify: {mode: quote, needle: "frozen", volatility: stable}
    tags: [evaluation, methodology]

  - id: l21-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      When building an LLM-as-judge, what should the judge be asked to return?
    options:
      - "Prose you then parse, since free text lets the judge express nuance a schema would flatten"
      - "A score plus a written justification, as structured output"
      - "A single score, since a justification costs output tokens and latency without changing the number the harness records"
      - "A ranked list of all candidate answers, since relative judgements are more reliable than absolute ones"
    answer: "A score plus a written justification, as structured output"
    evidence: |
      Two reasons, and the second is the one people miss. Structured output is
      more reliable to extract than prose you parse. And writing the
      justification is frequently what makes the judge's reasoning inspectable at
      all, which is what lets you find the blind spot when validation fails.
      A bare score gives you a number and no way to debug it.
    source:
      file: lectures/l21/notes.md
      heading: "LLM-as-judge, done carefully"
      quote: "a score plus a written justification instead of freeform prose you then have to parse"
    verify: {mode: quote, needle: "a written justification", volatility: stable}
    tags: [evaluation, judge, structured-output]

  - id: l21-q07
