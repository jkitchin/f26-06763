  # --- o1: where a model runs ----------------------------------------------------------------------

  - id: l21-q01
    kind: predict_measure
    rung: 2
    difficulty: 2
    objectives: [l21-o1, l21-o2]
    prompt: |
      On the course laptop the concrete strength service took 0.81 s from launch to its first
      ready answer. The model file is 46 kB. Where did most of that time go?
    predict:
      common_prior: "Loading the model weights from disk"
    options:
      - "Loading the model weights from disk"
      - "Starting Python and importing the libraries"
      - "Checking the artifact's SHA-256 against the manifest"
      - "Opening the network socket for uvicorn"
    answer: "Starting Python and importing the libraries"
    evidence: |
      Loading the model took 0.058 s. The other 93% was the interpreter starting and importing
      FastAPI, NumPy and scikit-learn. For a small model the cold start is mostly imports; for a
      large one the load dominates, which is why loading once at startup matters more as models
      grow.
    source:
      file: lectures/l21/notes.md
      heading: "Loading the model once"
      quote: |
        The other 93% was starting Python and
        importing FastAPI, NumPy and scikit-learn.
    verify: {mode: quote, needle: "The other 93% was starting Python", volatility: measured}
    tags: [cold-start, lifespan]

  - id: l21-q02
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l21-o1]
    prompt: |
      A heat-exchanger fouling surrogate feeds a report the plant reviews each Monday. Nothing else
      ever calls it. Where should it run?
    options:
      - "A long-running HTTP service, so the report can call it"
      - "A batch job that scores the table on a schedule"
      - "A serverless container that scales to zero between reports"
      - "In the browser of whoever opens the report"
    answer: "A batch job that scores the table on a schedule"
    evidence: |
      Nobody is waiting for the answer, so a server is a process to keep alive and a bill for
      nothing. Score the whole table on a schedule and write the predictions where the report
      already reads, with the idempotent stages of Lecture 5.
    source:
      file: lectures/l21/notes.md
      heading: "Where a model runs"
      quote: |
        If nobody is waiting for the answer, do not run a server.
    verify: {mode: quote, needle: "do not run a server", volatility: stable}
    tags: [batch, where-it-runs]

  - id: l21-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o1]
    prompt: |
      A model on Cloud Run scales to zero when idle. It gets a few requests an hour, so most arrive
      after a quiet period, and a cold start (mostly loading weights) takes about 2 s. Users need
      a p95 under 200 ms. What is the trade?
    options:
      - "Keep instances warm and pay for them while idle"
      - "Raise the worker count so each cold start loads faster"
      - "Switch to async def endpoints so the load does not block"
      - "None: scaling to zero does not change request latency"
    answer: "Keep instances warm and pay for them while idle"
    evidence: |
      Scale to zero makes an idle service free and makes the first request after a quiet period
      wait for a cold start. A minimum number of warm instances removes the wait, and those
      instances are billed, so the saving goes with it. More workers would each load their own
      copy and start no faster.
    source:
      file: lectures/l21/notes.md
      heading: "Limitations and trade-offs"
      quote: |
        Keeping instances warm removes the wait and
        the saving together.
    verify: {mode: quote, needle: "removes the wait and the saving together", volatility: stable}
    tags: [serverless, cold-start]

  # --- o2: the service contract -------------------------------------------------------------------

  - id: l21-q04
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      A reviewer proposes setting every request bound to the training minimum and maximum, for
      example `slag: float = Field(ge=0, le=360)`, so that any mix outside the training data gets
      a 422. What is wrong with that?
    options:
      - "Nothing; out-of-range requests should get a 422 before the model runs"
      - "It refuses possible mixes; answer them and flag them out of domain"
      - "Pydantic cannot express an upper bound on a float field"
      - "Bounds belong in the response model, not the request model"
    answer: "It refuses possible mixes; answer them and flag them out of domain"
    evidence: |
      A 422 is for the impossible, such as negative cement. A mix with more slag than any training
      mix is a legitimate question with an unreliable answer, so the service answers it and the
      response lists every feature outside the training box stored in the manifest.
    source:
      file: lectures/l21/notes.md
      heading: "Requests that cannot be wrong in the obvious ways"
      quote: |
        These bounds reject the impossible. They should not reject the unusual.
    verify: {mode: quote, needle: "should not reject the unusual", volatility: stable}
    tags: [pydantic, validation, out-of-domain]

  - id: l21-q05
    kind: predict_measure
    rung: 2
    difficulty: 3
    objectives: [l21-o2]
    prompt: |
      Inside the training ranges the ensemble predicts 48.3 MPa with a 90% interval about 37 MPa
      wide. Raise the slag to 400 kg/m3 and the age to 730 days, both outside the training data.
      What happens to the interval?
    predict:
      common_prior: "It widens, because the model knows less there"
    options:
      - "It widens, because the model knows less there"
      - "It narrows slightly, to 34 MPa wide"
      - "It is unchanged, since the calibration factor is fixed"
      - "The service refuses the request with a 422"
    answer: "It narrows slightly, to 34 MPa wide"
    evidence: |
      The interval comes from the spread of the five networks, and they agree with each other off
      the data as readily as on it. So the interval cannot warn you, and the response carries an
      explicit in_domain flag computed from the training minimum and maximum of each feature.
    source:
      file: lectures/l21/notes.md
      heading: "Responses that carry what the caller needs"
      quote: |
        a narrower interval, 34 MPa wide against 37, for the question the model knows
        less about.
    verify: {mode: quote, needle: "34 MPa wide against 37", volatility: measured}
    tags: [uncertainty, out-of-domain, ensemble]

  - id: l21-q06
    kind: predict_measure
    rung: 2
    difficulty: 3
    objectives: [l21-o2, l21-o4]
    prompt: |
      Four clients send 5,000-mix batches to a CPU-bound prediction endpoint written as
      `async def`, while a fifth client asks /healthz every 50 ms. Compared with the same code
      written as plain `def`, what happens to the health check?
    predict:
      common_prior: "No difference, since async def is the faster, modern choice"
    options:
      - "No difference, since async def is the faster, modern choice"
      - "It slows to about 160 ms median, waiting for whole batches"
      - "It gets faster, since async def frees the threadpool"
      - "It fails outright, because uvicorn kills the blocked worker"
    answer: "It slows to about 160 ms median, waiting for whole batches"
    evidence: |
      An async def endpoint runs on the event loop itself, so a computation that never awaits
      blocks every other request until it finishes. A plain def endpoint runs in a threadpool and
      the server keeps answering: 48 ms median against 161 ms, and 42 health answers in four
      seconds against 19.
    source:
      file: lectures/l21/notes.md
      heading: "def, async def, and a model that blocks"
      quote: |
        With `async def`
        every request, health checks included, waits for whole batches to finish.
    verify: {mode: quote, needle: "waits for whole batches to finish", volatility: measured}
    tags: [async, concurrency, fastapi]

  - id: l21-q07
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l21-o2, l21-o3]
    prompt: |
      "The thing worth saving is the recipe, more than the weights." When this service rebuilt
      Lecture 14's ensemble with the same split, network and seeds, what happened?
    options:
      - "It reproduced the ensemble bit for bit, as a seeded deterministic run should"
      - "The calibration factor came out 2.09, not 1.66; intervals covered 95.9%"
      - "It failed to run at all, because the scikit-learn API had changed"
      - "The networks came out different, but the calibration factor still matched"
    answer: "The calibration factor came out 2.09, not 1.66; intervals covered 95.9%"
    evidence: |
      All five networks stop at the iteration cap without converging, so their final weights
      depend on floating-point details a library build can move. Lecture 14's own script now gives
      2.09 too. What reproduces the model is the artifact, with a manifest of library versions, the
      data hash and the file's own hash.
    source:
      file: lectures/l21/notes.md
      heading: "What to save, and how to load it"
      quote: |
        The recipe
        was saved and it did not reproduce the model.
    verify: {mode: quote, needle: "did not reproduce the model", volatility: measured}
    tags: [manifest, reproducibility, artifact]

  - id: l21-q08
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      A team's liveness probe runs a test prediction and a database query. During a slow spell in
      the database, the orchestrator restarts every instance of the service at once. What went
      wrong?
    options:
      - "The probe was too slow; run it every second instead of every ten"
      - "Liveness checked dependencies; keep it trivial, put those in readiness"
      - "There should be no liveness probe when a readiness probe exists"
      - "Restarting was correct; the database should have been restarted first, then the app"
    answer: "Liveness checked dependencies; keep it trivial, put those in readiness"
    evidence: |
      A failed liveness probe restarts the container; a failed readiness probe only takes it out
      of traffic. A liveness check that calls a slow dependency fails everywhere at once, and the
      restarts turn a slow database into an outage.
    source:
      file: lectures/l21/notes.md
      heading: "Health checks"
      quote: |
        Incorrect implementation of liveness probes can lead
        to cascading failures.
    verify: {mode: quote, needle: "can lead to cascading failures", volatility: stable}
    tags: [health-check, liveness, readiness]

  - id: l21-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      The concrete service standardizes each request before the networks see it. Why does it save
      the fitted scaler with each network rather than recomputing the scaling in the endpoint?
    options:
      - "So requests use the training means and spreads, and no other"
      - "Because a saved scaler makes each prediction faster to compute"
      - "So the scaler can refit itself on each incoming batch of requests"
      - "Because Pydantic needs the scaler to range-check the fields"
    answer: "So requests use the training means and spreads, and no other"
    evidence: |
      Training-serving skew is a feature computed one way in training and another in serving.
      Saving the Lecture 8 Pipeline with the model makes the serving path reuse the training code,
      which is Google's Rule 32, and leaves no second implementation to drift.
    source:
      file: lectures/l21/notes.md
      heading: "Training-serving skew"
      quote: |
        the service saves the scaler with each network, so a request is standardized with the training
        means and spreads and cannot be standardized any other way.
    verify: {mode: quote, needle: "saves the scaler with each network", volatility: stable}
    tags: [training-serving-skew, pipeline]

  # --- o3: packaging -----------------------------------------------------------------------------

  - id: l21-q10
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l21-o3]
    prompt: |
      Every one-line edit to app.py makes this build reinstall scikit-learn and NumPy. Why?

      ```dockerfile
      FROM python:3.12-slim
      COPY --from=ghcr.io/astral-sh/uv:0.10.3 /uv /uvx /bin/
      WORKDIR /app
      COPY . .
      RUN uv sync --locked --no-dev
      CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
      ```
    options:
      - "COPY . . comes before the install, so a code change invalidates that layer"
      - "--locked makes uv re-resolve and redownload every dependency on each build"
      - "The exec-form CMD at the end turns off Docker's layer cache for the whole file"
      - "The uv image tag is pinned, so its layer is always rebuilt"
    answer: "COPY . . comes before the install, so a code change invalidates that layer"
    evidence: |
      Docker's cache is strictly ordered, so a changed layer rebuilds everything after it. Install
      the dependencies from the lockfile first, in their own layer, and copy the code after. Built
      that way, a full build took 11.7 s and a rebuild after an edit to app.py took 2.9 s.
    source:
      file: lectures/l21/notes.md
      heading: "A Dockerfile from the lockfile"
      quote: |
        Once a layer changes, then all
        downstream layers need to be rebuilt as well
    verify: {mode: quote, needle: "downstream layers need to be rebuilt", volatility: stable}
    tags: [docker, layer-cache]

  - id: l21-q11
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l21-o3]
    prompt: |
      The image is built with `--build-arg API_KEY=...` and then pushed. The running container has
      no key.txt. Is the key safe in the pushed image?

      ```dockerfile
      ARG API_KEY
      COPY key.txt /app/key.txt
      RUN ./fetch-weights --key-file /app/key.txt && rm /app/key.txt
      ```
    options:
      - "Yes: the rm deleted the file, and build arguments are not kept in the image"
      - "No: docker history shows the ARG, and the COPY layer keeps the file"
      - "Yes, as long as the final stage runs as a non-root user such as app"
      - "No, but only because the name key.txt is easy to guess"
    answer: "No: docker history shows the ARG, and the COPY layer keeps the file"
    evidence: |
      Layers are immutable. The rm adds a layer that hides the file and the COPY layer still
      holds it, readable from the saved image; the figure script recovered it that way, and read
      the build argument from docker history --no-trunc. Use RUN --mount=type=secret, and rotate
      any key that did leak.
    source:
      file: lectures/l21/notes.md
      heading: "Configuration and secrets"
      quote: |
        so deleting a file adds a layer that hides it and removes nothing.
    verify: {mode: quote, needle: "hides it and removes nothing", volatility: stable}
    tags: [secrets, docker, image-layer]

  - id: l21-q12
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l21-o3]
    prompt: |
      A surrogate lists a plain `torch` dependency. It installs on a Mac, and the same project is
      built into a Linux container. Compared with the Mac, what happens to torch's size in the
      image, and what is the fix?
    options:
      - "Smaller, since Linux wheels leave out the Metal backend"
      - "Much larger: Linux gets the CUDA build; use the CPU index"
      - "The same, because uv.lock pins one wheel for every platform"
      - "Larger, but only by the size of the Python interpreter"
    answer: "Much larger: Linux gets the CUDA build; use the CPU index"
    evidence: |
      PyPI hosts CPU-only torch wheels for macOS and GPU wheels for Linux. The Linux wheel is 539
      MB and pulls NVIDIA's libraries (cuDNN alone is 519 MB), against about 210 MB for the CPU
      wheel. uv's PyTorch guide shows how to point torch at the CPU index, and a model this size
      does not need a GPU.
    source:
      file: lectures/l21/notes.md
      heading: "Image size, and the GPU you do not need"
      quote: |
        so a plain `uv add torch` that is small on your Mac is large in a Linux container.
    verify: {mode: quote, needle: "large in a Linux container", volatility: stable}
    tags: [pytorch, cpu-only, image-size]

  # --- o4: latency, capacity and cost -------------------------------------------------------------

  - id: l21-q13
    kind: predict_measure
    rung: 3
    difficulty: 3
    objectives: [l21-o4]
    prompt: |
      One uvicorn worker saturates at about 1,800 requests per second. With 32 closed-loop
      clients, each sending its next request as soon as the last one returns, what mean
      latency do you predict?
    predict:
      common_prior: "About 4.4 ms, the same as at 8 clients"
    options:
      - "About 4.4 ms, the same as at 8 clients"
      - "About 18 ms, since W = N/X = 32/1800"
      - "About 1.1 ms, since more clients share the overhead"
      - "Unbounded, because the queue grows without limit"
    answer: "About 18 ms, since W = N/X = 32/1800"
    evidence: |
      Once throughput is pinned at capacity, Little's law L = λW makes latency proportional to the
      number in the system: 32/1800 s is 18 ms, and the measured mean was 17.4 ms (median 17.1 ms,
      after 4.4 and 8.7 ms at 8 and 16 clients). In a closed loop the queue cannot exceed the 32 clients, so it does not grow
      without limit.
    source:
      file: lectures/l21/notes.md
      heading: "Little's law and saturation"
      quote: |
        with throughput fixed at the service's capacity $X$, the latency of $N$ clients is $W = N/X$.
    verify: {mode: quote, needle: "the latency of $N$ clients is $W = N/X$", volatility: measured}
    tags: [littles-law, capacity, latency]

  - id: l21-q14
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l21-o4]
    prompt: |
      Each server typically answers in 10 ms, with a p99 of one second. A user request must wait
      for 100 such servers. What share of user requests take more than one second?
    options:
      - "About 1%, the same as for a single server"
      - "About 63%, which is 1 - 0.99^100"
      - "About 10%, since only the slowest tenth of servers matter"
      - "All of them, since some server is always slow"
    answer: "About 63%, which is 1 - 0.99^100"
    evidence: |
      A request is fast only if all 100 servers are, which happens with probability 0.99^100, about
      0.37. A component's tail becomes the system's typical case, which is why Dean and Barroso
      send hedged requests to a second replica after a short delay.
    source:
      file: lectures/l21/notes.md
      heading: "The tail at scale"
      quote: |
        "63% of user
        requests will take more than one second,"
    verify: {mode: quote, needle: "requests will take more than one second", volatility: stable}
    tags: [tail-latency, fan-out]

  - id: l21-q15
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l21-o4]
    prompt: |
      One mix per request cost 0.89 ms per prediction. The same service gets requests carrying
      1,000 mixes each. Per prediction, what happened?
    options:
      - "Slightly cheaper, since the networks do the same work per mix"
      - "About a hundred times cheaper, 9.1 µs each"
      - "More expensive, since the request is much larger to parse"
      - "The same, since batching only helps on a GPU"
    answer: "About a hundred times cheaper, 9.1 µs each"
    evidence: |
      Almost all of a single request's cost was fixed overhead (parsing, validation, routing), not
      the five small networks, and a batch pays it once. An optimizer that proposes candidates in
      batches, as L15's batch acquisition does, gets the same saving from a surrogate service.
    source:
      file: lectures/l21/notes.md
      heading: "Batching"
      quote: |
        A thousand-mix batch is a hundred times cheaper per
        prediction, because almost all of a single request's cost was overhead
    verify: {mode: quote, needle: "a hundred times cheaper per prediction", volatility: measured}
    tags: [batching, throughput]

  - id: l21-q16
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l21-o4]
    prompt: |
      At $2 per million input tokens and $10 per million output tokens, an answer built from 3,000
      tokens of retrieved context and a 300-token reply costs about how much per thousand answers?
    options:
      - "$3, since only the reply is billed"
      - "$6.60, counting every token at the input price"
      - "$9, two thirds of it from the input context"
      - "$33, if every token is billed at the output price"
    answer: "$9, two thirds of it from the input context"
    evidence: |
      3,000 × $2/10^6 is $0.006 and 300 × $10/10^6 is $0.003, so $0.009 an answer. Output tokens
      cost five times as much, but a retrieval prompt is mostly input. Prices change, so read the
      pricing page on the day and record the date with the estimate.
    source:
      file: lectures/l21/notes.md
      heading: "Cost"
      quote: |
        $3000 \times 2/10^6 + 300 \times 10/10^6 = \$0.009$, nine dollars per thousand answers.
    verify: {mode: quote, needle: "nine dollars per thousand answers", volatility: stable}
    tags: [llm-cost, tokens]

  - id: l21-q17
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l21-o4]
    prompt: |
      A design review justifies a latency target with "every 100 ms of latency costs 1% of sales".
      What does following that number to its sources show?
    options:
      - "Amazon's controlled study measured exactly 1% per 100 ms"
      - "One slide bullet; Google's controlled test found far less"
      - "Google's 2009 experiment found 20% fewer searches per 500 ms"
      - "The sources agree, but the effect was only seen on mobile users"
    answer: "One slide bullet; Google's controlled test found far less"
    evidence: |
      The Amazon figure is one bullet on a 2006 slide with no method and no sample size. Brutlag's
      controlled 2009 experiment injected delays into Google search and found 100 to 400 ms cost
      0.2% to 0.6% of daily searches, with no measurable effect at 50 ms.
    source:
      file: lectures/l21/notes.md
      heading: "What latency costs, and the numbers that circulate"
      quote: |
        "increasing web search latency 100 to 400 ms reduces the daily number of
        searches per user by 0.2% to 0.6%,"
    verify: {mode: quote, needle: "reduces the daily number of searches per user", volatility: stable}
    tags: [folklore, reading-claims, latency]

  # --- o5: releasing changes safely -----------------------------------------------------------------

  - id: l21-q18
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l21-o5]
    prompt: |
      CrowdStrike's 19 July 2024 update shipped no new code, only a content configuration file
      read by the existing sensor. Which lesson carries over to a model service?
    options:
      - "Data files are safe to push globally, since the code was already tested"
      - "New weights or a new calibration factor need the same staged release as code"
      - "Only kernel-level software needs staged rollouts; user-space services never do"
      - "Content updates should be tested with wildcards to cover every value"
    answer: "New weights or a new calibration factor need the same staged release as code"
    evidence: |
      The template defined 21 input fields and the code supplied 20, and the tests used a wildcard
      for the 21st, so they never hit the mismatch. Weights, a feature schema or a calibration
      factor change what running code does in the same way, and CrowdStrike's own remedy was a
      staged rollout for each content instance.
    source:
      file: lectures/l21/notes.md
      heading: "Every change is a deploy: CrowdStrike, 19 July 2024"
      quote: |
        "Each Template
        Instance should be deployed in a staged rollout"
    verify: {mode: quote, needle: "deployed in a staged rollout", volatility: stable}
    tags: [case-study, staged-rollout, content-update]

  - id: l21-q19
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l21-o5]
    prompt: |
      Knight Capital's new code reached seven of its eight servers. Engineers then rolled back by
      removing the new code from the seven, and the losses grew. What does the case say a deploy
      needs before it counts as done?
    options:
      - "A faster rollback, so the old code is back on all eight within seconds"
      - "A check on every instance that the tested artifact is running"
      - "A second deploy to the eighth server before markets open"
      - "Fewer servers, since eight is too many to keep in step"
    answer: "A check on every instance that the tested artifact is running"
    evidence: |
      Nobody confirmed the eighth server, where a repurposed flag woke the retired Power Peg code,
      and the rollback put the seven good servers into the same state. For a model service the
      check is /readyz returning the model version, compared from outside against the version you
      meant to deploy.
    source:
      file: lectures/l21/notes.md
      heading: "Verify what is running: Knight Capital, and this website"
      quote: |
        A deploy is
        complete when you have confirmed, on every instance, that the artifact you tested is the one
        running
    verify: {mode: quote, needle: "confirmed, on every instance", volatility: stable}
    tags: [case-study, rollback, verification]

  - id: l21-q20
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l21-o5]
    prompt: |
      To be safe, a team runs a new, heavier anomaly model in shadow mode on the serving machines:
      it scores all live traffic and its outputs are discarded. What does Cloudflare's 2 July 2019
      outage say about this plan?
    options:
      - "Shadow mode is free, because nothing acts on the model's output"
      - "It still spends CPU on the machines serving real traffic, as simulate mode did"
      - "Shadow mode is only risky when its predictions are logged to disk"
      - "It is safe once the change can be pushed globally in seconds"
    answer: "It still spends CPU on the machines serving real traffic, as simulate mode did"
    evidence: |
      Cloudflare's new WAF rule ran in simulate mode, which records what it would have done, and
      its regular expression backtracked badly enough to exhaust the CPU used for serving. The
      network was down for 27 minutes. A shadow model costs what the model costs, on the same
