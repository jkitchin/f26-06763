      - text: "The fix is usually a sharper rubric or a programmatic check, not a bigger model"
        needle: "not a bigger model"
      - text: "Name the biases you are controlling for: position, length, self-preference"
        needle: "Self-preference"
    answer: null
    evidence: |
      The demo runs exactly this on eight constructed cases and gets a kappa of
