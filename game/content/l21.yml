# L21 item bank for deployment: where a model runs, the service contract (request bounds against
# the out-of-domain flag, the interval that does not widen off the data, loading once, def against
# async def, what to save, training-serving skew), packaging (layer order, secrets in layers, the
# CPU-only torch wheel), health checks, latency and capacity (fan-out, Little's law, batching), the
# cost of an LLM call, the latency folklore against Brutlag, and the release incidents. Every item
# quotes lectures/l21/notes.md; the measured numbers come from lectures/l21/figures/make_figures.py.
#
# The bank starts at version 3 because versions 1 and 2 were the evaluation lecture that used to be
# L21 (now archive/l21-evaluation/). pools/l21.json keeps them, so PDFs issued against them still
# verify.

