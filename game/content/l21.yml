  - id: l21-q08
    kind: locus_of_control
    rung: 3
    difficulty: 3
    objectives: [l21-o3]
    prompt: |
      A user reports that your agent "did something weird" yesterday afternoon.
      You cannot reproduce it.

      What makes this a debuggable incident rather than a shrug?
    options:
      - "A higher log level on the model client, so the raw HTTP exchange is captured"
      - "A trace per request, so the specific run can be retrieved and read"
      - "A larger eval set, so the behaviour would have been caught before release"
      - "Pinning the model version, so yesterday's behaviour is reproducible today"
    answer: "A trace per request, so the specific run can be retrieved and read"
    evidence: |
      Pinning and a bigger eval set are both good and neither answers this
      question, because this question is about an event that already happened.
      An agent trace is a run, the same as a training run, and deserves the same
      discipline about being recorded rather than trusted to memory. Without one
      the incident is unfalsifiable in both directions: you cannot confirm it and
      you cannot dismiss it.
    source:
      file: lectures/l21/notes.md
      heading: "Observability and tracing"
      quote: "observability, tracing, structured logging"
    verify: {mode: quote, needle: "tracing", volatility: stable}
    tags: [observability, tracing]

  - id: l21-q09
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l21-o2]
    prompt: |
      Open [`l21-eval.ipynb`](../lectures/l21/l21-eval.ipynb) and run the judge
      validation against the hand-labelled cases.

      What does the agreement look like, and what should you conclude from it?
    options:
      - "Strong agreement, showing that a simple heuristic is adequate for most grading"
      - "Agreement no better than chance, about this judge rather than judges in general"
      - "Perfect agreement, since the cases were constructed to be unambiguous"
      - "Agreement that cannot be summarised, because kappa is undefined on so few cases"
    answer: "Agreement no better than chance, about this judge rather than judges in general"
    evidence: |
      Kappa comes out around -0.11 against a deliberately naive lexical-overlap
      judge. The generalisation to resist is "LLM judges do not work": the
      measured thing is that *this* judge, on *this* rubric, does not, and the
      procedure that established it is the transferable part. Run the same
      procedure on your own judge and you will get your own number, which is the
      only one that licenses trusting it.
    source:
      file: lectures/l21/notes.md
      heading: "LLM-as-judge, done carefully"
      quote: "a judge deliberately built to be naive"
    verify: {mode: quote, needle: "deliberately built to be naive", volatility: stable}
    tags: [evaluation, judge, notebook]

  - id: l21-q10
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l21-o3]
    prompt: |
      What should a trace record for every request, and why does cost belong on
      that list?
    options:
      - "Inputs and outputs only, since tool calls and timings are already in the application logs and duplicating them wastes storage"
      - "Inputs, outputs, tool calls, latency and cost, because cost is a per-request property that only becomes visible in aggregate and only if it was recorded"
      - "A hash of the request, so traces stay small and no user data is retained anywhere in the system"
      - "The model version and the prompt template, since those are the only things that change between deployments"
    answer: "Inputs, outputs, tool calls, latency and cost, because cost is a per-request property that only becomes visible in aggregate and only if it was recorded"
    evidence: |
      Cost is the one people leave out, and it is the one that cannot be
      reconstructed later: a monthly invoice tells you the total and nothing about
      which request shape caused it. Recorded per request, the same data answers
      "what did yesterday's incident do" and "which endpoint is expensive", which
      is why this is one mechanism rather than two.
    source:
      file: lectures/l21/notes.md
      heading: "Observability and tracing"
      quote: "observability, tracing, structured logging"
    verify: {mode: quote, needle: "structured logging", volatility: stable}
    tags: [observability, cost]
