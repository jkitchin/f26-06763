schema: cmu-06763-map-edges/1

# Hand-authored corridors for the back half of the course.
#
# tools/graph.py extracts the dependency graph from markdown cross-links, which
# is the right default because a link is unambiguous and machine-checkable. It
# stops at Lecture 15. The four late lectures cite earlier sessions only in prose, so
# an extracted map would leave the entire LLM and production arc unconnected,
# which is the half students reach when they are most lost.
#
# The alternative considered and rejected was extracting prose mentions. Checked
# rather than assumed: every mention in the corpus today is of the form "from
# Lecture 3" or "as in Lecture 5", and the reversing forms ("unlike Lecture 5", "rather than Lecture 5") do
# not currently occur, so a regex would in fact work right now. It is still the
# wrong source of truth. Nothing stops the reversing form from being written
# next week, a corridor built on one would be a prerequisite the notes
# explicitly deny, and nothing would catch it.
#
# So these are content, and they are held to the same standard as a quiz item.
# Each edge quotes the sentence that justifies it, tools/graph.py checks the
# quote still appears in the cited file, and it checks the quote actually names
# the lecture the edge points at. An edge nobody can point at is an invented
# prerequisite, and inventing prerequisites is precisely what this course
# teaches against.
#
# Lecture 17 is absent on purpose. It cites nothing, by link or in prose, and that is a
# true fact about the course rather than a gap in this file. It should show on
# the map as the dead end it is.

relations:
  # A closed vocabulary, because the map draws each one differently and an open
  # one drifts into synonyms nobody can render.
  builds-on:   the session assumes the target's material and extends it
  contrasts:   the session defines itself against the target
  reuses:      the session reuses a concrete artifact, tool or harness
  shares-data: the session runs on the same dataset
  prevents:    the session's mechanism prevents a failure the target named

edges:
  # --- Lecture 19, agents ---------------------------------------------------------
  - from: l19
    to: l17
    relation: contrasts
    why: >-
      The cleanest statement of what an agent is, and it is a negative
      definition: retrieval always happens, tool use is decided. Walking this
      corridor should feel like the distinction landing.
    source:
      file: lectures/l19/notes.md
      quote: >-
        A RAG pipeline in Lecture 17 always retrieves, then always generates; the order
        and the branching are yours, fixed in code

  - from: l19
    to: l05
    relation: reuses
    why: >-
      Agent observability is not a new subject; it is the logging from the
      streaming session pointed at a different kind of run.
    source:
      file: lectures/l19/notes.md
      quote: Reuse the structured logging and MLflow tracking from Lecture 5

  - from: l19
    to: l03
    relation: shares-data
    why: The Intel Lab sensor data, still the spine of the course's examples.
    source:
      file: lectures/l19/notes.md
      quote: against the same Intel Lab sensor Parquet file from Lecture 3 and Lecture 4

  - from: l19
    to: l04
    relation: shares-data
    why: Same file, reached through the columnar path Lecture 4 introduces.
    source:
      file: lectures/l19/notes.md
      quote: against the same Intel Lab sensor Parquet file from Lecture 3 and Lecture 4

  - from: l19
    to: l13
    relation: reuses
    why: >-
      The agent's tool is a surrogate, so the demo only works if the surrogate
      session already happened. A genuine prerequisite rather than a callback.
    source:
      file: lectures/l19/notes.md
      quote: >-
        small surrogate standing in for Lecture 13's airfoil noise model, sharing that
        model's five inputs

  # --- Lecture 21, evaluation and observability -----------------------------------
  - from: l21
    to: l13
    relation: builds-on
    why: >-
      The strongest claim of dependency anywhere in the back half. Not "recall
      Lecture 13" but "this is Lecture 13, continued".
    source:
      file: lectures/l21/notes.md
      quote: >-
        the subject of the entire second half of Lecture 13: what happens when a
        company builds the model, ships it, and stops watching

  - from: l21
    to: l03
    relation: builds-on
    why: >-
      The 2.4-volt threshold is a specific number decided in Lecture 3. Evaluating
      against it is meaningless without knowing where it came from.
    source:
      file: lectures/l21/notes.md
      quote: sensor readings above Lecture 3's 2.4-volt trustworthiness threshold

  - from: l21
    to: l19
    relation: builds-on
    why: >-
      The evaluation session consumes exactly what the agent session already
      emits, which is why the two are adjacent rather than merely related.
    source:
      file: lectures/l21/notes.md
      quote: >-
        Lecture 19's harness already logs everything a failure taxonomy needs, every
        tool call, every result, every stop condition

  - from: l21
    to: l17
    relation: reuses
    why: The eval harness is built against the RAG system Lecture 17 leaves behind.
    source:
      file: lectures/l21/notes.md
      quote: >-
        eval harness for a small RAG assistant in the spirit of Lecture 17's system

  - from: l21
    to: l04
    relation: shares-data
    why: Same sensor data, no API key, which is why the demo runs anywhere.
    source:
      file: lectures/l21/notes.md
      quote: data Lecture 3, Lecture 4, and Lecture 19 use and needs no API key or external service

  # --- Lecture 23, MLOps and responsibility ---------------------------------------
# Signs on the rooms that are not written yet.
#
# Lectures with no notes show as shuttered rooms rather than as absences, so the
# shape of the whole course is legible from week one and the map grows by opening
# a shutter rather than by being redrawn. A shutter used to be able to carry a
# "sign" quoted from a lecture that promised it, but the course no longer makes
# forward references, so there are no promise quotes to carry. Shuttered rooms
# stand on their own.
shutters: []
