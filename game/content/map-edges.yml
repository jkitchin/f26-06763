schema: cmu-06763-map-edges/1

# Hand-authored corridors for the back half of the course.
#
# tools/graph.py extracts the dependency graph from markdown cross-links, which
# is the right default because a link is unambiguous and machine-checkable. It
# stops at Lecture 17. The four late lectures cite earlier sessions only in prose, so
# an extracted map would leave the entire LLM and production arc unconnected,
# which is the half students reach when they are most lost.
#
# The alternative considered and rejected was extracting prose mentions. Checked
# rather than assumed: every mention in the corpus today is of the form "from
# Lecture 3" or "as in Lecture 5", and the reversing forms ("unlike Lecture 5", "rather than Lecture 5") do
# not currently occur, so a regex would in fact work right now. It is still the
# wrong source of truth. Nothing stops the reversing form from being written
# next week, a corridor built on one would be a prerequisite the notes
# explicitly deny, and nothing would catch it.
#
# So these are content, and they are held to the same standard as a quiz item.
# Each edge quotes the sentence that justifies it, tools/graph.py checks the
# quote still appears in the cited file, and it checks the quote actually names
# the lecture the edge points at. An edge nobody can point at is an invented
# prerequisite, and inventing prerequisites is precisely what this course
# teaches against.
#
# Lecture 19 is absent on purpose. It cites nothing, by link or in prose, and that is a
# true fact about the course rather than a gap in this file. It should show on
# the map as the dead end it is.

relations:
  # A closed vocabulary, because the map draws each one differently and an open
  # one drifts into synonyms nobody can render.
  builds-on:   the session assumes the target's material and extends it
  contrasts:   the session defines itself against the target
  reuses:      the session reuses a concrete artifact, tool or harness
  shares-data: the session runs on the same dataset
  prevents:    the session's mechanism prevents a failure the target named

# No authored corridors at present: every one written so far left with the lecture it came
# from. The list stays, empty, so tools/graph.py and the map keep reading it.
edges: []
  # --- Lecture 20 ------------------------------------------------------------------
  # The five agent corridors that stood here left on 2026-10-12 with the agents draft,
  # when L20 became reinforcement learning. The draft became L19 (rewritten 2026-11-03),
  # whose notes cite earlier lectures with markdown links, so its corridors are extracted
  # and none are authored here. L20's own corridors are extracted the same way.

  # --- Lecture 21 ------------------------------------------------------------------
  # The four corridors that stood here (to l13, l03, l19 and l04) belonged to the evaluation
  # lecture, which left the schedule on 2026-11-04 when L21 became the optional deployment
  # session. They are kept, with their quotes, in archive/l21-evaluation/map-edges.yml.

  # --- Lecture 23, MLOps and responsibility ---------------------------------------
  # Its five edges left with the lecture when it moved to course/optional/mlops.md.

# Signs on the rooms that are not written yet.
#
# Lectures with no notes show as shuttered rooms rather than as absences, so the
# shape of the whole course is legible from week one and the map grows by opening
# a shutter rather than by being redrawn. A shutter used to be able to carry a
# "sign" quoted from a lecture that promised it, but the course no longer makes
# forward references, so there are no promise quotes to carry. Shuttered rooms
# stand on their own.
shutters: []
