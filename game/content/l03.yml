  - id: l03-q01
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l03-o2]
    prompt: |
      ```sql
      SELECT * FROM readings WHERE value <> 30;
      ```
      Your sensor table has nulls in `value`. What does this return?
    options:
      - "Every row whose value is not 30, including the null ones, since null is not 30"
      - "Every row whose value is not 30, silently excluding all null rows"
      - "An error, since a comparison against null is not permitted in a WHERE clause"
      - "Every row, since null comparisons default to true in PostgreSQL"
    answer: "Every row whose value is not 30, silently excluding all null rows"
    evidence: |
      SQL has three truth values, not two: true, false, and unknown. "Unknown is
      not equal to 30" evaluates to unknown rather than to true, so the row is
      not returned. This is defined semantics rather than a defect, and it
      quietly produces wrong analyses for anyone who forgets it. The same family
      contains a worse one: `NOT IN` against a subquery containing a single null
      returns no rows at all.
    source:
      file: lectures/l03/notes.md
      heading: "NULL is not a value, and three-valued logic will surprise you"
      quote: "silently drops every\nrow where `value` is null"
    verify: {mode: quote, needle: "silently drops every", volatility: stable}
    tags: [sql, null, silent-failure]

  - id: l03-q02
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l03-o2]
    prompt: |
      A mote dropped half its readings. You compute `avg(value)` over its rows.
      What do you get?
    options:
      - "An average over the readings that are present, with the missing ones simply absent from it"
      - "An average that treats missing readings as zero, biasing it downward"
      - "Null, because any aggregate over a column containing nulls is null"
      - "An error, unless the nulls are filtered out first"
    answer: "An average over the readings that are present, with the missing ones simply absent from it"
    evidence: |
      `count(*)` counts rows while `count(value)` counts only non-null ones, and
      `avg(value)` averages only the readings that are present. So the mote is
      not penalized in the average unless you have separately counted how many it
      reported. The habit worth forming is to carry a completeness count next to
      any aggregate over sensor data, because the aggregate alone cannot tell you
      whether it summarizes everything or half of it.
    source:
      file: lectures/l03/notes.md
      heading: "NULL is not a value, and three-valued logic will surprise you"
      quote: "averages only the readings that are present"
    verify: {mode: quote, needle: "only the readings that are present", volatility: stable}
    tags: [sql, aggregates, null]

  - id: l03-q03
    kind: locus_of_control
    rung: 3
    difficulty: 2
    objectives: [l03-o1]
    prompt: |
      Your experiment metadata records a different, unpredictable set of fields
      for every run. You are putting it in PostgreSQL and the schema keeps
      changing.

      What does that tell you?
    options:
      - "That the schema needs a JSON column, which restores flexibility inside the relational model"
      - "That this is exactly the territory where the rigid schema stops helping and document stores earn their place"
      - "That the runs should be normalized further, into a table per field type"
      - "That migrations should be automated, since the schema churn is a tooling problem"
    answer: "That this is exactly the territory where the rigid schema stops helping and document stores earn their place"
    evidence: |
      The same schema that protected your readings table is expensive to change
      once it is large, and a migration against a nine-million-row table in a live
      deployment is a real operation with real risk. Heterogeneous metadata is the
      case where rigidity stops paying, and recognizing it is the point: the
      relational model is a default, not a universal answer. A JSON column is a
      genuine option and it is the relational model conceding the argument rather
      than winning it.
    source:
      file: lectures/l03/notes.md
      heading: "The schema is rigid, and rigidity has a price"
      quote: "the rigid schema stops helping and starts fighting you"
    verify: {mode: quote, needle: "stops helping and starts fighting you", volatility: stable}
    tags: [schema, tradeoffs]

  - id: l03-q04
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l03-o1]
    prompt: |
      Why store sensor data long (one row per reading) rather than wide (one
      column per sensor)?
    options:
      - "Long tables compress better, so the storage cost is lower at scale"
      - "Adding a sensor is a new row rather than a schema change, and the schema stops depending on which instruments exist"
      - "Long tables are faster to query, since the index fits in memory"
      - "Wide tables cannot represent timestamps consistently across sensors"
    answer: "Adding a sensor is a new row rather than a schema change, and the schema stops depending on which instruments exist"
    evidence: |
      A wide table encodes your current instrument list into the schema, so
      commissioning a sensor becomes a migration and decommissioning one leaves a
      column of nulls forever. Long tables decouple the two. The cost is real and
      worth knowing: queries that want several channels side by side now need a
      pivot or a join, which is why the session spends time on window functions
      and time bucketing.
    source:
      file: lectures/l03/notes.md
      heading: "The relational model, and why long beats wide"
      quote: "why long beats wide"
    verify: {mode: quote, needle: "long beats wide", volatility: stable}
    tags: [schema, time-series]

  - id: l03-q05
    kind: claim_vs_source
    rung: 2
    difficulty: 3
    objectives: [l03-o1]
    prompt: |
      "We used a timestamp column, so the times are correct."

      What did 30 June 2012 demonstrate?
    options:
      - "That timezone conversion is the main hazard, and UTC storage solves it"
      - "That a leap second is a real event a timestamp type has to survive, and systems assuming fixed-length days failed"
      - "That NTP drift accumulates faster than most systems account for"
      - "That millisecond precision is insufficient for high-rate sensor data"
    answer: "That a leap second is a real event a timestamp type has to survive, and systems assuming fixed-length days failed"
    evidence: |
      The case is in the notes because a type that carries physical meaning has
      to cope with how the physical quantity actually behaves, and time is the one
      everybody assumes is simple. Timezones are a real hazard and a different
      one. The general shape is the session's argument about types: a column
      declared with the right type is carrying a claim about the world, and the
      world occasionally declines to cooperate.
    source:
      file: lectures/l03/notes.md
      heading: "Case study: the leap second of 30 June 2012"
      quote: "leap second"
    verify: {mode: quote, needle: "leap second", volatility: stable}
    tags: [types, time, case-study]

  - id: l03-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l03-o1]
    prompt: |
      When should a measured quantity be stored as `numeric` rather than
      `double precision`?
    options:
      - "Always, since numeric is exact and double precision is approximate"
      - "When exactness at the stored precision matters more than arithmetic speed, for instance for money or a regulated tolerance"
      - "When the values span many orders of magnitude, which double precision handles poorly"
      - "Never for sensor data, since numeric cannot represent scientific notation"
    answer: "When exactness at the stored precision matters more than arithmetic speed, for instance for money or a regulated tolerance"
    evidence: |
      "Always" is the tempting answer and it is wrong: `numeric` is materially
      slower and most sensor readings are approximate measurements of a
      continuous quantity, where double precision is the honest representation.
      The session is also blunt that this does not save you from floating point
      elsewhere: a value read into Python as a float is a float again, whatever
      the column said.
    source:
      file: lectures/l03/notes.md
      heading: "numeric versus double precision"
      quote: "numeric versus double precision"
    verify: {mode: quote, needle: "numeric versus double precision", volatility: stable}
    tags: [types, precision]

  - id: l03-q07
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l03-o1]
    prompt: |
      A column is declared `double precision NOT NULL`. A reading arrives as
      -9999, the instrument's error sentinel.

      What happens?
    options:
      - "The insert is rejected, since -9999 is outside any plausible physical range"
      - "It is stored, because a typed column is still not a validated column"
      - "It is coerced to null, since the sentinel is recognized by the driver"
      - "It is stored and flagged, since PostgreSQL tracks out-of-range values"
    answer: "It is stored, because a typed column is still not a validated column"
    evidence: |
      The type says "this is a number that is present". It says nothing about
      whether the number is physically possible. Sentinels like -9999 are
      extremely common in instrument data and they pass every type check, which
      is why the session insists on `CHECK` constraints for range and on
      validation as a separate layer. This is the same lesson as the units
      assertion in L7: the declaration is not the check.
    source:
      file: lectures/l03/notes.md
      heading: "A typed column is still not a validated column"
      quote: "A typed column is still not a validated column"
    verify: {mode: quote, needle: "still not a validated column", volatility: stable}
    tags: [types, validation]

  - id: l03-q08
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l03-o3]
    prompt: |
      A time-range query over a large readings table is slow. You add an index
      and it is still slow.

      What tells you why?
    options:
      - "The query plan, from `EXPLAIN ANALYZE`, which shows whether the index was used and what it cost"
      - "The table statistics, which show whether the index is selective enough to help"
      - "The query duration across repeated runs, which distinguishes cold cache from a bad plan"
      - "The index size on disk, which indicates whether it fits in memory"
    answer: "The query plan, from `EXPLAIN ANALYZE`, which shows whether the index was used and what it cost"
    evidence: |
      Every other option is a real diagnostic and each answers a narrower
      question. The plan is the one that tells you what the database actually
      decided to do, which is frequently not what you assumed when you added the
      index: a predicate that wraps the column in a function, or a range broad
      enough that a sequential scan is genuinely cheaper, both produce a
      correctly-ignored index.
    source:
      file: lectures/l03/notes.md
      heading: "Making range queries fast: indexes and EXPLAIN ANALYZE"
      quote: "EXPLAIN ANALYZE"
    verify: {mode: quote, needle: "EXPLAIN ANALYZE", volatility: stable}
    tags: [indexing, performance]

  - id: l03-q09
    kind: mechanism_recall
    rung: 5
    difficulty: 3
    objectives: [l03-o2]
    prompt: |
      Close the notes. Write down the SQL constructs you would reach for to
      answer engineering questions over a long sensor table, and say what each
      one is for. Stop when you stall, and note where.
    checklist:
      - text: "Joins, to bring instrument or run metadata alongside readings"
        needle: "joins"
      - text: "GROUP BY, to aggregate per mote, per run, per day"
        needle: "GROUP BY"
      - text: "Window functions, for rolling and lagged quantities without collapsing rows"
        needle: "window functions"
      - text: "Time bucketing, to aggregate onto a regular grid"
        needle: "time bucketing"
    answer: null
    evidence: |
      The one most people stall on is window functions, and it is the one that
      makes a long table workable: rolling means, differences from the previous
      reading, and rank within a run are all things a `GROUP BY` cannot express
      because it collapses the rows you still need. Where you stalled is your
      reading assignment.
    source:
      file: lectures/l03/notes.md
      heading: "SQL that answers engineering questions"
      quote: "The most powerful additions for time-series are **window functions**"
    verify:
      mode: manual
      needle: "window functions"
      volatility: stable
      exempt_reason: >-
        Free-text recall; each checklist entry is verified against the source
        individually rather than the answer being matched as a whole.
    tags: [sql, self-test]

  - id: l03-q10
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l03-o3]
    prompt: |
      Open [`l03-sql-timeseries.ipynb`](../lectures/l03/l03-sql-timeseries.ipynb)
      and run the same range query with and without the index, reading the plan
      each time.

      What changes in the plan?
    options:
      - "Only the timing; the plan is identical because the planner is deterministic"
      - "The scan type changes, and the plan shows whether the index was actually chosen rather than merely present"
      - "The row estimates change, since an index updates the table statistics"
      - "Nothing visible; index use is reported only in the server log"
    answer: "The scan type changes, and the plan shows whether the index was actually chosen rather than merely present"
    evidence: |
      An index that exists and an index that is used are different things, and
      the plan is the only place the difference is visible. This is the same
      discipline as the rest of the course: the artifact exists is not the same
      claim as the artifact works, and you check by looking at what actually
      happened rather than at what you configured.
    source:
      file: lectures/l03/notes.md
      heading: "Making range queries fast: indexes and EXPLAIN ANALYZE"
      quote: "indexes and EXPLAIN ANALYZE"
    verify: {mode: quote, needle: "indexes and EXPLAIN ANALYZE", volatility: stable}
    tags: [indexing, notebook]
