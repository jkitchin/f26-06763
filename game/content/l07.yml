  - id: l07-q01
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l07-o1]
    prompt: |
      You ramp a feed valve up and back down without waiting, log it, and plot flow
      against valve position. The points fall on a loop rather than a line.

      What is the loop telling you?
    options:
      - "The flow depends on where the flow just was"
      - "One of the two sensors is out of calibration"
      - "The valve and the flow are simply unrelated"
      - "The record covers too short a period"
    answer: "The flow depends on where the flow just was"
    evidence: |
      The same valve position shows up twice with two different flows, once while the
      valve is opening and once while it is closing. On this loop a valve at 57.6 %
      sits at 8.578 going up and 8.997 coming down, and would settle at 8.790 if left
      alone. Nothing is broken. The loop is dynamic, so it is still catching up with
      an input that keeps moving.
    source:
      file: lectures/l07/notes.md
      heading: "The loop, and the data we have of it"
      quote: "Waiting erases the history on purpose."
    verify: {mode: quote, needle: "Waiting erases the history on purpose", volatility: stable}
    tags: [dynamics, lag-feature]

  - id: l07-q02
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l07-o1]
    prompt: |
      You plot the same two columns from a year of plant archive, taken while the loop
      was in automatic. Instead of a loop you get a diffuse cloud.

      What does that tell you about the record?
    options:
      - "The controller never let the valve ramp, so the record cannot show the loop"
      - "The archive is sampled too slowly to resolve anything"
      - "The flow meter and the valve are on different time bases"
      - "The loop is at steady state, so there is nothing to see"
    answer: "The controller never let the valve ramp, so the record cannot show the loop"
    evidence: |
      Under automatic control the valve rattles around the operating point every
      sample instead of ramping, so no branch of a loop ever gets traced out. Measured
      on one run of the archive, the valve's standard deviation is 1.98 % and its
      correlation with the flow is +0.69: a trend, and no hysteresis. This is the same
      fact as the closed-loop identification problem at the end of the session, and it
      is why the session simulates the open-loop record rather than looking for one in
      the archive.
    source:
      file: lectures/l07/notes.md
      heading: "The loop, and the data we have of it"
      quote: "the logged data can't draw the loop at all"
    verify: {mode: quote, needle: "can't draw the loop at all", volatility: stable}
    tags: [closed-loop, dynamics]

  - id: l07-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l07-o2]
    prompt: |
      A feature column is **leaking**. What does that mean?
    options:
      - "It carries information you would not have had when the prediction was due"
      - "It has been scaled differently from the other columns"
      - "It has more missing values than the rows around it"
      - "It came from an instrument that was out of calibration"
    answer: "It carries information you would not have had when the prediction was due"
    evidence: |
      Ask it of every column: would this value have been available at the moment the
      prediction was due? That one question catches the direction of the shift, a lab
      assay logged against sampling time rather than result time, and a `faultNumber`
      column that somebody wrote down after the run. In control the same property has
      a different name: a feature that uses only the present and the past is causal.
    source:
      file: lectures/l07/notes.md
      heading: "Data leakage"
      quote: "**Data leakage** happens when a model is trained on information that would not be available at\nthe time it has to make a prediction."
    verify: {mode: quote, needle: "would not be available at", volatility: stable}
    tags: [leakage]

  - id: l07-q04
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l07-o2]
    prompt: |
      A log holds 400 independent simulation runs laid end to end, sorted and ready.
      You build a lag column with `shift(1)` and no `.over()`.

      What have you just done?
    options:
      - "Given each run's first row the previous run's last reading"
      - "Reversed the direction of the shift"
      - "Dropped the first row of every run in the log"
      - "Nothing, because sorting by run already handles it"
    answer: "Given each run's first row the previous run's last reading"
    evidence: |
      The notes print the boundary row: the first row of the second experiment claims a previous
      `xmeas_4` of 8.9419, which is the last reading of the experiment before, from a
      different simulated plant. Feed flow really is around 9 in both, so the
      fabricated value is plausible, nothing raises an error, and one corrupted row
      per experiment sits in the training data forever.
    source:
      file: lectures/l07/notes.md
      heading: "Record boundaries and the group key"
      quote: "it hands the first row of one experiment the last reading of the one before"
    verify: {mode: quote, needle: "the last reading of the one before", volatility: stable}
    tags: [run-boundary, polars]

  - id: l07-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l07-o2]
    prompt: |
      `shift(1)` leaves a null in the first row of each record, because that row has no
      previous value.

      What should you do with those rows?
    options:
      - "Drop them"
      - "Fill them with zero"
      - "Fill them with the column mean"
      - "Carry the next value backwards"
    answer: "Drop them"
    evidence: |
      Their past lies outside the run, so there is nothing to recover. Filling with zero
      invents a loop at zero flow and asks the fit to explain a step that never
      happened. Losing one row per run costs nothing.
    source:
      file: lectures/l07/notes.md
      heading: "The first row of a run"
      quote: "Don't fill it with zero, which invents a loop at zero flow"
    verify: {mode: quote, needle: "invents a loop at zero flow", volatility: stable}
    tags: [feature-table, nulls]

  - id: l07-q06
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l07-o3]
    prompt: |
      A fit on three-minute samples returns `a = 0.7529` and `b = 0.0322`.

      What do those two numbers become?
    options:
      - "A time constant of 10.6 min and a gain of 0.1304"
      - "An accuracy of 75% and a prediction error of 0.03"
      - "A 10.6 minute delay before the valve acts on the flow"
      - "Nothing at all until you have a held-out test set"
    answer: "A time constant of 10.6 min and a gain of 0.1304"
    evidence: |
      `tau = -dt / ln(a)` and `K = b / (1 - a)`. The output is minutes and flow per
      percent of valve, which a plant engineer who knows that feed line can check
      against what they know about it. An accuracy score cannot be checked that way,
      which is the reason this session converts the coefficients at all.
    source:
      file: lectures/l07/notes.md
      heading: "Least squares and the conversion to physics"
      quote: "**tau = 10.6 min** and **K = 0.1304**"
    verify: {mode: quote, needle: "tau = 10.6 min", volatility: measured}
    tags: [least-squares, physics]

  - id: l07-q07
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l07-o3]
    prompt: |
      Several archive channels come back with `a` near 0.99, which converts to a time
      constant of about 298 minutes on a three-minute sampler.

      What should you conclude?
    options:
      - "The samples sit too close together for those loops"
      - "Those loops genuinely take several hours to settle down"
      - "The fit needs more lag columns to converge"
      - "Those channels should be dropped as broken"
    answer: "The samples sit too close together for those loops"
    evidence: |
      Consecutive rows are near-copies, `a` lands in the steep part of the conversion,
      and the fitted time constant mostly reflects the sampling rate and the noise.
      Treat a fitted `a` above about 0.99 as a warning rather than a result. Reported
      as a score instead, those channels would have looked excellent, because
      predicting that a slow channel does not change is easy.
    source:
      file: lectures/l07/notes.md
      heading: "Sensitivity of the time constant to `a`"
      quote: "Three-minute samples are far too close together for a loop that takes hours"
    verify: {mode: quote, needle: "far too close together for a loop that takes hours", volatility: stable}
    tags: [sampling, diagnostics]

  - id: l07-q08
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l07-o3]
    prompt: |
      You fit a stretch where the valve never moved off 57.6 %. The gain comes
      back as +0.000 and the design matrix has rank 1 instead of 2.

      What went wrong?
    options:
      - "Nothing; the record has no evidence about the valve"
      - "The fit failed to converge and needs a restart"
      - "The valve column was accidentally dropped"
      - "The mean should not have been subtracted"
    answer: "Nothing; the record has no evidence about the valve"
    evidence: |
      The valve did nothing, so the data cannot say what it would have done, and the
      solve reports that honestly with no warning attached. No feature and no larger
      model recovers it, because the information was never collected. Note how little
      movement is needed: a single step is enough to bring the design matrix back to
      rank 2. Only a genuinely constant input fails.
    source:
      file: lectures/l07/notes.md
      heading: "The valve that never moved"
      quote: "The valve did nothing, so nothing in the file says what would\nhave happened if it had."
    verify: {mode: quote, needle: "nothing in the file says what would", volatility: stable}
    tags: [excitation, limitations]

  - id: l07-q09
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l07-o3]
    prompt: |
      Fitted on a year of ordinary plant history, a model says more cooling water goes
      with a hotter reactor.

      Is the model wrong, the data wrong, or the question wrong?
    options:
      - "The question; the controller caused that correlation"
      - "The model; it needs a longer record to settle"
      - "The data; the cooling water sensor reads backwards"
      - "The model; the sign should be flipped by hand"
    answer: "The question; the controller caused that correlation"
    evidence: |
      The temperature controller opened the cooling water valve because the reactor got
      hot, so in the record every increase in cooling follows an increase in
      temperature. You wanted to know what happens when *you* open the valve, which is
      the opposite causal direction, and a tightly controlled record holds almost no
      evidence about it. Do not repair the sign by deleting terms. Move the setpoint,
      or add a small deliberate excitation.
    source:
      file: lectures/l07/notes.md
      heading: "Closed-loop identification"
      quote: "The data is right and the question is wrong."
    verify: {mode: quote, needle: "the question is wrong", volatility: stable}
    tags: [closed-loop, case-study]

  - id: l07-q10
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l07-o1]
    prompt: |
      A step test sets the valve, waits for the flow to settle, and records the pair.
      Why does that need no column holding the past?
    options:
      - "Waiting for steady state erases the history on purpose"
      - "Step tests use more precise instruments than a historian"
      - "A step test records fewer points"
      - "At steady state the loop has no dynamics to begin with"
    answer: "Waiting for steady state erases the history on purpose"
    evidence: |
      Whatever the loop was doing before, once it settles the only thing left is the
      relationship between input and output, so the past carries no extra information.
      Normal operation cannot afford to wait, so the history is still in there, and a
      table that omits it is asking a question the data cannot answer. Note the third
      distractor: the loop is dynamic either way, it has simply finished responding.
    source:
      file: lectures/l07/notes.md
      heading: "The loop, and the data we have of it"
      quote: "Waiting erases the history on purpose."
    verify: {mode: quote, needle: "erases the history on purpose", volatility: stable}
    tags: [steady-state, dynamics]

  - id: l07-q11
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l07-o2]
    prompt: |
      The plant archive holds 20 fault types, each simulated 20 times, so one
      experiment is the pair `(faultNumber, simulationRun)`. A classmate writes:

      ```python
      pl.col("xmeas_4").shift(1).over("simulationRun")
      ```

      They check the column, see nulls in it, and move on. What is wrong?
    options:
      - "It groups by half the key, so most boundaries are still wrong"
      - "Nothing, since `simulationRun` already separates the experiments"
      - "`.over()` reverses the direction of the shift"
      - "`shift(1)` cannot be combined with `.over()` in Polars"
    answer: "It groups by half the key, so most boundaries are still wrong"
    evidence: |
      Run 1 of fault 1 and run 1 of fault 4 are different plants that share a run
      number, so grouping by `simulationRun` alone merges them. Count the nulls: a
      correct shift leaves exactly one per experiment, so 400 of them. `shift(1)`
      alone leaves 1 and fixes no boundaries, `.over("simulationRun")` leaves 20 and
      fixes 19 of 399, and only `.over("faultNumber", "simulationRun")` fixes all of
      them. Half a group key is more dangerous than none, because the nulls make it
      look like it worked.
    source:
      file: lectures/l07/notes.md
      heading: "Record boundaries and the group key"
      quote: "It's grouping by half the key."
    verify: {mode: quote, needle: "grouping by half the key", volatility: stable}
    tags: [run-boundary, polars]

  - id: l07-q12
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l07-o2]
    prompt: |
      A dropout leaves a hole in a dataset holding a valve position `u` and the flow
      `y` that valve sets. You put the rows back on a fixed grid, and now some rows are
      null in both columns.

      Which fill is defensible?
    options:
      - "Forward-fill `u` and leave `y` null"
      - "Forward-fill both, since a gap is a gap"
      - "Forward-fill `y` and leave `u` null"
      - "Fill both with the column mean so nothing is missing"
    answer: "Forward-fill `u` and leave `y` null"
    evidence: |
      A control system genuinely holds its last commanded valve position until it
      writes a new one, so the carried value is what physically happened. Nothing held
      the flow steady: an invented `y` becomes a row you then fit against, and least
      squares cannot tell a measurement from a guess. Keep a mask column either way,
      because a table that cannot say which of its numbers were measured is a table
      nobody can audit.
    source:
      file: lectures/l07/notes.md
      heading: "Resampling and fill policy"
      quote: "Least squares cannot tell\nan invented number from a measured one."
    verify: {mode: quote, needle: "cannot tell", volatility: stable}
    tags: [resampling, data-quality]
