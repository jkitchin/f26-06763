# L20 item bank for reinforcement learning: where it sits by the feedback the learner gets,
# bandits as the bridge from Bayesian optimization, the Markov decision process, Q-learning on
# the PyCSE tank against a tuned PID, rewards the agent games, cliff walking, deep RL and the
# tools, the case studies, and the limitations. Every item quotes lectures/l20/notes.md; the
# numbers come from lectures/l20/figures/make_figures.py.
#
# Version 3 replaces versions 1 and 2, which were the agents lecture that used to be L20 (it is
# in lectures/l19/agents/ until the L19 rewrite). The archive in pools/l20.json keeps them, so
# PDFs issued against them still verify.

