  # --- o1: vocabulary ------------------------------------------------------------------------------

  - id: l20-q01
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l20-o1]
    prompt: |
      The tank agent uses a discount factor γ = 0.95, one decision every 0.5 time units. Roughly
      how far ahead does it look?
    options:
      - "One step, because Q-learning only ever looks at the next state"
      - "About 20 steps, or 10 time units"
      - "The whole 100-step episode, equally weighted at every step"
      - "About 95 steps, one for each hundredth of the discount"
    answer: "About 20 steps, or 10 time units"
    evidence: |
      A reward k steps away counts γ^k as much as one now, so the effective horizon is roughly
      1/(1 − γ) = 20 steps. That is four times as long as the tank takes to fill from 2 to 5 at
      full inflow, long enough to see the overshoot an early valve opening causes.
    source:
      file: lectures/l20/notes.md
      heading: "The Markov decision process"
      quote: |
        that is 20 steps, or 10 time units
    verify: {mode: quote, needle: "20 steps, or 10 time units", volatility: stable}
    tags: [discount, horizon]

  - id: l20-q02
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l20-o1]
    prompt: |
      If you knew the Q-function of the best policy, Q*(s, a), how would you act?
    options:
      - "Sample actions in proportion to their Q-values in each state"
      - "In each state, take the action with the largest Q*(s, a)"
      - "Take the action with the largest immediate reward in each state"
      - "Keep exploring at random one time in five, forever"
    answer: "In each state, take the action with the largest Q*(s, a)"
    evidence: |
      Q*(s, a) is the expected return from taking a in s and then acting optimally. With it in hand,
      acting well is a lookup: the best action is the one with the largest value.
    source:
      file: lectures/l20/notes.md
      heading: "Values and the Bellman equation"
      quote: |
        acting well would be
        trivial: in each state, take the action with the largest $Q^\ast(s,a)$.
    verify: {mode: quote, needle: "acting well would be trivial", volatility: stable}
    tags: [q-function]

  - id: l20-q03
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l20-o1]
    prompt: |
      A team's learned reactor controller behaves strangely. Its state is the reactor temperature
      alone, and the catalyst has been deactivating for a week. What is the first thing to check?
    options:
      - "The learning rate, because a deactivating catalyst needs a larger α"
      - "Whether the state leaves out something the dynamics depend on"
      - "The discount factor, which should be 1 for a continuous process"
      - "Whether the reward is scaled to between 0 and 1"
    answer: "Whether the state leaves out something the dynamics depend on"
    evidence: |
      The Markov property is a modelling choice. Temperature alone does not determine the next
      temperature when the catalyst is changing, so the state has to include the deactivation, or
      something that tracks it.
    source:
      file: lectures/l20/notes.md
      heading: "The Markov decision process"
      quote: |
        When a learned controller behaves strangely, a state that leaves out something
        the dynamics depend on is one of the first things to check.
    verify: {mode: quote, needle: "a state that leaves out something", volatility: stable}
    tags: [markov-property]

  - id: l20-q04
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l20-o1]
    prompt: |
      A corridor of eight cells pays +1 only at the right end. With one-step Q-learning updates,
      how does that reward reach the first cell?
    options:
      - "All at once, after the first episode that reaches the end"
      - "One cell further back per episode, discounted each time"
      - "Never, because cells far from the reward are never updated"
      - "Only if the reward is moved to the start of the corridor"
    answer: "One cell further back per episode, discounted each time"
    evidence: |
      Each update reads the next cell's estimate through the max term, which is bootstrapping. So
      the news travels back one cell per episode. Monte Carlo, which waits for the whole return,
      fills the corridor in one episode at the price of variance.
    source:
      file: lectures/l20/notes.md
      heading: "Values and the Bellman equation"
      quote: |
        Each
        episode carries the news back one more cell, discounted by $\gamma$ each time.
    verify: {mode: quote, needle: "carries the news back one more cell", volatility: stable}
    tags: [credit-assignment, bootstrapping]

  # --- o2: where reinforcement learning sits -----------------------------------------------------

  - id: l20-q05
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l20-o2]
    prompt: |
      A run with catalyst B gives a yield of 70%. What kind of feedback is that, and what does it
      leave out?
    options:
      - "Instructive: it names the right catalyst for this reaction"
      - "Evaluative: it scores B and says nothing about the catalysts not tried"
      - "Instructive: it is a labelled data point like any regression target"
      - "Evaluative: it ranks every catalyst relative to B at once"
    answer: "Evaluative: it scores B and says nothing about the catalysts not tried"
    evidence: |
      Instructive feedback names the right answer whatever the learner did; every label in L9 and
      L10 is one. Evaluative feedback scores the choice made and nothing else, which is what forces
      a reinforcement learner to explore.
    source:
      file: lectures/l20/notes.md
      heading: "Where reinforcement learning sits in machine learning"
      quote: |
        A yield of 70% tells you that
        catalyst B gave 70%. It does not tell you whether catalyst C would have given 74%.
    verify: {mode: quote, needle: "catalyst B gave 70%", volatility: stable}
    tags: [feedback, landscape]

  - id: l20-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l20-o2]
    prompt: |
      Bayesian optimization (L15) and reinforcement learning both learn from scores. What does
      reinforcement learning have that Bayesian optimization does not?
    options:
      - "A surrogate model linking the choices that were tried"
      - "Actions that change the state the learner faces next"
      - "Noise in the measured outcome of each choice it makes"
      - "An acquisition function trading exploration against exploitation"
    answer: "Actions that change the state the learner faces next"
    evidence: |
      Running a reaction at 80 °C today does not change what 90 °C will give tomorrow, so each
      experiment is a fresh decision. In reinforcement learning the action changes the state, and
      through it every later reward.
    source:
      file: lectures/l20/notes.md
      heading: "Where reinforcement learning sits in machine learning"
      quote: |
        Its choices do not
        change the system, though.
    verify: {mode: quote, needle: "change the system, though", volatility: stable}
    tags: [landscape, bayesian-optimization]

  - id: l20-q07
    kind: claim_vs_source
    rung: 3
    difficulty: 2
    objectives: [l20-o2]
    prompt: |
      "Reinforcement learning from human feedback lets a person grade every output the model
      writes." What did InstructGPT actually optimize with PPO?
    options:
      - "Labelers' scores, collected live for every output during training"
      - "A reward model trained to predict which output labelers would prefer"
      - "The next-token loss on a larger set of human-written answers"
      - "The number of tokens in each answer, as a proxy for helpfulness"
    answer: "A reward model trained to predict which output labelers would prefer"
    evidence: |
      The paper trains a reward model on labelers' comparisons and then uses it as the reward for
      PPO. The environment is a learned stand-in for a person's judgement, so it can be gamed like
      any other reward.
    source:
      file: lectures/l20/notes.md
      heading: "Where it meets language models"
      quote: |
        The environment is a learned reward
        model standing in for a person's judgement
    verify: {mode: quote, needle: "standing in for a person's judgement", volatility: stable}
    tags: [rlhf]

  - id: l20-q08
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l20-o2]
    prompt: |
      Five catalysts, 500 runs. Greedy choice (always the best average so far) against ε-greedy
      with ε = 0.1: what happened to greedy?
    options:
      - "It found the best catalyst in every run, faster than ε-greedy did"
      - "It settled on a wrong catalyst in about a quarter of runs"
      - "It spread its runs evenly over all five catalysts"
      - "It had the highest regret of all four strategies"
    answer: "It settled on a wrong catalyst in about a quarter of runs"
    evidence: |
      One unlucky early yield from catalyst C convinced it that C was poor, and it never tried C
      again: stuck in 27% of runs. ε-greedy never got stuck but had the highest regret, 884 points,
      because it kept pulling random arms.
    source:
      file: lectures/l20/notes.md
      heading: "Bandits: the bridge from Bayesian optimization"
      quote: |
        Greedy settles on a wrong catalyst in 27% of runs
    verify: {mode: quote, needle: "wrong catalyst in 27% of runs", volatility: measured}
    tags: [bandit, exploration]

  - id: l20-q09
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l20-o2]
    prompt: |
      Yields spread by about 8 points per run. A student copies UCB's c = 2 from Sutton and
      Barto's examples. In 16% of runs it locks onto a wrong catalyst. What is wrong?
    options:
      - "UCB cannot work when rewards are noisy, so Thompson sampling is required"
      - "c has the units of the reward; 2 is small next to a spread of 8"
      - "c should shrink over time, and a constant value never converges"
      - "Five arms are too few for UCB's logarithmic bonus to apply"
    answer: "c has the units of the reward; 2 is small next to a spread of 8"
    evidence: |
      The textbook's rewards have a spread of about 1. Setting c to the noise standard deviation,
      8, cut the stuck runs to under 1%. L15 wrote UCB as μ + κσ so the model's uncertainty
      carries the units.
    source:
      file: lectures/l20/notes.md
      heading: "Bandits: the bridge from Bayesian optimization"
      quote: |
        The constant has
        the units of the reward
    verify: {mode: quote, needle: "the units of the reward", volatility: stable}
    tags: [bandit, ucb, hyperparameters]

  # --- o3: Q-learning on the tank ----------------------------------------------------------------

  - id: l20-q10
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l20-o3]
    prompt: |
      In the Q-learning update, what is the bracket r + γ max Q(s', a') − Q(s, a)?
    options:
      - "The reward the agent expects at the end of the episode"
      - "The TD error: what the step suggests minus what the table says"
      - "The probability of choosing a random action at this step"
      - "The gradient of the policy with respect to the network weights"
    answer: "The TD error: what the step suggests minus what the table says"
    evidence: |
      The temporal-difference error compares the one-step target with the current estimate, and
      the learning rate α sets how far each sample moves the entry toward it.
    source:
      file: lectures/l20/notes.md
      heading: "Q-learning on a tank"
      quote: |
        what the step suggested the value should
        be, minus what the table said.
    verify: {mode: quote, needle: "minus what the table said", volatility: stable}
    tags: [q-learning, td-error]

  - id: l20-q11
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l20-o3]
    prompt: |
      Why does the tank agent pick a random inflow one time in five (ε-greedy, ε = 0.2)?
    options:
      - "To keep the valve from wearing out in one position"
      - "The table only learns about actions that get tried"
      - "To add noise that makes the learned policy robust to sensors"
      - "Because the PID baseline also uses random perturbations"
    answer: "The table only learns about actions that get tried"
    evidence: |
      An entry for an action that is never taken never moves. Watkins and Dayan's convergence proof
      requires all actions to be sampled repeatedly in all states, so exploration is a mathematical
      requirement as well as a practical one.
    source:
      file: lectures/l20/notes.md
      heading: "Q-learning on a tank"
      quote: |
        because the table can only learn about actions that get
        tried.
    verify: {mode: quote, needle: "only learn about actions that get tried", volatility: stable}
    tags: [epsilon-greedy, exploration]

  - id: l20-q12
    kind: predict_measure
    rung: 2
    difficulty: 3
    objectives: [l20-o3]
    prompt: |
      From one start (h = 2), the trained agent beats a PID loop with hand-picked gains. Then the
      PID is tuned, and both are tested from eight starting levels with ten training seeds. What
      happens?
    predict:
      common_prior: "The agent still wins, since it learned from the tank itself"
    options:
      - "The agent still wins, since it learned from the tank itself"
      - "The tuned PID wins, by about a factor of seven on average"
      - "They tie, because both settle exactly on the setpoint"
      - "The comparison cannot be made, since the agent uses five inflows"
    answer: "The tuned PID wins, by about a factor of seven on average"
    evidence: |
      Over eight starts the agent's error was 1.40 ± 1.31 against 0.19 for the tuned PID. Half the
      seeds matched the tuned PID; the other half failed from at least one start they rarely saw in
      training.
    source:
      file: lectures/l20/notes.md
      heading: "Against PID, compared fairly"
      quote: |
        beats it by a factor of seven on average over the
        eight starts
    verify: {mode: quote, needle: "beats it by a factor of seven", volatility: measured}
    tags: [baseline, pid, seeds]

  - id: l20-q13
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l20-o3]
    prompt: |
      The tank's outflow is k√h with k = 0.5, and the agent chooses inflow from {0, 0.5, 1, 1.5,
      2}. Why does it switch back and forth near the setpoint of 5?
    options:
      - "Its learning rate is too high, so the table never settles"
      - "No allowed inflow holds h = 5; that needs F = 1.118"
      - "The reward penalizes standing still at any single level"
      - "The 20 level bins are too coarse to see the setpoint at all"
    answer: "No allowed inflow holds h = 5; that needs F = 1.118"
    evidence: |
      At steady state F = k√h, so the five inflows hold levels 0, 1, 4, 9 and 16. No policy over
      this action set can hold 5; the best it can do is alternate, which is what the saw-tooth is.
    source:
      file: lectures/l20/notes.md
      heading: "Against PID, compared fairly"
      quote: |
        No policy over this action set can hold the setpoint.
    verify: {mode: quote, needle: "No policy over this action set can hold the setpoint", volatility: stable}
    tags: [action-set, discretization]

  - id: l20-q14
    kind: direction
    rung: 3
    difficulty: 3
    objectives: [l20-o3]
    prompt: |
      To fix the switching, the action set grows from five inflows to nine, with the same 1,000
      training episodes. What happened to the error over eight starts?
    options:
      - "It fell to match the tuned PID, since 1.0 and 1.25 bracket 1.118 closely"
      - "It was 0.99 ± 0.94: 180 entries need more data than 100"
      - "It was unchanged, because the level bins limit accuracy"
      - "It fell to zero, because one of the nine inflows holds h = 5"
    answer: "It was 0.99 ± 0.94: 180 entries need more data than 100"
    evidence: |
      A bigger table needs more experience to fill, and the budget did not change. Discretization
      has a cost on each side, and a continuous action is one reason deep RL methods exist.
    source:
      file: lectures/l20/notes.md
      heading: "Against PID, compared fairly"
      quote: |
        because 180 table entries need
        more experience than 100 and the training budget did not change.
    verify: {mode: quote, needle: "180 table entries need more experience than 100", volatility: measured}
    tags: [action-set, sample-cost]

  - id: l20-q15
    kind: predict_measure
    rung: 2
    difficulty: 2
    objectives: [l20-o3]
    prompt: |
      The tank's reward becomes −|h(t+1) − h(t)|, "keep the level steady". Where does the trained
      agent leave the level?
    predict:
      common_prior: "At the setpoint, 5, where a good controller keeps it"
    options:
      - "At the setpoint, 5, where a good controller keeps it"
      - "At 1, 4 or 9: a level one constant inflow holds"
      - "Empty, at 0, from every starting level it is given"
      - "Wherever it started, by closing the inflow completely"
    answer: "At 1, 4 or 9: a level one constant inflow holds"
    evidence: |
      The reward only penalizes movement, so the agent parks the tank at the nearest
      constant-inflow steady state and leaves it there. The level is steady, the setpoint was never
      in the reward, and the error from 5 is 9.69. This is specification gaming.
    source:
      file: lectures/l20/notes.md
      heading: "Changing the reward"
      quote: |
        it parks the
        tank at whichever constant-inflow steady state is nearest, 1, 4 or 9, and leaves it there.
    verify: {mode: quote, needle: "steady state is nearest, 1, 4 or 9", volatility: measured}
    tags: [specification-gaming, reward]

  # --- o4: cliff walking -------------------------------------------------------------------------

  - id: l20-q16
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l20-o4]
    prompt: |
      SARSA and Q-learning differ in one term of the update. Which?
    options:
      - "SARSA uses a larger learning rate α than Q-learning"
      - "SARSA uses the next action it will take; Q-learning the best one"
      - "SARSA discounts future rewards and Q-learning does not"
      - "SARSA updates only at the end of each complete episode"
    answer: "SARSA uses the next action it will take; Q-learning the best one"
    evidence: |
      SARSA's target is r + γQ(s', a') for the action a' it will actually take, exploration
      included, so it is on-policy. Q-learning's target uses max over a', the greedy action, so it is
      off-policy.
    source:
      file: lectures/l20/notes.md
      heading: "Exploration has a cost: cliff walking"
      quote: |
        That makes SARSA **on-policy**: it learns the value of the policy it is following, random
        exploratory moves included.
    verify: {mode: quote, needle: "random exploratory moves included", volatility: stable}
    tags: [sarsa, on-policy]

  - id: l20-q17
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l20-o4]
    prompt: |
      On cliff walking with ε = 0.1, which method earned more reward per episode while it was
      still learning, and why?
    options:
      - "Q-learning, because it found the shorter 13-step path"
      - "SARSA, about −26 against −49: its path keeps away from the edge"
      - "Neither: both fall off the cliff at the same rate"
      - "Q-learning, because off-policy methods explore less"
    answer: "SARSA, about −26 against −49: its path keeps away from the edge"
    evidence: |
      Q-learning learns the shortest path, along the edge, and its exploratory moves knock it off.
      SARSA learns the value of what it actually does, random moves included, and takes the 17-step
      path across the top.
    source:
      file: lectures/l20/notes.md
      heading: "Exploration has a cost: cliff walking"
      quote: |
        Q-learning earns an average of −49 per episode over the last 100 episodes and SARSA
        −26
    verify: {mode: quote, needle: "over the last 100 episodes and SARSA", volatility: measured}
    tags: [cliff-walking, exploration]

  - id: l20-q18
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l20-o4]
    prompt: |
      A team proposes training a Q-learning controller directly on a running plant, with ε = 0.1,
      learning from its own mistakes. What is the main problem?
    options:
      - "Q-learning cannot learn from data it collected itself"
      - "Exploring happens on the equipment: random moves in unsafe states"
      - "ε = 0.1 is too little exploration to converge on a plant"
      - "The plant's state space is too small for reinforcement learning"
    answer: "Exploring happens on the equipment: random moves in unsafe states"
    evidence: |
      A control system cannot step off a cliff ten percent of the time to find out how far the edge
      is. That is the main reason RL for real equipment is trained in a simulator.
    source:
      file: lectures/l20/notes.md
      heading: "Exploration has a cost: cliff walking"
      quote: |
        and this is the main reason RL for real equipment is trained in a simulator.
    verify: {mode: quote, needle: "trained in a simulator", volatility: stable}
    tags: [safety, simulation]

  # --- o5: when to use it, and reading claims ----------------------------------------------------

  - id: l20-q19
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l20-o5]
    prompt: |
      "DeepMind used reinforcement learning to cut Google's data-centre cooling energy by 40%."
      What do the sources say?
    options:
      - "The 2018 paper confirms a 40% saving from a deep RL agent"
      - "The blog never says RL; the paper is a linear model with MPC, about 9%"
      - "The 40% came from replacing PID loops with a tuned PID controller"
      - "The saving was measured on a simulator and never deployed"
    answer: "The blog never says RL; the paper is a linear model with MPC, about 9%"
    evidence: |
      The 2016 blog reports "up to 40 percent" from neural-network predictions and never uses the
      words. Lazic et al. (2018) learned a linear model from three hours of exploration and used MPC,
      with "the potential to save about 9%".
    source:
      file: lectures/l20/notes.md
      heading: "Data-centre cooling: a number that drifted"
      quote: |
        The post never uses the words "reinforcement learning".
    verify: {mode: quote, needle: "never uses the words", volatility: stable}
    tags: [case-study, reading-claims]

  - id: l20-q20
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l20-o5]
    prompt: |
      A unit has several interacting variables and constraints, and you can fit a dynamic model of
      it. Which tool is usually right?
    options:
      - "Reinforcement learning, because the variables interact"
      - "Model predictive control"
      - "A bandit, one variable at a time, in sequence"
      - "A generative model of past operating data"
    answer: "Model predictive control"
    evidence: |
      MPC fits a model, optimizes the actions over a horizon, applies the first and repeats. With
      a usable model it needs far fewer samples than model-free RL; Recht found policy gradient
      needed thousands of times as many samples as simple nominal control on LQR.
    source:
      file: lectures/l20/notes.md
      heading: "Limitations and trade-offs"
      quote: |
        Several interacting variables, constraints, a model you can fit | MPC
    verify: {mode: quote, needle: "a model you can fit", volatility: stable}
    tags: [mpc, choosing-a-tool]
