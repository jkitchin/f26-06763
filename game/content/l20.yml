# L20 item bank for reinforcement learning: the tank as matrices, choosing and training an action
# by hand, where it sits by the feedback the learner gets, values and planning, Q-learning on the
# PyCSE tank against a tuned PID, rewards the agent games, deep RL and the tools, the case
# studies, and the limitations. Every item quotes lectures/l20/notes.md; the
# numbers come from lectures/l20/figures/make_figures.py.
#
# Version 3 replaces versions 1 and 2, which were the agents lecture that used to be L20 (it is
# rewritten as L19 on 2026-11-03). The archive in pools/l20.json keeps them, so
# PDFs issued against them still verify.
#
# Version 4 (2026-11-04, before release) adds l20-q21 to q23 for the section on the Markov
# decision process as matrices and the exact solution of the 20-bin tank.
#
# Version 5 (2026-11-04, before release) follows the notes' new order, mechanics before
# vocabulary: l20-q24 (reading an action's matrix) and l20-q25 (one Q-learning update by hand),
# and new section headings for the items whose passages moved.
#
# Version 6 (2026-11-04, before release) follows the cut of the bandit and cliff-walking sections
# from the notes: l20-q08 and q09 (bandits) and q16 to q18 (cliff walking, objective l20-o4) are
# gone. Twenty items, so serve 10.

