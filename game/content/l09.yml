  - id: l09-q12
    kind: notebook_run
    rung: 4
    difficulty: 2
    objectives: [l09-o3]
    prompt: |
      Open [`l09-model-selection.ipynb`](../lectures/l09/l09-model-selection.ipynb)
      and run the cross-validation comparison on the airfoil data.

      Compare the random-`KFold` and `GroupKFold` scores for the random forest.
      Which way do they differ, and roughly by how much?
    options:
      - "GroupKFold is lower, by roughly half"
      - "GroupKFold is higher, by roughly half again"
      - "They agree to within the fold noise"
      - "GroupKFold is higher, by more than five times"
    answer: "GroupKFold is higher, by roughly half again"
    evidence: |
      1.76 dB against 2.69 dB, an inflation of 1.52x. The question asks for the
      direction and the rough size rather than the values, because your exact
      numbers depend on the scikit-learn version: 1.8 and 1.9 assign groups to
      folds by different rules with the same signature and the same
      `shuffle=False`, which is documented in this course's own figure scripts as
      having silently changed published numbers.
    source:
      file: lectures/l09/notes.md
      heading: "Measuring what the choice is worth"
      quote: "| random forest | 1.76 dB | 2.69 dB | **1.52×** |"
