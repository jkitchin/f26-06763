  - id: l19-q11
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l19-o1]
    prompt: |
      What makes a system an LLM agent rather than a workflow?
    options:
      - "It uses a larger and more capable model than a workflow would"
      - "The model chooses each next step from the last result"
      - "It calls at least one tool before it writes its final answer"
      - "It answers in structured JSON that your code can read"
    answer: "The model chooses each next step from the last result"
    evidence: |
      An agent calls tools in a loop and decides each next step itself. In a workflow your code fixes the steps. The size of the model and the format of the answer do not decide which one you have.
    source:
      file: lectures/l19/notes.md
      heading: "From one tool call to an agent"
      quote: "After each result it decides the next step itself"
    verify: {mode: quote, needle: "decides the next step itself", volatility: stable}
    tags: [definition, workflow]

  - id: l19-q12
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l19-o1]
    prompt: |
      When is a fixed workflow a better choice than an agent?
    options:
      - "When you know the steps in advance"
      - "When the next step depends on what a tool returns"
      - "When the task needs more than one tool to finish"
      - "When the model must decide which data to look at"
    answer: "When you know the steps in advance"
    evidence: |
      A workflow is cheaper, faster and takes the same path every time. Reach for an agent only when the next step depends on what the tools return.
    source:
      file: lectures/l19/notes.md
      heading: "From one tool call to an agent"
      quote: "when you know the steps in advance: extract fields from a datasheet"
    verify: {mode: quote, needle: "when you know the steps in advance", volatility: stable}
    tags: [workflow]

  - id: l19-q13
    kind: locus_of_control
    rung: 1
    difficulty: 1
    objectives: [l19-o2]
    prompt: |
      In an agent loop, who actually runs a tool?
    options:
      - "The model, as soon as it decides the tool is needed"
      - "Your code, after the model writes a request"
      - "The provider's servers, which run tools for the model"
      - "The tool definition, which the model reads on every call"
    answer: "Your code, after the model writes a request"
    evidence: |
      The model only writes a request: the tool's name and its arguments. Your code, the harness, checks it, runs the tool, and sends the result back.
    source:
      file: lectures/l19/notes.md
      heading: "The loop"
      quote: "The model only writes requests. Every check is a line of your code"
    verify: {mode: quote, needle: "The model only writes requests", volatility: stable}
    tags: [loop, harness]

  - id: l19-q23
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l19-o2]
    prompt: |
      Which of these is a job of the harness, not of the model?
    options:
      - "Choosing which tool to call next, from the last result"
      - "Checking the permission rules before a tool runs"
      - "Writing the arguments of a tool request"
      - "Writing the final answer for the user"
    answer: "Checking the permission rules before a tool runs"
    evidence: |
      The model reads text and writes requests: which tool, which arguments, and the final answer. The harness, the software around it, builds the prompt, runs the tools, checks permissions, manages the context and ends the run.
    source:
      file: lectures/l19/notes.md
      heading: "The harness"
      quote: "checks permissions, manages the context, and decides when the run ends"
    verify: {mode: quote, needle: "checks permissions, manages the context", volatility: stable}
    tags: [harness, definition]

  - id: l19-q29
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o2]
    prompt: |
      On a test of real bug reports, the same model fixed far more bugs once only its loop and its tools were improved. What does this show?
    options:
      - "A newer and larger model would have fixed just as many bugs"
      - "The software around a model changes how well the agent works"
      - "The second set of bug reports must have been easier to fix"
      - "Better tools help small models, but make no difference to large ones"
    answer: "The software around a model changes how well the agent works"
    evidence: |
      SWE-agent kept the model the same and changed only the harness: first a loop, then tools built for an LLM. When an agent fails, look at its harness before you blame the model.
    source:
      file: lectures/l19/notes.md
      heading: "Same model, different harness"
      quote: "Only the harness changed."
    verify: {mode: quote, needle: "Only the harness changed", volatility: stable}
    tags: [harness, evidence]

  - id: l19-q25
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o3]
    prompt: |
      Why does prompt caching make a long agent run cheaper?
    options:
      - "The provider replays the model's earlier answers instead of writing new ones"
      - "Each call starts with the last call's prompt, which the cache can reuse"
      - "The cache compresses the tool results, so each call sends fewer tokens"
      - "Cached calls are sent to a smaller and cheaper model than the others"
    answer: "Each call starts with the last call's prompt, which the cache can reuse"
    evidence: |
      An agent's prompt only grows at the end, so most of each call was already sent by the call before. That repeated start is read from the cache at a fraction of the price. The longer the run, the bigger the saving.
    source:
      file: lectures/l19/notes.md
      heading: "How the cache works"
      quote: "the old prompt is an exact prefix of the new prompt"
    verify: {mode: quote, needle: "exact prefix of the new prompt", volatility: stable}
    tags: [caching, cost]

  - id: l19-q26
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o3]
    prompt: |
      Which rule keeps the prompt cache working in an agent?
    options:
      - "Keep the start of the prompt the same; add new text only at the end"
      - "Put the newest information at the top of the system prompt"
      - "Shorten or delete old messages as the conversation grows longer"
      - "Move to a cheaper model for the later calls of a long run"
    answer: "Keep the start of the prompt the same; add new text only at the end"
    evidence: |
      The cache matches the start of the prompt exactly. Anything that changes the start, or an earlier message, makes everything after it new again. A model switch starts a new cache too.
    source:
      file: lectures/l19/notes.md
      heading: "What breaks the cache"
      quote: "keep the start of the prompt the same, and add new text only at the end."
    verify: {mode: quote, needle: "add new text only at the end", volatility: stable}
    tags: [caching]

  - id: l19-q16
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o4]
    prompt: |
      Your agent keeps calling a tool with the wrong arguments. What do you fix first?
    options:
      - "Switch to a larger model, which makes fewer mistakes with tools"
      - "The tool's description: what it does, its units and its limits"
      - "Raise the step budget so the model gets more tries at the call"
      - "Retry each call automatically until its arguments are accepted"
    answer: "The tool's description: what it does, its units and its limits"
    evidence: |
      To call a tool, the model goes by its definition: the name, the description and the arguments. A vague description makes it guess, so fix the description before you blame the model.
    source:
      file: lectures/l19/notes.md
      heading: "A description is a prompt"
      quote: "A wrong tool or a wrong argument usually means a vague description"
    verify: {mode: quote, needle: "usually means a vague description", volatility: stable}
    tags: [tools, descriptions]

  - id: l19-q31
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o4]
    prompt: |
      The model asks a tool for something the tool cannot do. What should the tool do?
    options:
      - "Raise an exception and stop the program, so nothing else can go wrong"
      - "Return a message saying what was wrong, so the model can retry"
      - "Return an empty result, and let the model carry on with its plan"
      - "Quietly correct the arguments itself, then run the request anyway"
    answer: "Return a message saying what was wrong, so the model can retry"
    evidence: |
      An exception stops your program, and the model never learns what was wrong. A message comes back to the model as the tool's result, so it can read it and fix its request, as the solar agent did when it asked for tilts the mount cannot reach.
    source:
      file: lectures/l19/notes.md
      heading: "Errors the model can read"
      quote: "The message goes back to the model like any other result, so the model can read it and fix its request."
    verify: {mode: quote, needle: "so the model can read it and fix its request", volatility: stable}
    tags: [tools, errors]

  - id: l19-q17
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o4]
    prompt: |
      A note planted in a document tells your agent to make a risky change, and the model asks for it. What reliably stops the change?
    options:
      - "The model will notice that the note was planted, and ignore it"
      - "A check in your code: a person must approve the change"
      - "A sentence in the system prompt saying every change needs approval"
      - "A larger model, which is much harder to fool with planted text"
    answer: "A check in your code: a person must approve the change"
    evidence: |
      An LLM cannot reliably tell your instructions from instructions planted in what it reads. The model can be fooled; a check in your code still asks a person before anything changes.
    source:
      file: lectures/l19/notes.md
      heading: "Guardrails: when the agent can act"
      quote: "runs only after the operator says yes"
    verify: {mode: quote, needle: "runs only after the operator says yes", volatility: stable}
    tags: [guardrails, injection, approval]

  - id: l19-q30
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l19-o4]
    prompt: |
      Your email assistant reads your inbox, summarizes messages from anyone, and can send email. What stops a stranger's email from getting your inbox forwarded to them?
    options:
      - "A line in the system prompt that says never to forward email"
      - "Taking away one of the three: for example, its ability to send email"
      - "A larger model that is better at spotting planted instructions"
      - "Asking the assistant to report every email it sends"
    answer: "Taking away one of the three: for example, its ability to send email"
    evidence: |
      Private data, text from strangers and a way to send data out make the lethal trifecta. With all three, planted text can get your data out; take any one away and the attack fails. A prompt line or a report is text the model may not follow.
    source:
      file: lectures/l19/notes.md
      heading: "Guardrails: when the agent can act"
      quote: "Take away any one of the three, and this attack fails."
    verify: {mode: quote, needle: "Take away any one of the three", volatility: stable}
    tags: [guardrails, trifecta]

  - id: l19-q21
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l19-o5]
    prompt: |
      In a coding agent, which part is enforced by the harness rather than left to the model?
    options:
      - "The instructions file it reads at the start of every session"
      - "Its permission rules: allow, ask or deny each tool"
      - "The plan it writes before it starts editing your files"
      - "Its summary of the conversation after a compaction"
    answer: "Its permission rules: allow, ask or deny each tool"
    evidence: |
      Permissions are checked by the harness before a tool runs. The instructions file is context the model may ignore, not a control.
    source:
      file: lectures/l19/notes.md
      heading: "The parts of a coding agent"
      quote: "enforced by Claude Code, not by the model"
    verify: {mode: quote, needle: "enforced by Claude Code, not by the model", volatility: stable}
    tags: [coding agents, permissions]

  - id: l19-q27
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l19-o5]
    prompt: |
      Late in a long session, your coding agent stops following a rule you gave it in your first message. Where should the rule live?
    options:
      - "In a longer and more emphatic first message next time"
      - "In the instructions file, read at the start of every session"
      - "In a comment at the top of each file the agent is likely to edit"
      - "Nowhere: an agent cannot keep a rule across a long session"
    answer: "In the instructions file, read at the start of every session"
    evidence: |
      Near the limit of the context window the harness compacts the conversation into a summary, and early instructions can get lost. AGENTS.md or CLAUDE.md is loaded at the start of every session. A rule that must hold goes further, into a permission, a hook or a test.
    source:
      file: lectures/l19/notes.md
      heading: "The parts of a coding agent"
      quote: "Put lasting rules in the instructions file."
    verify: {mode: quote, needle: "lasting rules in the instructions file", volatility: stable}
    tags: [coding agents, context]

  - id: l19-q33
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l19-o5]
    prompt: |
      In a coding agent such as Codex, what is most of the code?
    options:
      - "The code that sends prompts to the model and reads back its replies"
      - "The harness around the model: interface, tools, permissions, context"
      - "The model itself: its weights, shipped inside the agent's program"
      - "Tests that check every answer of the model before you ever see it"
    answer: "The harness around the model: interface, tools, permissions, context"
    evidence: |
      As in Lecture 1, where the ML code was a small part of a production ML system, the code that talks to the model is a small part of a coding agent. Most of the engineering is the harness, and that is the part you configure.
    source:
      file: lectures/l19/notes.md
      heading: "The model is a small part of the system"
      quote: "Most of the engineering of an agent is the harness, and that is the part you configure."
    verify: {mode: quote, needle: "Most of the engineering of an agent is the harness", volatility: stable}
    tags: [coding agents, harness]

  - id: l19-q28
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l19-o6]
    prompt: |
      You ask a coding agent to fix a bug in your project. What gives it the best chance of getting the fix right?
    options:
      - "A longer prompt that explains the whole project in detail"
      - "A test it can run that comes back pass or fail"
      - "Permission to run every command without asking first"
      - "A larger context window, so it can read every file at once"
    answer: "A test it can run that comes back pass or fail"
    evidence: |
      The verify step is where an agent finds out it was wrong. With a test it can read the failure, fix the code and run the test again; without one it can only guess. The test is yours, and the agent should not change it.
    source:
      file: lectures/l19/notes.md
      heading: "Give it a check it can run"
      quote: "Give Claude something it can run that comes back pass or fail."
    verify: {mode: quote, needle: "comes back pass or fail", volatility: stable}
    tags: [coding agents, tests]

  - id: l19-q22
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l19-o6]
    prompt: |
      In METR's randomized trial, experienced developers judged how much AI tools sped them up. What did the measurement show?
    options:
      - "They were exactly as much faster as they believed they were"
      - "They felt faster with AI, but in fact took longer"
      - "AI made no measurable difference to how long tasks took"
      - "They were much faster than they themselves believed"
    answer: "They felt faster with AI, but in fact took longer"
    evidence: |
      In METR's 2025 trial, developers expected and felt faster with AI tools, but took longer. People are poor judges of their own speed-up, and the answer changes with the tools and the task: measure on your own tasks.
    source:
      file: lectures/l19/notes.md
      heading: "Do coding agents make you faster?"
      quote: "with AI allowed, tasks took"
    verify: {mode: quote, needle: "with AI allowed, tasks took", volatility: stable}
    tags: [coding agents, evidence]
