  # --- o1: a class from a probability and a threshold; the logistic decision boundary ---------

  - id: l10-q01
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o1]
    prompt: |
      Most classifiers predict a category in two steps. What is the first step?
    options:
      - "Predict a probability for each class, a number between 0 and 1"
      - "Predict the class directly, then estimate how probable that guess is"
      - "Fit a straight line through the training data and round its output"
      - "Compare the new sample against every training sample and vote"
    answer: "Predict a probability for each class, a number between 0 and 1"
    evidence: |
      A classifier does not jump straight to a class label. It first scores how likely each
      class is, a number between 0 and 1, and only afterward turns that number into a decision
      with a threshold.
    source:
      file: lectures/l10/notes.md
      heading: "Classification"
      quote: |
        Predict a **probability** for each class, a number between 0 and 1.
    verify: {mode: quote, needle: "predict a probability for each class", volatility: stable}
    tags: [classification, probability]

  - id: l10-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o1]
    prompt: |
      Logistic regression is fitted on the plant's reactor cooling water valve channel, giving
      w = 7.24 per percent open and b = -314.1. Where does its decision boundary sit?
    options:
      - "43.4% open, where w x + b equals zero"
      - "50.0% open, the midpoint of the probability scale"
      - "41.0% open, the valve's typical position during normal operation"
      - "314.1% open, the value of b read directly"
    answer: "43.4% open, where w x + b equals zero"
    evidence: |
      The boundary sits where the straight-line score w x + b equals zero, so x = -b / w.
      Dividing 314.1 by 7.24 gives 43.4, so the boundary is at 43.4% open, not at the raw value
      of b or at a round number like 50%.
    source:
      file: lectures/l10/notes.md
      heading: "Logistic regression on one channel"
      quote: |
        Training finds $w$ and $b$. Here $w = 7.24$ per % open and $b = -314.1$, so the boundary is
        at $314.1 / 7.24 = 43.4\%$ open.
    verify: {mode: quote, needle: "314.1 / 7.24 = 43.4", volatility: measured}
    tags: [logistic-regression, decision-boundary, tep]

  - id: l10-q03
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o1]
    prompt: |
      A logistic regression trained on one plant channel catches 0% of fault 14, while a
      decision tree using two cuts on that same channel catches most of it. Why does the
      straight cut fail here?
    options:
      - "Its samples fall on both sides of the normal band, and one straight cut can only split off one side"
      - "Fault 14 never appears in the training runs, so no model could learn to catch it"
      - "The valve channel carries no information about fault 14, so only a tree can use it"
      - "A decision tree always beats logistic regression, on every channel and every fault"
    answer: "Its samples fall on both sides of the normal band, and one straight cut can only split off one side"
    evidence: |
      Fault 14 leaves the valve's average unchanged but widens its swings, so roughly half the
      fault samples sit above the normal band and half below it. A single straight cut can only
      exclude one side, so whichever half it flags as normal lets the other half through, while a
      tree's two cuts can bracket the normal band from both sides at once.
    source:
      file: lectures/l10/notes.md
      heading: "When one cut is not enough: fault 14"
      quote: |
        A logistic regression draws **one** straight cut. No single cut separates a narrow band from
        values on both sides of it: it catches **0%** of the fault 14 samples.
    verify: {mode: quote, needle: "it catches 0% of the fault 14 samples", volatility: measured}
    tags: [logistic-regression, decision-tree, tep]

  # --- o2: what each of the four model families minimizes --------------------------------------

  - id: l10-q04
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o2]
    prompt: |
      Logistic regression is trained by minimizing the log loss, also called cross-entropy.
      When is that loss small?
    options:
      - "When the model gives the true class a high probability"
      - "When the model's predicted probability is always exactly 0.5"
      - "When the model predicts the same class for every sample"
      - "When the weighted sum w x + b is exactly zero for every sample"
    answer: "When the model gives the true class a high probability"
    evidence: |
      Log loss penalizes a confident wrong guess heavily and rewards a confident correct one, so
      it comes out small only when the model assigns high probability to whichever class a
      sample truly belongs to.
    source:
      file: lectures/l10/notes.md
      heading: "Four model families as classifiers"
      quote: |
        The loss is small when the model gives the true class a high probability.
    verify: {mode: quote, needle: "the model gives the true class a high probability", volatility: stable}
    tags: [log-loss, cross-entropy]

  - id: l10-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o2]
    prompt: |
      A decision tree box holds 4 normal samples and 1 faulty sample. What is its Gini impurity?
    options:
      - "0.32"
      - "0.68"
      - "0.50"
      - "0.20"
    answer: "0.32"
    evidence: |
      Gini impurity is 1 minus the sum of each class's squared share. With 4 of 5 samples normal
      (0.8) and 1 of 5 faulty (0.2), impurity is 1 minus (0.8 squared plus 0.2 squared), which is
      1 minus 0.68, or 0.32. It is 0 only when a box holds one class alone.
    source:
      file: lectures/l10/notes.md
      heading: "Four model families as classifiers"
      quote: |
        Example: a box with 4 normal samples and 1 faulty one has
        $G = 1 - (0.8^2 + 0.2^2) = 0.32$.
    verify: {mode: quote, needle: "0.8^2 + 0.2^2) = 0.32", volatility: stable}
    tags: [gini-impurity, decision-tree]

  - id: l10-q06
    kind: mcq
    rung: 1
    difficulty: 2
    objectives: [l10-o2]
    prompt: |
      A neural network's last layer produces one score per class. What does the softmax that
      follows guarantee about the numbers it outputs?
    options:
      - "They are positive and add up to 1"
      - "They are rounded to the nearest class label"
      - "Only the single largest score survives; the rest become zero"
      - "They are centered at zero, some positive and some negative"
    answer: "They are positive and add up to 1"
    evidence: |
      Softmax exponentiates each class score and divides by the sum of all the exponentials,
      which forces every output to be positive while the whole set sums to 1, so the outputs
      behave like a probability distribution over the classes.
    source:
      file: lectures/l10/notes.md
      heading: "Four model families as classifiers"
      quote: |
        The probabilities are positive and add up to 1.
    verify: {mode: quote, needle: "positive and add up to 1", volatility: stable}
    tags: [softmax, neural-network]

  - id: l10-q07
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l10-o2]
    prompt: |
      A Gaussian process classifier turns a smooth random function into a probability through a
      link function. Why is it not run on the plant's full 172,500-sample training set?
    options:
      - "Its kernel matrix for that many samples would need 238 GB"
      - "It would overfit, since it has one parameter per training sample"
      - "Its link function only works with a single input channel"
      - "It needs the labels of the test runs during training"
    answer: "Its kernel matrix for that many samples would need 238 GB"
    evidence: |
      A Gaussian process needs a kernel matrix with one row and one column per training sample,
      and the memory that takes grows with the square of the sample count, which is why
      172,500 plant samples would need 238 GB just to hold the matrix.
    source:
      file: lectures/l10/notes.md
      heading: "Four model families as classifiers"
      quote: |
        On the plant it is too big to run: its kernel matrix for 172,500 samples would need 238 GB.
    verify: {mode: quote, needle: "its kernel matrix for 172,500 samples would need 238 gb", volatility: measured}
    tags: [gaussian-process, tep]

  # --- o3: the confusion matrix, accuracy, precision and recall --------------------------------

  - id: l10-q08
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o3]
    prompt: |
      A baseline detector always predicts "normal" and scores 85.4% accuracy on the plant's
      test data. What is its recall?
    options:
      - "Zero, since it never predicts a fault at all"
      - "85.4%, the same as its accuracy"
      - "14.6%, the fraction of samples that are actually faulty"
      - "Undefined, since it never raises a false alarm"
    answer: "Zero, since it never predicts a fault at all"
    evidence: |
      Recall counts what fraction of the real faults a model caught. A detector that never
      predicts fault has zero true positives, so its recall is zero no matter how respectable
      its accuracy looks.
    source:
      file: lectures/l10/notes.md
      heading: "Accuracy, precision and recall"
      quote: |
        **Always normal** never predicts a fault, so TP = 0 and recall is 0.
    verify: {mode: quote, needle: "tp = 0 and recall is 0", volatility: stable}
    tags: [confusion-matrix, recall, baseline]

  - id: l10-q09
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l10-o3]
    prompt: |
      Of the network's 8,313 alarms, 8,300 were real faults, and it caught 8,300 of the 8,640
      real faults in the test data. What are its precision and recall?
    options:
      - "Precision 0.998, recall 0.961, from 8,300 correct alarms and 8,300 of 8,640 faults caught"
      - "Precision 0.961, recall 0.998, from swapping which count divides which total"
      - "Precision 0.998, recall 0.998, since both counts share the same numerator of 8,300"
      - "Precision 0.961, recall 0.961, since precision and recall must always agree"
    answer: "Precision 0.998, recall 0.961, from 8,300 correct alarms and 8,300 of 8,640 faults caught"
    evidence: |
      Precision divides the correct alarms by all the alarms raised, 8,300 over 8,313, which is
      0.998. Recall divides the faults caught by all the faults that exist, 8,300 over 8,640,
      which is 0.961. The two denominators differ, so there is no reason for the two fractions
      to come out equal.
    source:
      file: lectures/l10/notes.md
      heading: "Accuracy, precision and recall"
      quote: |
        The **neural network**: of its 8,313 alarms, 8,300 were real (precision 0.998); of the 8,640
        real fault samples, it caught 8,300 (recall 0.961).
    verify: {mode: quote, needle: "of its 8,313 alarms, 8,300 were real (precision 0.998)", volatility: measured}
    tags: [precision, recall, tep]

  - id: l10-q19
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o3]
    prompt: |
      The plant's classifier calls a sample a fault, but the sample was in fact normal. Which box
      of the confusion matrix does that sample land in?
    options:
      - "False positive (FP): a false alarm"
      - "False negative (FN): a missed fault"
      - "True positive (TP): a fault caught"
      - "True negative (TN): a normal sample left alone"
    answer: "False positive (FP): a false alarm"
    evidence: |
      "Positive" is what the model said, a fault, and "false" says it was wrong. So a normal
      sample the model called a fault is a false positive, a false alarm. A false negative is
      the other mistake: a fault the model called normal.
    source:
      file: lectures/l10/notes.md
      heading: "The confusion matrix"
      quote: |
        **False positive (FP):** a false alarm, a normal sample the model called a fault.
    verify: {mode: quote, needle: "a false alarm, a normal sample the model called a fault", volatility: stable}
    tags: [confusion-matrix, tep]

  # --- o4: moving the decision threshold --------------------------------------------------------

  - id: l10-q10
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o4]
    prompt: |
      A scikit-learn classifier offers both a predict method and a predict_proba method for the
      same sample. What is the difference?
    options:
      - "predict returns a class using a 0.5 threshold; predict_proba returns each class's probability"
      - "predict returns a probability; predict_proba returns a class using a 0.5 threshold"
      - "predict only works with two classes; predict_proba works with any number of classes"
      - "predict needs labeled training data; predict_proba needs no labels at all"
    answer: "predict returns a class using a 0.5 threshold; predict_proba returns each class's probability"
    evidence: |
      predict is the class decision itself, reached by comparing the probability to 0.5 by
      default. predict_proba hands back the probability underneath that decision, which is what
      lets you choose a different threshold instead of accepting the default.
    source:
      file: lectures/l10/notes.md
      heading: "Moving the threshold"
      quote: |
        `predict(X)` returns the **class** of each sample, using a threshold of 0.5.
    verify: {mode: quote, needle: "returns the class of each sample, using a threshold of 0.5", volatility: stable}
    tags: [threshold, scikit-learn]

  - id: l10-q11
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l10-o4]
    prompt: |
      The plant's neural network classifier has its threshold lowered from 0.50 to 0.01. What
      happens to its recall and its precision?
    options:
      - "Recall rises toward 0.977 and precision falls toward 0.697"
      - "Recall falls toward 0.697 and precision rises toward 0.977"
      - "Both rise, since a lower threshold flags more faults without adding false alarms"
      - "Neither changes; the threshold only relabels samples, not the rates"
    answer: "Recall rises toward 0.977 and precision falls toward 0.697"
    evidence: |
      A lower threshold flags more samples as faulty, so it catches more of the real faults,
      raising recall, while also raising more false alarms, lowering precision. There is no
      threshold that improves both at once.
    source:
      file: lectures/l10/notes.md
      heading: "Moving the threshold"
      quote: |
        Lower the threshold and the model raises more alarms: it catches more faults (recall up) and
        makes more false alarms (precision down).
    verify: {mode: quote, needle: "it catches more faults (recall up)", volatility: stable}
    tags: [threshold, precision, recall]

  - id: l10-q12
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o4]
    prompt: |
      Different thresholds trade recall against precision by different amounts. How should a
      team pick which threshold to use?
    options:
      - "From the relative cost of a missed fault against the cost of a false alarm"
      - "Always at 0.5, since that is what scikit-learn uses by default"
      - "At whichever threshold gives the highest accuracy"
      - "At whichever threshold makes precision and recall exactly equal"
    answer: "From the relative cost of a missed fault against the cost of a false alarm"
    evidence: |
      No single threshold is best in general, since lowering it always trades fewer missed
      faults for more false alarms. The right choice depends on what each kind of mistake
      actually costs in the plant, not on a fixed rule or a single summary score.
    source:
      file: lectures/l10/notes.md
      heading: "Moving the threshold"
      quote: |
        There is no best threshold in general. **Choose it from the cost of a missed fault against the
        cost of a false alarm.**
    verify: {mode: quote, needle: "the cost of a missed fault against the cost of a false alarm", volatility: stable}
    tags: [threshold, cost-tradeoff]

  # --- o5: a classifier only recognizes the faults it was trained on ---------------------------

  - id: l10-q13
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o5]
    prompt: |
      A network trained on nine plant faults is then tested on eight faults it never saw during
      training. What happens to its recall across those eight?
    options:
      - "It ranges from 0.924 on one fault down to 0.001 on another"
      - "It stays close to its trained recall of 0.961 on every one of them"
      - "It is exactly zero on all eight, since none of them were in training"
      - "It settles near 0.5 on all eight, since the network is only guessing"
    answer: "It ranges from 0.924 on one fault down to 0.001 on another"
    evidence: |
      Some unseen faults happen to resemble a trained fault closely enough that the network
      still catches most of them, while others resemble nothing it has seen and are almost
      entirely missed. Nothing in its training scores predicts in advance which end a new fault
      will land on.
    source:
      file: lectures/l10/notes.md
      heading: "A classifier only knows the faults it was shown"
      quote: |
        Recall ranges from 0.924 (fault 18) down to 0.001 (fault 19).
    verify: {mode: quote, needle: "ranges from 0.924 (fault 18) down to 0.001 (fault 19)", volatility: measured}
    tags: [unseen-faults, recall, tep]

  - id: l10-q14
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l10-o5]
    prompt: |
      A team reports their network's 96.1% recall on the nine faults it was trained on as proof
      it will catch whatever fault the plant develops next. What is missing from that claim?
    options:
      - "Recognition that it only knows the faults it was trained on, and a test against a fault it never saw"
      - "A comparison against the accuracy of a baseline that always predicts normal"
      - "A second network trained on the same nine faults with a different random seed"
      - "More training samples drawn from the same nine faults it already knows"
    answer: "Recognition that it only knows the faults it was trained on, and a test against a fault it never saw"
    evidence: |
      A recall measured on the faults a network was trained on says nothing about a fault it has
      never seen, since a supervised classifier can only recognize the classes it was trained on.
      The only way to find out how it handles a genuinely new fault is to hold one out on purpose
      and test against it.
    source:
      file: lectures/l10/notes.md
      heading: "A classifier only knows the faults it was shown"
      quote: |
        **A supervised classifier (Lecture 8) can only recognize the classes it was trained on.**
    verify: {mode: quote, needle: "can only recognize the classes it was trained on", volatility: stable}
    tags: [unseen-faults, practitioner]

  # --- o6: an Optuna search tracked in MLflow ---------------------------------------------------

  - id: l10-q15
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l10-o6]
    prompt: |
      Bergstra and Bengio (2012) argue that random search beats a grid search at the same trial
      budget. What is their reasoning?
    options:
      - "Usually only a few hyperparameters matter, and random search tries more distinct values of those"
      - "Random search always evaluates fewer total configurations, leaving a larger budget per trial"
      - "A grid cannot represent an integer-valued hyperparameter such as a tree's maximum depth"
      - "Random search is guaranteed to eventually find the single best configuration"
    answer: "Usually only a few hyperparameters matter, and random search tries more distinct values of those"
    evidence: |
      A grid spends equal effort on every hyperparameter, including ones that barely affect the
      score, so most of its trials repeat values of something that does not matter much. Random
      search, at the same budget, samples many distinct values along every axis, so it explores
      whichever one matters more thoroughly without needing to know which one that is in advance.
    source:
      file: lectures/l10/notes.md
      heading: "Grid search and random search"
      quote: |
        Usually only a few hyperparameters matter much. With the same number of trials, random search
        tries more different values of the ones that matter
    verify: {mode: quote, needle: "random search tries more different values of the ones that matter", volatility: stable}
    tags: [grid-search, random-search]

  - id: l10-q16
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l10-o6]
    prompt: |
      Optuna's default sampler, TPE, uses past trials to guide future ones. In the search on the
      concrete strength dataset, how did its first guided trial compare with random search?
    options:
      - "TPE's first guided trial, trial 11, already scored 8.90 MPa; random search took 38 trials to reach 9.00 MPa"
      - "TPE's first guided trial matched random search exactly, both reaching 8.90 MPa at trial 11"
      - "TPE needed 38 trials to reach 8.90 MPa, the same count random search needed for 9.00 MPa"
      - "Random search reached 8.90 MPa before TPE did, since TPE's early trials are random too"
    answer: "TPE's first guided trial, trial 11, already scored 8.90 MPa; random search took 38 trials to reach 9.00 MPa"
    evidence: |
      TPE builds a model of which hyperparameter values look promising from the trials run so
      far, so once it has a handful of trials to learn from, it can aim its very next guess
      there instead of guessing blindly. Random search has no such model, so it keeps guessing
      uniformly and takes far longer to reach a similarly good score.
    source:
      file: lectures/l10/notes.md
      heading: "Tree-structured Parzen Estimator (TPE)"
      quote: |
        Random search ignores the past; TPE learns from it. In this search, TPE's first guided trial
        (trial 11) already scores 8.90 MPa. Random search needs 38 trials to reach 9.00 MPa.
    verify: {mode: quote, needle: "tpe's first guided trial", volatility: measured}
    tags: [tpe, optuna]

  - id: l10-q17
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l10-o6]
    prompt: |
      An Optuna study finishes, and its winning configuration is refit and registered in
      MLflow's model registry. What does that registry give a teammate that the winning trial's
      own child run does not?
    options:
      - "A name and version they can load later, without needing to remember which trial won"
      - "A live connection that keeps retraining the model as new data arrives"
      - "A guarantee that this model will outperform every future search"
      - "A bundled copy of every losing trial's hyperparameters alongside the winner's"
    answer: "A name and version they can load later, without needing to remember which trial won"
    evidence: |
      A child run is tied to the one trial that produced it, one among possibly dozens, so
      finding the winner later means remembering which run it was. The registry instead gives
      the winning model its own name and version, loadable by anyone later with no memory of the
      search required.
    source:
      file: lectures/l10/notes.md
      heading: "Optuna inside MLflow"
      quote: |
        The best model is refit on all the training rows and **registered** in the MLflow **model
        registry**, with a name and a version anyone can load later.
    verify: {mode: quote, needle: "with a name and a version anyone can load later", volatility: stable}
    tags: [mlflow, model-registry, optuna]

  - id: l10-q18
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l10-o6]
    prompt: |
      A team's Optuna search on the concrete strength dataset finds a best validation RMSE of
      8.90 MPa over many trials, and reports that number as their model's expected performance
      on new data. What is wrong?
    options:
      - "The search chose its winner by that number; the registered winner's test score, 7.41 MPa, is the one to report"
      - "Nothing is wrong; grouped cross-validation already accounts for the search, so 8.90 MPa is unbiased"
      - "The number should have come from a grid search instead of from TPE"
      - "Forty trials is too few for TPE to have found a trustworthy best score"
    answer: "The search chose its winner by that number; the registered winner's test score, 7.41 MPa, is the one to report"
    evidence: |
      The validation score comes from the same rows the search used to pick a winner, so it is
      the number the search was tuned against, not an honest estimate of new data. Scoring the
      registered winner once on mixes that never took part in the search is what gives the
      number to report.
    source:
      file: lectures/l10/notes.md
      heading: "The result on the concrete strength dataset"
      quote: |
        Its winner, registered and loaded back, scores 7.41 MPa on the held-out test mixes. **This is
        the number to report.**
    verify: {mode: quote, needle: "scores 7.41 mpa on the held-out test mixes", volatility: measured}
    tags: [test-once, optuna, concrete-strength]
