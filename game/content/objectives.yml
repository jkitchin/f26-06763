# Learning objectives, lifted verbatim from each lecture's "## Learning objectives"
# section. validate.py re-parses those bullets and fails if `text` has drifted, so
# this file cannot silently fall out of step with the notes.
#
# Do not edit `text` by hand to make a check pass. If the notes changed, the
# objective changed, and the items mapped to it need re-reading.

- id: l17-o1
  lecture: l17
  text: >-
    Build a correct-enough mental model of a decoder-only LLM to reason about failure modes
    (truncation, hallucination, context limits) rather than treat it as a black box.

- id: l17-o2
  lecture: l17
  text: >-
    Understand tokenization concretely: subword units, why "10.5 MPa" or "SS316L" may split
    oddly, and how token counts drive cost/latency.

- id: l17-o3
  lecture: l17
  text: >-
    Understand embeddings as vectors and use cosine similarity to cluster/retrieve
    engineering text.

- id: l09-o1
  lecture: l09
  text: >-
    Frame an engineering question as regression or classification, and name its samples,
    features and target.

- id: l09-o2
  lecture: l09
  text: >-
    Split data into training, validation and test sets, and explain why the test set is used
    only once.

- id: l09-o3
  lecture: l09
  text: >-
    Fit and compare linear, decision tree, neural network and Gaussian process models through
    scikit-learn's common `fit` and `predict` interface, on a table of experiments and on a NARX
    table.

- id: l09-o4
  lecture: l09
  text: >-
    Write the training of a linear model, a neural network and a Gaussian process as an
    optimization problem, and say what each one optimizes.

- id: l09-o5
  lecture: l09
  text: >-
    Use k-fold and grouped cross-validation, validation curves and learning curves to diagnose
    underfitting and overfitting and to choose between models.

- id: l11-o1
  lecture: l11
  text: >-
    Explain what a backward pass computes by applying the chain rule to a small network,
    and why reverse mode suits a scalar loss better than finite differences.

- id: l11-o2
  lecture: l11
  text: >-
    Contrast how PyTorch (a recorded tape that accumulates into `.grad`) and JAX
    (transformations of pure functions) compute the same gradient, and use that to
    explain `zero_grad()`, `no_grad()` and immutable arrays.

- id: l11-o3
  lecture: l11
  text: >-
    Work with tensor shapes, broadcasting, dtypes and devices, and read a shape error.

- id: l11-o4
  lecture: l11
  text: >-
    Write a training loop in PyTorch and in JAX, and say what each of Adam's
    hyperparameters does.

- id: l11-o5
  lecture: l11
  text: >-
    Diagnose a training failure that raises no error by comparing against an exact
    reference, the predict-the-mean baseline, or a grouped split.

- id: l11-o6
  lecture: l11
  text: >-
    Measure whether an accelerator helps before moving a model onto one.

- id: l20-o1
  lecture: l20
  text: >-
    Define reinforcement learning and its vocabulary: agent, environment, state, action,
    reward, policy, return, discount factor, value function, Q-function, episode, and
    exploration against exploitation (ε-greedy).

- id: l20-o2
  lecture: l20
  text: >-
    Place reinforcement learning in the course's map of machine learning by the feedback the
    learner gets: a correct answer (supervised), samples of a distribution (generative), a score
    for one choice with no state (Bayesian optimization and bandits), or a score for a sequence of
    choices that change the system (reinforcement learning).

- id: l20-o3
  lecture: l20
  text: >-
    Implement tabular Q-learning on tank level control and compare it with a tuned PID
    controller over several seeds.

- id: l20-o4
  lecture: l20
  text: >-
    Explain why Q-learning and SARSA learn different paths on cliff walking, and what that says
    about exploring on a real plant.

- id: l20-o5
  lecture: l20
  text: >-
    Say when reinforcement learning is the right tool and when a model with MPC, Bayesian
    optimization, or a tuned PID loop is, and read a published success claim for its baseline,
    seeds, sample count and simulator.

- id: l21-o1
  lecture: l21
  text: >-
    Build a repeatable eval harness that turns "it seems to work" into a number with a
    confidence interval.

- id: l21-o2
  lecture: l21
  text: >-
    Implement an LLM-as-judge grader and validate it against a small human-labeled set.

- id: l21-o3
  lecture: l21
  text: >-
    Add tracing so every request's inputs, outputs, tool calls, latency, and cost are
    recorded and queryable.

# L13 objectives, lifted verbatim from the seven bullets in lectures/l13/notes.md.

- id: l13-o1
  lecture: l13
  text: >-
    Explain what a physics-informed neural network (PINN) minimizes, and why its physics holds
    only approximately.

- id: l13-o2
  lecture: l13
  text: >-
    Build a PINN in JAX and compare its extrapolation with a plain network.

- id: l13-o3
  lecture: l13
  text: >-
    Derive a neural ODE from a recurrent network by letting the time step go to zero, and train
    one with a differentiable ODE solver.

- id: l13-o4
  lecture: l13
  text: >-
    Explain why some physics must be enforced rather than penalized, and what makes a model a
    differential-algebraic equation (DAE).

- id: l13-o5
  lecture: l13
  text: >-
    Contrast the sequential and simultaneous approaches to training a dynamic model.

- id: l13-o6
  lecture: l13
  text: >-
    Train a neural DAE with SiNDAE, and check that its predictions satisfy the constraints.

- id: l13-o7
  lecture: l13
  text: >-
    Compare PINNs, neural ODEs, neural DAEs and projection layers: where the physics lives, and
    what each one guarantees.

- id: l07-o1
  lecture: l07
  text: >-
    Explain why a dynamic process needs its own past in the feature table, and a
    steady-state measurement does not.

- id: l07-o2
  lecture: l07
  text: >-
    Build a feature table from a sensor log in which every value in a row was knowable
    at that row's timestamp, dropping the rows whose past lies outside the record.

- id: l07-o3
  lecture: l07
  text: >-
    Convert the two coefficients of a fitted first-order model into a time constant and
    a gain, and say whether they are physically plausible.

- id: l19-o1
  lecture: l19
  text: >-
    Explain why RAG exists (grounding, freshness, source attribution, cost vs long-context)
    and where it breaks.

- id: l19-o2
  lecture: l19
  text: >-
    Build each stage of a RAG pipeline and reason about the design choices at each stage.

- id: l19-o3
  lecture: l19
  text: >-
    Evaluate retrieval quality quantitatively and connect retrieval failures to downstream
    answer failures.

- id: l01-o1
  lecture: l01
  text: >-
    Map the end-to-end lifecycle of an engineering ML system and identify the standardized
    toolchain used throughout the semester.

- id: l01-o2
  lecture: l01
  text: >-
    Contrast "a model in a notebook" with "a system," naming the data contracts, drift, and
    monitoring concerns that separate them.

- id: l01-o3
  lecture: l01
  text: >-
    Explain why engineering data imposes provenance and traceability requirements that
    general-purpose ML tutorials ignore.

- id: l01-o4
  lecture: l01
  text: >-
    Justify each component of the course toolchain in terms of the failure it prevents.

- id: l02-o1
  lecture: l02
  text: >-
    Build and lock a project environment with `uv`, and rebuild it exactly on a fresh machine.

- id: l02-o2
  lecture: l02
  text: >-
    Choose the right versioning tool for code, data, and models, and explain why large binary
    files do not belong in plain git.

- id: l02-o3
  lecture: l02
  text: >-
    Turn an exploratory notebook into a script or package with a tested command-line entry
    point.

- id: l02-o4
  lecture: l02
  text: >-
    Log a run to MLflow so that one run equals the same exact fact you can always
    reproduce.

- id: l05-o1
  lecture: l05
  text: >-
    Get more familiar with pandas and, most importantly, write Polars code that operates on
    whole columns at once instead of row by row, including grouping and joining.

- id: l05-o2
  lecture: l05
  text: >-
    Break a data pipeline into small steps that each read one file and write one file, so a run
    that fails halfway through can be started again without corrupting anything.

- id: l05-o3
  lecture: l05
  text: >-
    Explain the difference between pandas running code immediately and Polars planning a
    computation before running it, and use that difference to choose between the two for a
    given task.

- id: l03-o1
  lecture: l03
  text: >-
    Model sensor/simulation data in a relational schema with appropriate types (timestamps,
    numeric precision, units).

- id: l03-o2
  lecture: l03
  text: >-
    Load data into PostgreSQL and query it with SQL: joins, `GROUP BY`, window functions,
    time bucketing.

- id: l03-o3
  lecture: l03
  text: >-
    Reason about indexing and query cost for time-range queries.

- id: l04-o1
  lecture: l04
  text: >-
    Explain the row-store versus column-store trade-off and why a columnar layout is faster
    to scan, and read and write Parquet.

- id: l04-o2
  lecture: l04
  text: >-
    Query Parquet with DuckDB, and choose between a transactional (OLTP) and an analytical
    (OLAP) tool.

- id: l04-o3
  lecture: l04
  text: >-
    Name the other kinds of store (document, key-value, time-series) and say when each one
    fits.

# L6 has published notes but no item bank yet (see game/content/l06.yml,
# status: unwritten). L8's bank is written and held until release. The objectives are registered anyway,
# lifted verbatim, so that whoever writes those banks maps items onto objectives
# that already exist rather than inventing a second set. validate.py checks the
# text against the notes, so these cannot drift silently either.

- id: l06-o1
  lecture: l06
  text: >-
    Distinguish batch from streaming, and identify when sensor systems require streaming.

- id: l06-o2
  lecture: l06
  text: >-
    Explain windowing, event vs. processing time, watermarks, and late or out-of-order data.

- id: l06-o3
  lecture: l06
  text: >-
    Author executable data-quality checks and integrate them as a pipeline gate.

- id: l08-o1
  lecture: l08
  text: >-
    Frame a time-series forecast as a supervised learning problem, stating the horizon and what is known when the forecast is made.

- id: l08-o2
  lecture: l08
  text: >-
    Compare a forecasting model against persistence and mean baselines across horizons, and say whether the model earned its place.

- id: l08-o3
  lecture: l08
  text: >-
    Choose between direct and recursive multi-step forecasting, and explain why recursive errors grow with the horizon.

- id: l08-o4
  lecture: l08
  text: >-
    Evaluate a forecaster with a time-ordered split whose gap is at least the horizon, and explain why a shuffled split inflates the score.

- id: l08-o5
  lecture: l08
  text: >-
    Use forecast residuals as a simple anomaly detector, setting the threshold on normal data and reporting false alarms and detection delay.

# L10 objectives, lifted verbatim from the six bullets in lectures/l10/notes.md.

- id: l10-o1
  lecture: l10
  text: >-
    Explain what a classifier predicts (a class, from a probability and a threshold), and read a
    logistic regression's decision boundary on one plant signal.

- id: l10-o2
  lecture: l10
  text: >-
    Say what each of the four model families minimizes when it classifies.

- id: l10-o3
  lecture: l10
  text: >-
    Understand a confusion matrix, and the concepts of accuracy, precision and recall from it.

- id: l10-o4
  lecture: l10
  text: >-
    Move the decision threshold to trade missed faults against false alarms.

- id: l10-o5
  lecture: l10
  text: >-
    Explain why a classifier can miss faults it was never trained on.

- id: l10-o6
  lecture: l10
  text: >-
    Run a hyperparameter search with Optuna, record every trial in MLflow, and register the best
    model.

# L12, published notes and no bank yet (game/content/l12.yml, status: unwritten).
# Registered so whoever writes that bank maps onto objectives that already exist.

- id: l12-o1
  lecture: l12
  text: >-
    Match model architecture to the structure of the input (vector, field/image, sequence).

- id: l12-o2
  lecture: l12
  text: >-
    Implement a 1D-CNN or RNN for sensor time series and a 2D-CNN for field/image data.

- id: l12-o3
  lecture: l12
  text: >-
    Apply regularization and normalization appropriate to each architecture.

# L15, objectives lifted verbatim from lectures/l15/notes.md; l15-o4 (uncertainty) moved here from L13.

- id: l14-o1
  lecture: l14
  text: >-
    Define uncertainty quantification, distinguish aleatoric from epistemic uncertainty, and
    tell confidence, credible and prediction intervals apart.

- id: l14-o2
  lecture: l14
  text: >-
    Check whether a predictive uncertainty is calibrated, with coverage, a reliability diagram
    and a proper scoring rule, and recalibrate it with one scale factor.

- id: l14-o3
  lecture: l14
  text: >-
    Explain what a Gaussian process's band promises, and recognize three ways it fails:
    heteroscedastic noise, a misspecified kernel, and too few data.

- id: l14-o4
  lecture: l14
  text: >-
    Explain what the spread of a bootstrap or a deep ensemble measures, and why it needs a noise
    term and recalibration before it is an interval.

- id: l14-o5
  lecture: l14
  text: >-
    Wrap any model in split conformal or CV+ prediction intervals, and state the exchangeability
    condition their guarantee rests on.

- id: l14-o6
  lecture: l14
  text: >-
    Fit and compare UQ-capable regressors from pycse on data inside and beyond the training
    range.

- id: l15-o1
  lecture: l15
  text: >-
    Explain what Bayesian optimization (BO) is, why it is called Bayesian, and when it beats
    gradient-based and other derivative-free optimizers: expensive, noisy, black-box objectives
    with a budget of tens of evaluations.

- id: l15-o2
  lecture: l15
  text: >-
    Explain the BO loop (a Gaussian-process surrogate, an acquisition function, evaluate, update)
    and the trade-off between exploration and exploitation.

- id: l15-o3
  lecture: l15
  text: >-
    Write and compute the common acquisition functions: probability of improvement (PI), expected
    improvement (EI) and upper and lower confidence bounds (UCB, LCB), and
    explain how their parameters set the balance between exploration and exploitation.

- id: l15-o4
  lecture: l15
  text: >-
    Run BO in BoTorch on an engineering problem and compare it with random search over several
    seeds.

- id: l15-o5
  lecture: l15
  text: >-
    Name the extensions engineers need (constraints, batches, several objectives, several
    fidelities) and recognize where BO is used across engineering and science.

# L16, objectives lifted verbatim from lectures/l16/notes.md (bank status: unwritten until release).

- id: l16-o1
  lecture: l16
  text: >-
    Distinguish a generative model from the regression and classification models of L8–L14, and
    explain why a regression model gives a wrong answer to an inverse question with more than
    one solution.

- id: l16-o2
  lecture: l16
  text: >-
    Fit a Gaussian mixture model to the joint distribution of inputs and outputs, choose the
    number of components, and condition it to sample the inputs that give a target output.

- id: l16-o3
  lecture: l16
  text: >-
    Explain how flow matching turns samples of a simple distribution into samples of the data,
    train one with a mean-squared-error loss, and sample it by integrating an ODE.

- id: l16-o4
  lecture: l16
  text: >-
    Pose root finding, optimization and parameter estimation as conditional sampling, and check
    the samples against the physical model.

- id: l16-o5
  lecture: l16
  text: >-
    Place generative models in the machine-learning landscape, and explain why they are as
    dependent on data, and as limited by it, as any regression model.

- id: l16-o6
  lecture: l16
  text: >-
    Describe how generative models are used for images, molecules, proteins, materials and
    weather, and the failure modes those uses share.

# L18, published notes and no bank yet (game/content/l18.yml, status: unwritten).
# Registered so whoever writes that bank maps onto objectives that already exist.

- id: l18-o1
  lecture: l18
  text: >-
    Explain context engineering: an LLM answers from what is in its context window, so deciding
    what goes there, and how it gets there, determines the answer.

- id: l18-o2
  lecture: l18
  text: >-
    Give a model a tool, explain the tool-call exchange, and recognize when fetching context on
    demand (reading files, searching the web) is the right design, and the prompt-injection risk
    it brings.

- id: l18-o3
  lecture: l18
  text: >-
    Build keyword search (an inverted index with BM25) and semantic search (embeddings), combine
    them, and rerank the result with a cross-encoder; explain where late interaction (ColBERT)
    sits between them.

- id: l18-o4
  lecture: l18
  text: >-
    Choose chunk size, embedding model and index from measured trade-offs in hit rate, memory
    and search time, and say what changes when the index moves to a server.

- id: l18-o5
  lecture: l18
  text: >-
    Assemble a grounded prompt with citations within a token budget, and measure retrieval with
    hit@k and MRR on a gold set of queries.

- id: l18-o6
  lecture: l18
  text: >-
    Trace each stage of a retrieval pipeline running in the browser: what runs at build time,
    what runs on the page, and what each costs.

# L19, published notes and no bank yet (game/content/l19.yml, status: unwritten).
