# prompt injection, keyword search (BM25), semantic and hybrid search, re-ranking and late
# interaction, tuning and scaling, assembling and measuring the context, and the in-browser
# capstone. Every item quotes lectures/l18/notes.md; the numbers come from
# lectures/l18/figures/make_figures.py on the frozen L1-L17 snapshot and its gold set.
#
# Version 2 replaces the empty version 1 of the old L18 (structured output), which moved to L17.

