  # --- o1: generative against discriminative, and the inverse question -------------------------

  - id: l16-q01
    kind: predict_measure
    rung: 1
    difficulty: 1
    objectives: [l16-o1]
    prompt: |
      Data follow y = |x| with a little noise, and there are none for −0.5 < x < 0.5. You fit x
      as a straight-line function of y by least squares and ask it which x gives y = 0.75. What
      does it answer?
    predict:
      common_prior: "+0.75, the answer on the branch you happened to picture"
    options:
      - "+0.75, the answer on the branch you happened to picture"
      - "About 0, the average of the two answers"
      - "−0.75, because the fit is pulled toward negative x"
      - "Both −0.75 and +0.75, one per branch"
    answer: "About 0, the average of the two answers"
    evidence: |
      Least squares predicts the mean of x given y. Half the points near y = 0.75 sit at
      x = −0.75 and half at +0.75, so the prediction lands between them, where there is no data
      and no solution. A regression returns one number per input, so it cannot return both.
    source:
      file: lectures/l16/notes.md
      heading: "Why this matters"
      quote: |
        The true answers are
        $x = -0.75$ and $x = +0.75$. The fitted value is their average, and it is not an answer at
        all
    verify: {mode: quote, needle: "The fitted value is their average", volatility: stable}
    tags: [inverse-problem, regression-to-the-mean]

  - id: l16-q02
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l16-o1]
    prompt: |
      Same |x| data. You replace the straight line with a neural network, still trained by
      minimizing squared error, to predict x from y. What happens to its answer at y = 0.75?
    options:
      - "It moves to one of the two branches, since the network can bend"
      - "It still sits near the mean of the two branches"
      - "It returns both answers, one per output neuron"
      - "It becomes undefined, since the inverse is not a function"
    answer: "It still sits near the mean of the two branches"
    evidence: |
      Squared error is minimized by the conditional mean, whatever the model class. With two
      branches the mean is between them, so a more flexible regressor reproduces the same wrong
      answer. The question, one number for an input with two answers, is the problem.
    source:
      file: lectures/l16/notes.md
      heading: "Why this matters"
      quote: |
        A more flexible model does not rescue this. A Gaussian process or a neural network trained
        by minimizing squared error on data with two branches also predicts the mean of the
        branches, because the mean is what minimizes squared error.
    verify: {mode: quote, needle: "because the mean is what minimizes squared error", volatility: stable}
    tags: [discriminative, squared-error]

  - id: l16-q03
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l16-o1]
    prompt: |
      Which question can a generative model of p(x, y) answer that a regression of y on x
      cannot?
    options:
      - "The expected value of y at a new, unseen x"
      - "Every x consistent with an observed y"
      - "The gradient of y with respect to each input x"
      - "The training error of the fit on the observed data"
    answer: "Every x consistent with an observed y"
    evidence: |
      A model of the joint can be conditioned on any variables. Fixing y and sampling x is an
      inverse problem, and the samples include every branch the data support. A regression of y
      on x only answers forward.
    source:
      file: lectures/l16/notes.md
      heading: "What a generative model learns"
      quote: |
        Fix the outputs
        and sample the inputs, and you have solved an inverse problem.
    verify: {mode: quote, needle: "solved an inverse problem", volatility: stable}
    tags: [conditioning, joint-distribution]

  # --- o2: Gaussian mixtures, EM, BIC and conditioning ------------------------------------------

  - id: l16-q04
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l16-o2]
    prompt: |
      Fitting Gaussian mixtures to the |x| data gives BIC = 543 at K = 1, −697 at K = 2 and
      −673 at K = 4. Which number of components does BIC choose?
    options:
      - "K = 1"
      - "K = 2"
      - "K = 4"
      - "The largest K tried, since likelihood always rises"
    answer: "K = 2"
    evidence: |
      The lowest BIC wins. BIC penalizes parameters, so the extra components at K = 4 raise it
      even though they raise the training likelihood. Two components match the two branches.
    source:
      file: lectures/l16/notes.md
      heading: "Choosing the number of components"
      quote: |
        BIC falls from 543 at $K = 1$ to $-697$ at $K = 2$ and rises again to $-673$ at
        $K = 4$: two components are best, matching the two branches.
    verify: {mode: quote, needle: "two components are best", volatility: stable}
    tags: [bic, model-selection]

  - id: l16-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l16-o2]
    prompt: |
      How do you condition a fitted Gaussian mixture on known values of some of its variables?
    options:
      - "Refit the mixture by EM using only the rows whose known columns match the given values"
      - "Condition each component exactly, then reweight components by how well they explain the knowns"
      - "Keep the single component whose mean lies closest to the known values and sample it alone"
      - "Draw samples from the joint and discard every sample that does not match the known values"
    answer: "Condition each component exactly, then reweight components by how well they explain the knowns"
    evidence: |
      Each Gaussian component conditions exactly with the Schur complement formulas. The weights
      are updated by the density each component gives the known values, so the result is again
      a mixture that can be sampled directly. Rejection sampling (the last option) works in
      principle but almost never accepts a sample when the known value is a single point.
    source:
      file: lectures/l16/notes.md
      heading: "Conditioning a mixture"
      quote: |
        For a mixture, condition each component $j$ this way and then reweight the components by how
        well each one explains the known values
    verify: {mode: quote, needle: "reweight the components", volatility: stable}
    tags: [conditioning, schur-complement]

  - id: l16-q06
    kind: spot_the_defect
    rung: 3
    difficulty: 2
    objectives: [l16-o2]
    prompt: |
      A teammate fitted a Gaussian mixture to rows of (reflux ratio, steam rate, purity) to find
      the operating conditions that give a target purity. Now they need the purity predicted for
      given operating conditions, and they plan to fit a second mixture for it. What is wrong
      with the plan?
    options:
      - "Nothing; a mixture can only be conditioned in the direction it was fitted"
      - "It is unnecessary; the same mixture conditions on any set of columns"
      - "The second mixture will need twice as many components as the first one"
      - "Purity has to be standardized before it can serve as a conditioning variable"
    answer: "It is unnecessary; the same mixture conditions on any set of columns"
    evidence: |
      Which columns are known is an argument to the conditioning step, not a choice made at
      fitting time. The one mixture answers the inverse question, the forward question and mixed
      ones.
    source:
      file: lectures/l16/notes.md
      heading: "Conditioning a mixture"
      quote: |
        The surprise here is that the split between inputs and outputs is chosen after training.
    verify: {mode: quote, needle: "chosen after training", volatility: stable}
    tags: [conditioning, gmm]

  # --- o3: flow matching -------------------------------------------------------------------------

  - id: l16-q07
    kind: mcq
    rung: 1
    difficulty: 1
    objectives: [l16-o3]
    prompt: |
      In flow matching, what does the network learn to predict during training?
    options:
      - "The probability density of the data at each point in space"
      - "The noise that was added to a data sample at each step"
      - "The velocity of a straight line from noise to a data sample"
      - "Whether a given sample came from the data or from the generator"
    answer: "The velocity of a straight line from noise to a data sample"
    evidence: |
      Training pairs a noise sample with a data sample, picks a point on the line between them,
      and regresses the network's output onto the line's velocity with mean squared error. No ODE
      is solved during training. Predicting added noise is the diffusion formulation, and telling
      real from generated is a GAN's discriminator.
    source:
      file: lectures/l16/notes.md
      heading: "Flow matching"
      quote: |
        That is the whole training procedure: a regression, with the same optimizer and loss as
    verify: {mode: quote, needle: "That is the whole training procedure: a regression", volatility: stable}
    tags: [flow-matching, training]

  - id: l16-q08
    kind: direction
    rung: 2
    difficulty: 3
    objectives: [l16-o3]
    prompt: |
      Every flow-matching training example is a straight line from noise to data. What do the
      sampling trajectories, from integrating the learned field, look like?
    options:
      - "Straight lines too, because the network was only ever trained on straight lines"
      - "Curved, because the field averages the velocities of all lines through a point"
      - "Random walks, because each integration step adds a fresh draw of Gaussian noise"
      - "Straight, but each one ends at exactly the training point it was paired with"
    answer: "Curved, because the field averages the velocities of all lines through a point"
    evidence: |
      Many training lines pass through a given point at a given time, heading to different data
      points. The network learns their average, so paths start slowly and commit to a branch only
      partway through. An ODE gives one velocity per point at each time, so no two sampling
      particles are ever in the same place at the same time, while the training lines pass
      through each other freely.
    source:
      file: lectures/l16/notes.md
      heading: "Why the paths curve"
      quote: |
        The reason is that the network sees
        many lines through each point and learns their average velocity.
    verify: {mode: quote, needle: "learns their average velocity", volatility: stable}
    tags: [flow-matching, probability-path]

  - id: l16-q09
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l16-o3]
    prompt: |
      You trained a conditional flow-matching model to generate reactor inputs given an output.
      Now you need outputs given inputs. What do you do?
    options:
      - "Integrate the same ODE backward from t = 1 to t = 0"
      - "Train a second model with the inputs as the condition"
      - "Condition the existing model with the Schur complement"
      - "Feed the inputs in place of the noise sample"
    answer: "Train a second model with the inputs as the condition"
    evidence: |
      The condition is an input to the network, fixed when it was trained. Asking a different
      question needs a model trained for it. A Gaussian mixture can be conditioned on any columns
      afterwards; a conditional flow cannot.
    source:
      file: lectures/l16/notes.md
      heading: "Choosing between the two approaches"
      quote: |
        A conditional flow-matching model trained to
        generate $x$ given $c$ can only answer that question; asking a different one means training a
        different model.
    verify: {mode: quote, needle: "asking a different one means training a", volatility: stable}
    tags: [flow-matching, conditioning]

  # --- o4: solving problems by conditional sampling, and checking the samples -------------------

  - id: l16-q10
    kind: mcq
    rung: 2
    difficulty: 1
    objectives: [l16-o4]
    prompt: |
      You learned p(τ, C_B, dC_B/dτ) for A → B → C in a batch reactor. To find the residence time
      that maximizes C_B, what do you condition on?
    options:
      - "d²C_B/dτ² = 0"
      - "dC_B/dτ = 0"
      - "τ equal to the middle of the sampled range"
      - "C_B = 0, the root of the concentration"
    answer: "dC_B/dτ = 0"
    evidence: |
      At an interior optimum the derivative is zero, so conditioning on a zero derivative samples
      the stationary points. It finds stationary points, not only maxima, so a second condition or
      the second-derivative test tells a maximum from a minimum.
    source:
      file: lectures/l16/notes.md
      heading: "Root finding, optimization and parameter estimation"
      quote: |
        At an interior optimum the derivative is zero, so condition
        on it.
    verify: {mode: quote, needle: "so condition", volatility: stable}
    tags: [optimization, conditioning]

  - id: l16-q11
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l16-o4]
    prompt: |
      Conditioning a Gaussian mixture on r = 0 gives clusters of Peng-Robinson roots at 0.0440,
      0.1273 and 0.8143; numpy.roots gives 0.0348, 0.1280 and 0.8147. What is the right next step?
    options:
      - "Report the cluster means, since the surrogate already agrees to two figures"
      - "Polish each cluster center with a few Newton steps on the real cubic"
      - "Refit with more and more components until the liquid root finally matches"
      - "Discard the liquid root as an artifact of sampling a narrow region"
    answer: "Polish each cluster center with a few Newton steps on the real cubic"
    evidence: |
      The samples are starting points, one per basin. A few Newton iterations against the true
      cubic turn them into the exact roots. The generative model finds every basin at once; the
      solver supplies the precision.
    source:
      file: lectures/l16/notes.md
      heading: "Root finding, optimization and parameter estimation"
      quote: |
        The samples are starting points, and the honest last step is
        to polish the center of each cluster with a few Newton iterations against the real cubic.
    verify: {mode: quote, needle: "The samples are starting points", volatility: stable}
    tags: [root-finding, verification]

  - id: l16-q12
    kind: spot_the_defect
    rung: 3
    difficulty: 3
    objectives: [l16-o4]
    prompt: |
      Z was sampled uniformly on [0.01, 0.99] and a 12-component mixture was fitted to (Z, r).
      The vapor and unstable roots come out within 1%, but the liquid root is 26% high. Which
      change fixes it in the course's fit?
    options:
      - "Fit in log Z, which spreads out the small values of Z"
      - "Use fewer components, so that each one covers more of the data"
      - "Condition on r = 0.001 instead of r = 0, to stay clear of the root"
      - "Sample Z more coarsely, so that the cubic looks smoother to EM"
    answer: "Fit in log Z, which spreads out the small values of Z"
    evidence: |
      The liquid root sits in a narrow region where the cubic changes quickly, so the fit there is
      sensitive to choices such as K, scaling and seed. Fitting in log Z gives that region more
      resolution, and the liquid root comes out at 0.0346 against 0.0348. The paper's own fit
      reached 0.035 without it, so this is one fix among several.
    source:
      file: lectures/l16/notes.md
      heading: "Root finding, optimization and parameter estimation"
      quote: |
        One fix that works here is to fit the same mixture to $(\log Z, r)$, which spreads the small
        values of $Z$ out. That gives 0.0346 for the liquid root
    verify: {mode: quote, needle: "which spreads the small values", volatility: stable}
    tags: [representation, root-finding]

  # --- o5: where generative models fit, and why they stay data-driven ---------------------------

  - id: l16-q13
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l16-o5]
    prompt: |
      For the same job, how does the data a generative model of p(x, y) needs compare with what a
      regression of y on x needs?
    options:
      - "Less, because sampling creates new training data"
      - "The same, because both see the same rows"
      - "More, because it also has to model how x is distributed"
      - "Less, because a mixture has fewer parameters than a network"
    answer: "More, because it also has to model how x is distributed"
    evidence: |
      A regression models how y depends on x. A model of the joint does that and also models the
      distribution of x, which is extra work paid for in samples, and density estimation gets
      harder fast as the dimension grows. Generated samples are not new data.
    source:
      file: lectures/l16/notes.md
      heading: "Still data-driven"
      quote: |
        It needs data, and it needs more than a regression for the same job.
    verify: {mode: quote, needle: "it needs more than a regression for the same job", volatility: stable}
    tags: [data-requirements, landscape]

  - id: l16-q14
    kind: direction
    rung: 2
    difficulty: 2
    objectives: [l16-o5]
    prompt: |
      You condition a generative model on a value far outside its training data. What do you
      get?
    options:
      - "An error, because the condition has zero probability under the model"
      - "Samples, with no warning, shaped by how the model behaves off the data"
      - "The single nearest training point, returned exactly and every time"
      - "Samples from the unconditional distribution, with the condition ignored"
    answer: "Samples, with no warning, shaped by how the model behaves off the data"
    evidence: |
      Nothing in the sampling step checks whether the condition is supported by data. The
      notebook asks about the gap in the |x| data and both models answer; the mixture is close to
      right only because its straight ellipses extend straight branches.
    source:
      file: lectures/l16/notes.md
      heading: "Still data-driven"
      quote: |
        Conditioning on a value outside the training data does
        not raise an error.
    verify: {mode: quote, needle: "not raise an error", volatility: stable}
    tags: [extrapolation, landscape]

  - id: l16-q15
    kind: mcq
    rung: 3
    difficulty: 2
    objectives: [l16-o5]
    prompt: |
      A generative model trained on a plant's historian data proposes an optimal operating point.
      Which statement is fair?
    options:
      - "It is optimal for the plant, because every row of the data came from that plant"
      - "It solves the surrogate, which only knows the regions the plant has operated in"
      - "It is guaranteed feasible, because the operators always kept the plant feasible"
      - "It is certified optimal as long as the generated samples are tightly clustered"
    answer: "It solves the surrogate, which only knows the regions the plant has operated in"
    evidence: |
      A generative model is a surrogate of the data. Its samples satisfy the learned
      distribution, not necessarily the plant, and it learns the plant as it was operated, so the
      true optimum may be somewhere the data never went. Tight samples show the surrogate is
      confident, not that it is right.
    source:
      file: lectures/l16/notes.md
      heading: "Still data-driven"
      quote: |
        A model of a plant's historian data learns the
        plant as it was operated, including the operating policy, so it cannot tell you about regions
        the operators never visited.
    verify: {mode: quote, needle: "learns the plant as it was operated", volatility: stable}
    tags: [surrogate, historian-data]

  # --- o6: generative models in science and engineering, and their shared failures -------------

  - id: l16-q16
    kind: claim_vs_source
    rung: 3
    difficulty: 3
    objectives: [l16-o6]
    prompt: |
      "MatterGen designed a material and the lab measured its property within 20% of the
      target." The target bulk modulus was 200 GPa. What does the paper's measurement actually
      support?
    options:
      - "A central estimate within 5% of the target, from four direct measurements"
      - "158 ± 11 GPa: within 20% only at the top of the range, 21% below at its center"
      - "Agreement between DFT and the experiment at 222 GPa, well within the 20%"
      - "All four synthesized candidates landing within 20% of their own targets"
    answer: "158 ± 11 GPa: within 20% only at the top of the range, 21% below at its center"
    evidence: |
      The bulk modulus was estimated from nanoindentation as "up to 169 GPa after four
      measurements (158 ± 11 GPa)". 169 GPa is the upper end of that range and is within 20% of
      200 GPa; the central value, 158 GPa, is 21% below. Only one of the four candidates chosen
      for synthesis was made, and DFT on the ordered structure gave 222 GPa.
    source:
      file: lectures/l16/notes.md
      heading: "Generative models in science and engineering"
      quote: |
        The abstract's "within 20% of our target" holds at 169 GPa, the upper end of that range. At the
        central value, 158 GPa, the estimate is 21% below the target.
    verify: {mode: quote, needle: "the upper end of that range", volatility: stable}
    tags: [case-study, mattergen, reading-sources]

  - id: l16-q17
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l16-o6]
    prompt: |
      Across the survey (proteins, materials, weather, process engineering), what do the
      successful uses of generative models have in common?
    options:
      - "They were trained on more data than any discriminative model in their field"
      - "The generator proposes, and a lab or a physical model verifies"
      - "They replaced the physical model of the system entirely, once trained"
      - "Their samples were valid by construction and needed no further checks"
    answer: "The generator proposes, and a lab or a physical model verifies"
    evidence: |
      RFdiffusion's designs were characterized in the laboratory, MatterGen's candidate was
      synthesized and measured, GenCast was scored against a held-out year of weather, and the
      evaporator samples were checked against the process equations.
    source:
      file: lectures/l16/notes.md
      heading: "Generative models in science and engineering"
      quote: |
        In every successful example above, the generator proposes and something else verifies
    verify: {mode: quote, needle: "the generator proposes and something else verifies", volatility: stable}
    tags: [verification, survey]

  - id: l16-q18
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l16-o6]
    prompt: |
      Carlini et al. generated 175 million images from Stable Diffusion. What did they find?
    options:
      - "No generated image matched any image in the training set"
      - "94 generated images counted as extracted training images"
      - "About half of the generated images were copies of training images"
      - "Copies appeared only when a prompt explicitly asked for a known image"
    answer: "94 generated images counted as extracted training images"
    evidence: |
      From 500 generations for each of 350,000 heavily duplicated training captions, 94 images
      met their definition of extraction, and manual inspection found 13 more near-copies. Rare,
      and real: a model trained on proprietary records can leak them.
    source:
      file: lectures/l16/notes.md
      heading: "Limitations and trade-offs"
      quote: |
        They found 94
        that matched training images closely enough to count as extracted under their definition
    verify: {mode: quote, needle: "closely enough to count as extracted", volatility: stable}
    tags: [memorization, privacy]
