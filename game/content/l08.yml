  # --- framing the forecast ---------------------------------------------------

  - id: l08-q01
    kind: spot_the_defect
    rung: 2
    difficulty: 2
    objectives: [l08-o1]
    prompt: |
      You are building a table to forecast reactor pressure 30 minutes ahead
      (h = 10). Each row is time t. Which feature makes the table leak?
    options:
      - "Valve positions ten samples after t"
      - "Pressure nine samples before t"
      - "Valve positions at t"
      - "A rolling mean of pressure ending at t"
    answer: "Valve positions ten samples after t"
    evidence: |
      Everything in a row has to be known when the forecast is made. The channel's
      past and the valves at t are known. The valves 30 minutes from now are not,
      unless they come from a written plan, so using them is leakage stretched
      across h rows.
    source:
      file: lectures/l08/notes.md
      heading: "The forecast horizon"
      quote: "The *future* valve positions are not known, unless they come from a plan, and this is easy to miss."
    verify: {mode: quote, needle: "future* valve positions are not known", volatility: stable}
    tags: [horizon, leakage]

  - id: l08-q02
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l08-o1]
    prompt: |
      A table pools 500 simulation runs, one after another. The target is built
      with `pl.col("xmeas_7").shift(-h)`, with no `.over(RUN)`.

      What goes wrong?
    options:
      - "The last rows of each run take their target from the next run"
      - "The first rows of each run lose their lag features"
      - "The target is h rows in the past instead of the future"
      - "Nothing, because the runs are sorted by sample number"
    answer: "The last rows of each run take their target from the next run"
    evidence: |
      A negative shift reads forward. Without the run key it reads straight across
      the boundary, so the final h rows of every run are asked to predict the
      opening of a different, independent simulation.
    source:
      file: lectures/l08/notes.md
      heading: "The forecast horizon"
      quote: "Without it the target of the last rows in one run is read from the start of the next run."
    verify: {mode: quote, needle: "read from the start of the next run", volatility: stable}
    tags: [horizon, run-boundary]

  # --- forecastability and baselines -----------------------------------------

  - id: l08-q03
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l08-o2]
    prompt: |
      A channel's autocorrelation is zero at every lag above zero: it is white noise
      around a setpoint. How does persistence compare with forecasting the mean?
    options:
      - "Persistence is about 1.41 times worse than the mean"
      - "Persistence and the mean are equally good"
      - "Persistence is about 1.41 times better than the mean"
      - "Persistence wins at short horizons and loses at long ones"
    answer: "Persistence is about 1.41 times worse than the mean"
    evidence: |
      With rho_h = 0 the persistence error is sigma times sqrt(2), while the mean's
      error is sigma. The last value adds its own noise to the next value's noise.
      Separator level measures 1.415 on the fault-free runs.
    source:
      file: lectures/l08/notes.md
      heading: "Which baseline wins depends on the horizon"
      quote: "On white noise, $\\rho_h = 0$, so persistence is $\\sqrt{2} \\approx 1.41$ times worse than the mean at every horizon."
    verify: {mode: quote, needle: "times worse than the mean at every horizon", volatility: stable}
    tags: [baseline, white-noise]

  - id: l08-q04
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o2]
    prompt: |
      For a stationary series, you read the autocorrelation at lag h off the ACF
      before fitting anything. When will persistence beat the mean at horizon h?
    options:
      - "When the lag-h autocorrelation exceeds 0.5"
      - "Whenever the lag-h autocorrelation is positive"
      - "Only when the lag-h autocorrelation is near 1"
      - "Whenever h is a single step"
    answer: "When the lag-h autocorrelation exceeds 0.5"
    evidence: |
      The mean's error is sigma and persistence's is sigma times sqrt(2(1 - rho_h)).
      The two are equal at rho_h = 0.5. Above it, persistence wins. A positive but
      small autocorrelation is not enough, and one step is not enough on white noise.
    source:
      file: lectures/l08/notes.md
      heading: "Which baseline wins depends on the horizon"
      quote: "Persistence beats the mean exactly when $\\rho_h > 0.5$."
    verify: {mode: quote, needle: "Persistence beats the mean exactly when", volatility: stable}
    tags: [baseline, autocorrelation]

  - id: l08-q05
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l08-o2]
    prompt: |
      A one-step forecaster for reactor pressure improves on persistence by 5 %.
      A thirty-minute forecaster for the same channel improves on the better
      baseline by 14 %. What explains the small one-step gain?
    options:
      - "Three minutes out, persistence is already close to right"
      - "The one-step model was trained on fewer rows"
      - "One-step models cannot use lag features"
      - "The mean is the stronger baseline at one step"
    answer: "Three minutes out, persistence is already close to right"
    evidence: |
      At three minutes persistence is four times better than the mean, so there is
      little left to win. The model earns most in the middle horizons, where
      neither free guess is good. That small gap is also why an R-squared near 0.99
      one step ahead says little about the model.
    source:
      file: lectures/l08/notes.md
      heading: "Which baseline wins depends on the horizon"
      quote: "At three minutes persistence is four times better than the mean and the model adds only 5 %."
    verify: {mode: quote, needle: "the model adds only 5 %", volatility: measured}
    tags: [baseline, skill]

  - id: l08-q06
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l08-o2]
    prompt: |
      At a 60-minute horizon on reactor pressure, persistence scores 8.87 kPa and
      the mean scores 7.61 kPa. Which one should your model's skill score use as
      its reference?
    options:
      - "The mean, because it is the better baseline at this horizon"
      - "Persistence, because it is always the standard baseline"
      - "Whichever makes the model's skill look largest"
      - "Neither, because skill scores need a fitted reference model"
    answer: "The mean, because it is the better baseline at this horizon"
    evidence: |
      Beating the worse baseline proves nothing. At an hour, pressure is weakly
      related to pressure now, so the mean has overtaken persistence, and it is the
      one the model has to beat.
    source:
      file: lectures/l08/notes.md
      heading: "Skill scores and MASE"
      quote: "Use the better of the two baselines as the reference at each horizon. Beating the worse one proves nothing."
    verify: {mode: quote, needle: "Beating the worse one proves nothing", volatility: stable}
    tags: [skill, baseline]

  - id: l08-q07
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l08-o2]
    prompt: |
      Meese and Rogoff scored 1970s exchange-rate models out of sample. The models
      fitted the historical data well. What did the comparison with a random walk
      show?
    options:
      - "The random walk forecast as well or better than all of them"
      - "The structural models beat the random walk at every horizon"
      - "The models won at one month and lost at twelve months"
      - "The comparison was impossible because exchange rates are not stationary"
    answer: "The random walk forecast as well or better than all of them"
    evidence: |
      Their working paper says a random walk "would have outperformed all the other
      models," including univariate models, a VAR, and combinations of forecasts.
      A good in-sample fit said nothing about forecasting; only the baseline did.
    source:
      file: lectures/l08/notes.md
      heading: "Case study: the random walk that beat the economists"
      quote: "a random walk model would have outperformed all the other models as a predictor of the logarithm of major-country exchange rates during the 1970's."
    verify: {mode: quote, needle: "would have outperformed all the other models", volatility: stable}
    tags: [baseline, case-study, finance]

  # --- multi-step strategies ------------------------------------------------

  - id: l08-q08
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o3]
    prompt: |
      A recursive AR(10) forecaster for reactor pressure matches the direct one at
      three minutes, but at two hours it is worse than simply forecasting the mean.
      Why does it fall apart further out?
    options:
      - "Each step feeds its prediction back in, so errors compound"
      - "The recursive model was trained on a different target"
      - "It uses fewer lags than the direct model"
      - "The mean is overfitted at long horizons"
    answer: "Each step feeds its prediction back in, so errors compound"
    evidence: |
      The recursive forecaster applies a one-step model h times, and each application
      treats the previous guess as a measurement. Small errors become the next
      step's input and grow. The direct forecaster trains on y[t+h] itself.
    source:
      file: lectures/l08/notes.md
      heading: "Direct and recursive forecasting"
      quote: "Its weakness is that each step's error becomes the next step's input."
    verify: {mode: quote, needle: "each step's error becomes the next step's input", volatility: stable}
    tags: [multi-step, recursive]

  - id: l08-q09
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o3]
    prompt: |
      Your one-step model uses pressure lags and the current valve positions. You
      want to run it recursively ten steps ahead. What extra information does that
      require?
    options:
      - "The valve positions at each future step"
      - "The pressure at each future step"
      - "A separate model for every horizon"
      - "Nothing beyond what the one-step model already uses"
    answer: "The valve positions at each future step"
    evidence: |
      To feed y[t+1] back in, the model also needs u[t+1], which is not known at
      time t. You must forecast the inputs or assume they stay put. A direct
      forecaster uses only the inputs known at t and avoids the question.
    source:
      file: lectures/l08/notes.md
      heading: "Direct and recursive forecasting"
      quote: "To feed `y[t+1]` back in, it also needs `u[t+1]`, which is not known at time $t$."
    verify: {mode: quote, needle: "which is not known at time", volatility: stable}
    tags: [multi-step, exogenous]

  - id: l08-q10
    kind: claim_vs_source
    rung: 4
    difficulty: 3
    objectives: [l08-o3]
    prompt: |
      A teammate says: "On reactor pressure, direct beat recursive, so direct
      forecasting is always the better strategy." What does the published evidence
      say?
    options:
      - "Not always: on the NN5 series, recursive beat direct"
      - "Correct: direct wins on every published benchmark"
      - "Correct, but only for linear models"
      - "Not always: both strategies always give identical errors"
    answer: "Not always: on the NN5 series, recursive beat direct"
    evidence: |
      Taieb and colleagues found that among single-model strategies the recursive one
      almost always had the smaller error on the 111 NN5 series, and multi-output
      strategies did best of all. The choice is measured on your own data.
    source:
      file: lectures/l08/notes.md
      heading: "Direct and recursive forecasting"
      quote: "Which strategy wins depends on the series and the model, so measure both on your own data, as the table above does."
    verify: {mode: quote, needle: "Which strategy wins depends on the series and the model", volatility: stable}
    tags: [multi-step, evidence]

  # --- evaluating on time ---------------------------------------------------

  - id: l08-q11
    kind: mcq
    rung: 2
    difficulty: 3
    objectives: [l08-o4]
    prompt: |
      You forecast h samples ahead and split one series in time order, with the
      test block starting right after the last training row and no gap. Which
      training rows have targets that land inside the test block?
    options:
      - "The last h training rows"
      - "Only the final training row"
      - "None, since the split is time-ordered"
      - "Every training row"
    answer: "The last h training rows"
    evidence: |
      A row at time t has target y[t+h]. For the last h training rows, t+h is past
      the cutoff, so the model was trained on values it is then tested near. A gap
      of at least h samples removes them.
    source:
      file: lectures/l08/notes.md
      heading: "The gap must be at least the horizon"
      quote: "The last training row therefore has a target $h$ samples past the cutoff, which lands inside the test block."
    verify: {mode: quote, needle: "which lands inside the test block", volatility: stable}
    tags: [evaluation, gap]

  - id: l08-q12
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o4]
    prompt: |
      On single runs of reactor pressure, 30 minutes ahead, a random forest scores
      4.32 kPa under shuffled KFold and 6.92 kPa under TimeSeriesSplit. Persistence
      scores about 6.1. What should you report?
    options:
      - "The forest loses to persistence, so do not use it"
      - "The forest beats persistence by about 30 %"
      - "The average of the two scores, about 5.6 kPa"
      - "Neither, because the two splits disagree"
    answer: "The forest loses to persistence, so do not use it"
    evidence: |
      Shuffled, each test row has neighbours from before and after it in training,
      and a forest recalls them. The time-ordered score is the one you would see in
      use, and it is worse than persistence.
    source:
      file: lectures/l08/notes.md
      heading: "Why a shuffled split leaks"
      quote: "The shuffled split reports a model that beats the baseline by 30 %. The honest split reports a model that should not be used."
    verify: {mode: quote, needle: "The honest split reports a model that should not be used", volatility: measured}
    tags: [evaluation, leakage]

  - id: l08-q13
    kind: claim_vs_source
    rung: 4
    difficulty: 4
    objectives: [l08-o4]
    prompt: |
      Pooled over 200 independent runs, a ridge model scores 4.74 kPa on a shuffled
      row split and 4.71 kPa split by run. A classmate concludes the notes were wrong
      about shuffling. What is the better reading?
    options:
      - "Never shuffling is a safe default, and this case sits at its boundary"
      - "Shuffling is always safe for linear models on any series"
      - "The by-run split must contain a bug"
      - "The runs must share neighbouring rows"
    answer: "Never shuffling is a safe default, and this case sits at its boundary"
    evidence: |
      With that much data a linear model barely leans on a test row's few
      neighbours, and K-fold is valid for a purely autoregressive model with
      uncorrelated errors. The shuffled score is most dangerous on one short series
      with a flexible model, where it flattered two models past persistence.
    source:
      file: lectures/l08/notes.md
      heading: "Why a shuffled split leaks"
      quote: "The rule \"never shuffle a time series\" is a safe default with known exceptions."
    verify: {mode: quote, needle: "is a safe default with known exceptions", volatility: stable}
    tags: [evaluation, boundary]

  # --- residual detection ---------------------------------------------------

  - id: l08-q14
    kind: mcq
    rung: 2
    difficulty: 2
    objectives: [l08-o5]
    prompt: |
      A residual detector alarms whenever a residual exceeds the 99th percentile of
      normal residuals. The plant logs one sample every three minutes. Roughly how
      many false alarms a day should you expect?
    options:
      - "About 4.8"
      - "About 0.01"
      - "About 48"
      - "About 0.48"
    answer: "About 4.8"
    evidence: |
      The 99th percentile is exceeded by 1 % of normal samples by construction, and
      a day holds 480 three-minute samples. Operators learn to ignore a detector that
      cries wolf five times a day.
    source:
      file: lectures/l08/notes.md
      heading: "False alarms are set by the threshold"
      quote: "The plant logs one sample every three minutes, which is 480 a day, so the detector raises about 4.8 false alarms a day."
    verify: {mode: quote, needle: "raises about 4.8 false alarms a day", volatility: stable}
    tags: [detection, false-alarm]

  - id: l08-q15
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o5]
    prompt: |
      After fault 1 begins, the one-step residual on reactor pressure leaves its
      normal band, then returns inside it hours later, while the fault is still
      present. Why?
    options:
      - "The controller compensated, so the new state looks normal on this channel"
      - "The fault cleared itself partway through the run"
      - "The threshold was recalculated during the run"
      - "The model was retrained on the faulty data"
    answer: "The controller compensated, so the new state looks normal on this channel"
    evidence: |
      A residual reacts to surprise, not to distance from normal. Once the plant
      settles into a new steady state, a one-step model predicts it well again, and
      from the pressure channel alone nothing looks wrong.
    source:
      file: lectures/l08/notes.md
      heading: "One fault, measured"
      quote: "The controller has compensated, and from the pressure channel alone the new state looks normal."
    verify: {mode: quote, needle: "from the pressure channel alone the new state looks normal", volatility: stable}
    tags: [detection, residual]

  - id: l08-q16
    kind: mcq
    rung: 3
    difficulty: 3
    objectives: [l08-o5]
    prompt: |
      You want fewer false alarms from a residual detector, so you require three
      consecutive exceedances before alarming. What do you give up?
    options:
      - "Every fault is detected later"
      - "The threshold no longer comes from normal data"
      - "The detector can no longer run without fault examples"
      - "Nothing, since false alarms and delay are unrelated"
    answer: "Every fault is detected later"
    evidence: |
      Lowering the false-alarm rate raises the detection delay. Three in a row
      cannot fire until the third sample, so every alarm comes at least six minutes
      later, and later still for a residual that flickers across the threshold.
    source:
      file: lectures/l08/notes.md
      heading: "False alarms are set by the threshold"
      quote: "The cost is delay, at least six extra minutes for every fault, and more for a fault whose residual flickers across the threshold."
    verify: {mode: quote, needle: "The cost is delay", volatility: stable}
    tags: [detection, trade-off]
