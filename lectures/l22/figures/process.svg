<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="How the course was made. The instructors designed the course, chose every dataset and example, wrote a spec for every lecture, set the standards and rules, planned the extra materials, edited every draft, and reviewed and merged every change. Claude Code researched sources and drafted additional notes, slides, figures and extra materials. Automatic checks ran on every change. The result: lecture notes and slides, plus extra materials for a better class.">
<defs>
<linearGradient id="pl-spec" x1="0" x2="1"><stop offset="0" stop-color="#1f5c99"/><stop offset="1" stop-color="#c41230"/></linearGradient>
<marker id="pl-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c41230"/></marker>
<marker id="pl-navy" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5c99"/></marker>
<marker id="pl-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<filter id="pl-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
</defs>
<rect x="10" y="30" width="400" height="340" rx="16" fill="#e6eef7" stroke="#1f5c99" stroke-width="2.5" filter="url(#pl-sh)"/><text x="210.0" y="62" text-anchor="middle" font-size="22" font-weight="800" fill="#1f5c99">Instructors</text><circle cx="30" cy="87" r="3.5" fill="#1f5c99"/><text x="42" y="92" font-size="17" fill="#1a1a1a">Designed the course and its order</text><circle cx="30" cy="113" r="3.5" fill="#1f5c99"/><text x="42" y="118" font-size="17" fill="#1a1a1a">Chose every dataset and example</text><circle cx="30" cy="139" r="3.5" fill="#1f5c99"/><text x="42" y="144" font-size="17" fill="#1a1a1a">Wrote a spec for every lecture</text><circle cx="30" cy="165" r="3.5" fill="#1f5c99"/><text x="42" y="170" font-size="17" fill="#1a1a1a">Set the standards and the rules</text><circle cx="30" cy="191" r="3.5" fill="#1f5c99"/><text x="42" y="196" font-size="17" fill="#1a1a1a">Planned the extra materials</text><circle cx="30" cy="217" r="3.5" fill="#1f5c99"/><text x="42" y="222" font-size="17" fill="#1a1a1a">Edited every draft, directly or via Claude</text><circle cx="30" cy="243" r="3.5" fill="#1f5c99"/><text x="42" y="248" font-size="17" fill="#1a1a1a">Reviewed every change, sent work back</text><circle cx="30" cy="269" r="3.5" fill="#1f5c99"/><text x="42" y="274" font-size="17" fill="#1a1a1a">Merged every change you saw</text>
<g><path d="M412,150 C445,92 482,92 516,150" fill="none" stroke="url(#pl-spec)" stroke-width="5" stroke-linecap="round" marker-end="url(#pl-red)"/><text x="464" y="90" text-anchor="middle" font-size="15" font-style="italic" fill="#1f5c99">the spec</text><rect x="520" y="115" width="240" height="160" rx="16" fill="#fbeef0" stroke="#c41230" stroke-width="2.5" filter="url(#pl-sh)"/><text x="640.0" y="147" text-anchor="middle" font-size="22" font-weight="800" fill="#c41230">Claude Code</text><text x="640.0" y="177" text-anchor="middle" font-size="16" fill="#1a1a1a">Researches the sources</text><text x="640.0" y="202" text-anchor="middle" font-size="16" fill="#1a1a1a">Drafts additional notes,</text><text x="640.0" y="227" text-anchor="middle" font-size="16" fill="#1a1a1a">slides, figures and extras</text></g>
<g><path d="M516,245 C482,300 445,300 412,245" fill="none" stroke="#c41230" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" marker-end="url(#pl-navy)"/><text x="464" y="316" text-anchor="middle" font-size="15" font-style="italic" fill="#5c5c5c">questions</text></g>
<g><path d="M762,195 L816,195" stroke="#c41230" stroke-width="5" stroke-linecap="round" marker-end="url(#pl-navy)"/><rect x="820" y="115" width="190" height="160" rx="16" fill="#f6f6f7" stroke="#5c5c5c" stroke-width="2.5" filter="url(#pl-sh)"/><text x="915.0" y="147" text-anchor="middle" font-size="22" font-weight="800" fill="#5c5c5c">Checks</text><text x="915.0" y="177" text-anchor="middle" font-size="16" fill="#1a1a1a">Run on every change:</text><text x="915.0" y="202" text-anchor="middle" font-size="16" fill="#1a1a1a">build, links, figures</text><text x="915.0" y="227" text-anchor="middle" font-size="16" fill="#1a1a1a">and quiz quotes</text><path d="M915,113 C905,76 720,76 690,112" fill="none" stroke="#5c5c5c" stroke-width="3" stroke-linecap="round" marker-end="url(#pl-red)"/><text x="805" y="72" text-anchor="middle" font-size="15" font-style="italic" fill="#5c5c5c">a check fails: fix it</text></g>
<g><path d="M1012,195 L1046,195" stroke="#5c5c5c" stroke-width="5" stroke-linecap="round" marker-end="url(#pl-navy)"/><rect x="1050" y="115" width="140" height="160" rx="16" fill="#e6eef7" stroke="#1f5c99" stroke-width="2.5" filter="url(#pl-sh)"/><text x="1120.0" y="147" text-anchor="middle" font-size="22" font-weight="800" fill="#1f5c99">Merge</text><text x="1120.0" y="177" text-anchor="middle" font-size="16" fill="#1a1a1a">Only after an</text><text x="1120.0" y="202" text-anchor="middle" font-size="16" fill="#1a1a1a">instructor</text><text x="1120.0" y="227" text-anchor="middle" font-size="16" fill="#1a1a1a">approves</text><path d="M1120,113 C1100,18 680,18 640,112" fill="none" stroke="#1f5c99" stroke-width="3" stroke-linecap="round" marker-end="url(#pl-red)"/><text x="900" y="28" text-anchor="middle" font-size="15" font-style="italic" fill="#1f5c99">instructor asks for changes</text></g>
<g><path d="M1120,277 L1120,372" stroke="#5c5c5c" stroke-width="5" stroke-linecap="round" marker-end="url(#pl-green)"/><rect x="440" y="378" width="750" height="118" rx="16" fill="#dcefdc" stroke="#2e7d32" stroke-width="2.5" filter="url(#pl-sh)"/><text x="460" y="408" font-size="21" font-weight="800" fill="#2e7d32">The course you used</text><text x="460" y="436" font-size="17" fill="#1a1a1a">Lecture notes and slides, plus extra materials for a better class:</text><text x="460" y="460" font-size="17" fill="#1a1a1a">a practice game, a course map, a clicker, case studies,</text><text x="460" y="484" font-size="17" fill="#1a1a1a">narrated slides and interactive figures</text></g>
</svg>
