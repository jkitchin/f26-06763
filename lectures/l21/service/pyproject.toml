[project]
name = "concrete-service"
version = "1.0.0"
description = "L21: Lecture 14's concrete strength ensemble served over HTTP"
requires-python = ">=3.12,<3.13"
# Pinned exactly. The model artifact is a scikit-learn pickle, and scikit-learn does not support
# loading a model saved with a different version, so the version that trains the model and the
# version that serves it must be the same one. app.py refuses to start if they differ.
dependencies = [
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
    "scikit-learn==1.7.2",
    "numpy==2.3.4",
    "joblib==1.5.2",
]

[dependency-groups]
# Only for training the model and measuring the service (figures/make_figures.py), never in the
# image.
dev = [
    "httpx==0.28.1",
    "pandas==2.3.3",
    "xlrd==2.0.2",
    "matplotlib==3.10.7",
    "psutil==7.1.3",
]

[tool.uv]
package = false
